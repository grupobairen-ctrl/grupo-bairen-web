<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>/* El velo de carga: navy desde el primer byte, se retira cuando la página está lista de verdad:
     load + ningún esqueleto a la vista + las fotos del primer pantallazo cargadas. Si eso pasa en menos de
     500 ms nadie lo ve; si se vio, se queda hasta los 800 ms para no titilar; a los 8 s se va pase lo que
     pase. Inline y sin dependencias: si un script no carga, el velo se va igual. */
  (function(h){h.classList.add('cargando');var V=window.BPVelo={retenido:false,cargado:false},obs=null,timer=null;
  var ESQ='.p-skel,.p-skel-card,.p-skel-ficha,.p-skel-line,.p-skel-vcard,.p-skel-panel,.p-skel-form,.p-skel-bloque,.p-skel-cta,.p-fhero-skel,.h-esq';
  V.soltar=function(){if(!h.classList.contains('cargando'))return;V.retenido=false;h.classList.remove('cargando');if(obs)obs.disconnect();try{document.dispatchEvent(new Event('bairen:velo'))}catch(e){}};
  V.retener=function(){V.retenido=true};V.seguir=function(){V.retenido=false;pedir()};
  /* Visible de verdad: checkVisibility ve lo que un rectángulo no (un details cerrado, content-visibility) */
  var vis=function(e){return e.checkVisibility?e.checkVisibility({contentVisibilityAuto:true,visibilityProperty:true}):e.getClientRects().length>0};
  V.lista=function(){if(!V.cargado)return false;var es=document.querySelectorAll(ESQ),i;for(i=0;i<es.length;i++)if(vis(es[i]))return false;
    var im=document.images,H=innerHeight,W=innerWidth,r;for(i=0;i<im.length;i++){if(im[i].complete||!im[i].getAttribute('src')||!vis(im[i]))continue;r=im[i].getBoundingClientRect();if(r.width>0&&r.bottom>0&&r.top<H&&r.right>0&&r.left<W)return false}return true};
  var revisar=function(){if(V.retenido||timer||!V.lista())return;var t=performance.now();timer=setTimeout(function(){if(!V.retenido)V.soltar()},t>500?Math.max(0,800-t):0)};
  var pedido=false,pedir=function(){if(pedido)return;pedido=true;requestAnimationFrame(function(){pedido=false;revisar()})};
  addEventListener('load',function(){V.cargado=true;pedir()});
  document.addEventListener('DOMContentLoaded',function(){obs=new MutationObserver(pedir);obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','src','hidden','style']})});
  document.addEventListener('load',pedir,true);document.addEventListener('error',pedir,true);
  setTimeout(V.soltar,8000)})(document.documentElement);</script>
  <title>Emprendimientos · BAIREN</title>
  <meta name="description" content="Emprendimientos en venta directa de desarrolladoras en los barrios seleccionados de Buenos Aires.">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#131D2D">
  <link rel="icon" href="../bairen_logo_96.png?v=3" type="image/png" sizes="96x96">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://dahusnnbyrvltcuaelxj.supabase.co" crossorigin>
  <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=20260912s"><link rel="stylesheet" href="css/catalogo.css?v=20260912s"><link rel="stylesheet" href="css/portal.css?v=20260912s">
  <style>
    .p-emp{display:grid;grid-template-columns:minmax(260px,42%) 1fr;background:var(--p-card);border:1px solid var(--p-line);border-radius:var(--p-radius);overflow:hidden;margin-bottom:18px}
    .p-emp .ph{position:relative;min-height:260px;background:var(--p-tray)} .p-emp .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .p-emp .ph .tag{position:absolute;left:12px;top:12px;background:var(--navy-deeper);color:#fff;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:8px}
    .p-emp .body{padding:22px 24px} .p-emp h2{font-family:var(--font-display);font-weight:500;font-size:1.35rem;margin:0 0 4px;color:var(--navy-deeper)}
    .p-emp .desde{font-family:var(--font-display);font-size:1.4rem;color:var(--navy-deeper);margin:8px 0 2px} .p-emp .desde small{font-family:var(--font-body);font-size:.8rem;color:var(--text-mid)}
    .p-emp .facts{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--navy-deeper);margin:8px 0}
    .p-emp .units{margin-top:14px;border-top:1px solid var(--p-line);padding-top:12px} .p-emp .units summary{cursor:pointer;font-size:.86rem;color:var(--navy-deeper)}
    @media(max-width:760px){.p-emp{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="p-velo" aria-hidden="true"><span class="w">BAIREN</span></div>
<div id="pHeader"></div>
<div class="p-band"><div class="p-container">
  <div class="p-head-row" style="margin-bottom:0"><div><span class="p-eyebrow" data-i18n="ui_dato_venta_directa">Venta directa</span><h1 class="p-h2" style="font-size:clamp(1.7rem,3vw,2.3rem)" data-i18n="emprendimientos">Emprendimientos</h1><p class="p-sub" style="margin:0" data-i18n="emp_sub">En pozo, en construcción o a estrenar, vendidas por la propia desarrolladora. El contacto va directo a la empresa.</p></div><a class="p-btn" href="publicar.html#desarrolladora" data-i18n="emp_publicar">Publicar un emprendimiento</a></div>
</div></div>
<section class="p-page after-band" role="main"><div class="p-container">
  <div id="lista"><div class="p-skel" style="height:260px;border-radius:var(--p-radius);background:#EEE9DD"></div></div>
</div></section>
<div id="pFooter"></div>
<script src="supabase-portal.js" defer></script><script src="js/errores.js?v=20260912s" defer></script><script src="../mapa-barrios.js" defer></script><script src="js/motion.js" defer></script><script src="js/bairen-motion.js?v=20260912s" defer></script><script src="js/i18n-portal.js?v=20260912s" defer></script><script src="js/ui.js?v=20260912s" defer></script><script src="js/store.js?v=20260912s" defer></script><script src="js/data.js?v=20260912s" defer></script>
<script>
/* 6.1 · los scripts externos bajan en paralelo y corren en orden; esto espera a que esten */
document.addEventListener('DOMContentLoaded', function(){
(async function(){
  BP.header('venta'); BP.footer(); BP.reveal(); await BP.probePretty();
  /* Interfaz en el idioma elegido: lo estático va con data-i18n (lo aplica BP.header); lo que se arma acá usa BP.t(clave, castellano), así en es nada cambia. */
  document.title = BP.t('emp_title', 'Emprendimientos · BAIREN');
  /* La entrega viene como dato ("Diciembre 2027"): se traduce sólo el nombre del mes, respetando la mayúscula; en castellano queda igual. */
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const mesTr = s => { const tr = BP.t('emp_meses', MESES.join('|')).split('|'); return String(s).replace(/[A-Za-zÁÉÍÓÚÑáéíóúñ]+/g, w => { const i = MESES.indexOf(w.toLowerCase()); if (i < 0 || !tr[i]) return w; const t = tr[i]; return w[0] === w[0].toUpperCase() ? t[0].toUpperCase() + t.slice(1) : t; }); };
  const zona = BP.qs().get('zona');
  const { avisos } = await BPData.load();
  let emps = BPData.emprendimientos(avisos.filter(a => a.op === 'venta')); if (zona) emps = emps.filter(e => e.zona === zona);
  const ETAPA = { pozo: BP.t('emp_pozo', 'En pozo'), construccion: BP.t('emp_construccion', 'En construcción'), terminado: BP.t('emp_terminado', 'Terminado') };
  const el = document.getElementById('lista');
  if (!emps.length) { el.innerHTML = `<div class="p-empty">${BP.tf('emp_vacio', 'Todavía no hay emprendimientos publicados{donde}. Si sos desarrolladora, <a href="publicar.html#desarrolladora" style="text-decoration:underline">publicá el tuyo</a>.', { donde: zona ? BP.tf('emp_vacio_en', ' en {z}', { z: BP.esc(BP.zonaLabel(zona)) }) : '' })}</div>`; return; }
  el.innerHTML = emps.map(e => { const pub = BPData.pub(e.publicadorId); return `<article class="p-emp" data-emp="${BP.esc(e.nombre)}">
    <div class="ph">${e.foto ? `<img src="${BP.sbImg(e.foto, 900)}" alt="${BP.esc(e.nombre)}">` : ''}<span class="tag">${ETAPA[e.etapa] || ETAPA.construccion}${e.entrega ? BP.tf('emp_entrega', ' · entrega {d}', { d: BP.esc(mesTr(e.entrega)) }) : ''}</span></div>
    <div class="body"><h2>${BP.esc(e.nombre)}</h2><div class="p-barrio">${BP.esc(e.dir)}, ${BP.esc(e.barrio)}</div>
      <div class="desde">${e.desde ? BP.tf('emp_desde', 'Desde {p}', { p: BP.fmtUSD(e.desde) }) : BP.t('ui_consultar', 'Consultar')}</div>
      <div class="facts"><span>${e.unidades.length === 1 ? BP.t('emp_unidad_1', '1 unidad') : BP.tf('emp_unidades', '{n} unidades', { n: e.unidades.length })}</span>${e.ambmin ? `<span>${e.ambmin === e.ambmax ? (e.ambmin === 1 ? BP.t('emp_amb_1', '1 amb.') : BP.tf('emp_amb', '{n} amb.', { n: e.ambmin })) : BP.tf('emp_amb_rango', '{a} a {b} amb.', { a: e.ambmin, b: e.ambmax })}</span>` : ''}${e.m2min ? `<span>${e.m2min === e.m2max ? e.m2min + ' m²' : BP.tf('emp_m2_rango', '{a} a {b} m²', { a: e.m2min, b: e.m2max })}</span>` : ''}</div>
      <div class="p-publine">${BP.t('card_publica', 'Publica')} <b>${BP.esc(BPData.pubNombre(pub))}</b> ${BPData.badgeHTML(pub)}${pub.demo ? '<span class="p-badge demo">' + BP.t('card_ejemplo', 'Ejemplo') + '</span>' : ''}</div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">${pub.whatsapp ? `<a class="p-btn p-btn-sm p-btn-dark" href="https://wa.me/${encodeURIComponent(pub.whatsapp)}?text=${encodeURIComponent(BP.tf('emp_wa_msg', 'Hola, vi {t} en BAIREN y quiero más información.', { t: e.nombre }))}" target="_blank" rel="noopener" aria-label="${BP.esc(BP.tf('card_wa_aria', 'Escribir por WhatsApp a {p}', { p: BPData.pubNombre(pub) }))}" data-wa data-aviso="${BP.esc(e.key)}" data-pub="${BP.esc(pub.storeId || pub.id)}">${BP.ico.wa} WhatsApp</a>` : ''}${pub.email ? `<a class="p-btn p-btn-sm p-btn-navy" href="mailto:${encodeURIComponent(pub.email)}?subject=${encodeURIComponent(BP.tf('emp_mail_subject', 'Consulta por {t} desde BAIREN', { t: e.nombre }))}">${BP.ico.mail} ${BP.t('card_contactar', 'Contactar')}</a>` : '<span class="p-sincontacto">' + BP.t('card_contacto_pendiente', 'Contacto pendiente') + '</span>'}</div>
      <details class="units"><summary>${e.unidades.length === 1 ? BP.t('emp_ver_unidad_1', 'Ver la unidad') : BP.tf('emp_ver_unidades', 'Ver las {n} unidades', { n: e.unidades.length })}</summary><div class="p-grid" style="margin-top:12px">${e.unidades.map(BPData.cardV).join('')}</div></details>
    </div></article>`; }).join('');
})();
});
</script>
</body>
</html>
