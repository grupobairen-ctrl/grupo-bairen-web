<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · BAIREN</title>
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#131D2D">
  <link rel="icon" href="../bairen_logo_96.png?v=3" type="image/png" sizes="96x96">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=20260911y"><link rel="stylesheet" href="css/catalogo.css?v=20260911y"><link rel="stylesheet" href="css/portal.css?v=20260911y">
</head>
<body>
<div id="pHeader"></div>
<section class="p-page dark" role="main"><div class="p-container">
  <div class="p-login" data-reveal>
    <h1 id="ttl">Ingresar</h1>
    <p class="p-sub" id="sub" style="margin-bottom:18px">Favoritos, alertas, tus contactos y, si publicás, tu panel. Sin contraseña: te mandamos un código al mail.</p>
    <form id="stepMail" novalidate><label class="p-sr" for="email">Mail</label><input type="email" name="email" id="email" placeholder="Tu mail" required autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false"><button type="submit" class="p-btn p-btn-fill" style="width:100%" id="btnMail">Continuar</button></form>
    <form id="stepCode" hidden novalidate><p class="p-note" id="codeMsg" style="margin-bottom:10px" role="status"></p><label class="p-sr" for="code">Código de seis dígitos</label><input type="text" name="code" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="Código de seis dígitos" required autocomplete="one-time-code" autocapitalize="off" spellcheck="false"><button type="submit" class="p-btn p-btn-fill" style="width:100%" id="btnCode">Ingresar</button><p class="p-note" style="text-align:center;margin-top:10px"><a href="#" id="again" style="text-decoration:underline">Reenviar código</a> · <a href="#" id="back" style="text-decoration:underline">Cambiar mail</a></p></form>
    <div id="social"><div class="or">o</div><button type="button" class="soc" data-soc="google">Continuar con Google</button><button type="button" class="soc" data-soc="apple">Continuar con Apple</button></div>
    <p class="p-note" style="margin-top:14px">Al continuar aceptás los <a href="legales.html#terminos" style="text-decoration:underline">Términos y condiciones</a> y la <a href="legales.html#privacidad" style="text-decoration:underline">Política de privacidad</a>. Una cuenta por persona.</p>
    <p class="p-note" id="modeNote" style="margin-top:8px"></p>
  </div>
</div></section>
<div id="pFooter"></div>
<script src="supabase-portal.js" defer></script><script src="js/motion.js" defer></script><script src="js/bairen-motion.js?v=20260911y" defer></script><script src="js/ui.js?v=20260911y" defer></script><script src="js/store.js?v=20260911y" defer></script><script src="js/data.js?v=20260911y" defer></script>
<script>
/* 6.1 · los scripts externos bajan en paralelo y corren en orden; esto espera a que esten */
document.addEventListener('DOMContentLoaded', function(){
(async function(){
  BP.header(); BP.footer(); BP.reveal();
  const qs = BP.qs(); const volver = qs.get('volver') || 'panel'; const perfil = qs.get('perfil') || '';
  const destino = () => { if (volver === 'publicar') return 'publicar-aviso.html' + (perfil ? '?perfil=' + perfil : ''); if (volver === 'contactos') return 'panel.html#contactos'; if (volver === 'curacion') return 'curacion.html'; if (/^[a-z0-9-]+\.html(#[\w-]*)?$/i.test(volver)) return volver; return 'panel.html'; };
  const fm = document.getElementById('stepMail'), fc = document.getElementById('stepCode'), email = document.getElementById('email');
  fm.addEventListener('submit', e => e.preventDefault()); fc.addEventListener('submit', e => e.preventDefault());
  if (volver === 'publicar') { document.getElementById('ttl').textContent = 'Creá tu cuenta para publicar'; document.getElementById('sub').textContent = 'Un mail y un código. Después completás tu perfil y cargás la propiedad.'; }
  const mode = await BPStore.init();
  document.getElementById('modeNote').textContent = mode === 'local' ? 'Modo local: sin base conectada, la sesión y los datos quedan en este navegador.' : '';
  if (BPStore.session) { location.replace(destino()); return; }
  let mail = '';
  async function send(){ const b = document.getElementById('btnMail'); if (b.disabled) return; if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())) { BP.errorCampo('email', 'Revisá el mail, por ejemplo nombre@dominio.com.'); return; } b.disabled = true; b.textContent = 'Enviando…'; await BPStore.init(); let r; try { r = await BPStore.sendCode(email.value); } catch (err) { r = { ok: false, msg: err.message || 'No se pudo enviar el código.' }; } b.disabled = false; b.textContent = 'Continuar'; if (!r.ok) { BP.errorCampo('email', r.msg); return; } mail = email.value.trim().toLowerCase(); document.getElementById('codeMsg').textContent = r.msg; const _paso = () => { fm.hidden = true; document.getElementById('social').hidden = true; fc.hidden = false; }; if (window.BPM && BPM.cambioDePaso) BPM.cambioDePaso(document.querySelector('.p-login'), _paso, 1); else _paso(); const c = document.getElementById('code'); c.value = ''; c.focus(); }
  fm.addEventListener('submit', e => { e.preventDefault(); send(); });
  let reenviando = false;
  document.getElementById('again').addEventListener('click', e => { e.preventDefault(); const ag = e.currentTarget; if (reenviando) return; reenviando = true; ag.setAttribute('aria-disabled', 'true'); send(); const t0 = ag.textContent; let seg = 30; ag.textContent = 'Reenviar en 30 s'; const iv = setInterval(() => { seg--; if (seg <= 0) { clearInterval(iv); reenviando = false; ag.textContent = t0; ag.removeAttribute('aria-disabled'); } else ag.textContent = 'Reenviar en ' + seg + ' s'; }, 1000); });
  document.getElementById('back').addEventListener('click', e => { e.preventDefault(); const volver = () => { fc.hidden = true; fm.hidden = false; document.getElementById('social').hidden = false; }; if (window.BPM && BPM.cambioDePaso) BPM.cambioDePaso(document.querySelector('.p-login'), volver, -1); else volver(); });
  fc.addEventListener('submit', async e => {
    e.preventDefault(); const code = document.getElementById('code'), b = document.getElementById('btnCode');
    if (!/^\d{6,8}$/.test(code.value.trim())) { BP.errorCampo('code', 'El código tiene seis dígitos.'); return; }
    b.disabled = true; b.textContent = 'Verificando…';
    let r; try { r = await BPStore.verifyCode(mail, code.value); } catch (err) { r = { ok: false, msg: err.message || 'No se pudo verificar.' }; }
    if (!r.ok) { b.disabled = false; b.textContent = 'Ingresar'; BP.errorCampo('code', r.msg); code.select(); return; }
    b.textContent = 'Entrando…'; BP.toast('Listo, entraste.'); setTimeout(() => location.href = destino(), 500);
  });
  document.querySelectorAll('[data-soc]').forEach(b => b.addEventListener('click', async () => { if (mode === 'supabase') { const { error } = await BPStore.sb.auth.signInWithOAuth({ provider: b.dataset.soc, options: { redirectTo: location.origin + location.pathname.replace(/[^/]*$/, '') + destino() } }); if (error) BP.toast(error.message, 'error'); } else { BP.toast('Google y Apple todavía no están activos. Usá el mail.'); } }));
})();
});
</script>
</body>
</html>
