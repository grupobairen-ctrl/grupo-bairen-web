<script>
/* 6.1 · los scripts externos bajan en paralelo y corren en orden; esto espera a que esten */
document.addEventListener('DOMContentLoaded', function(){
(async function(){
  BP.header(); BP.footer(); BP.reveal();
  /* 12/9 · Idioma: los textos que este script reescribe salen de BP.t / BP.tf con el castellano por defecto (en es no cambia nada) */
  document.title = BP.t('ing_title', 'Ingresar · BAIREN');
  const T = { continuar: BP.t('ing_continuar', 'Continuar'), ingresar: BP.t('ingresar', 'Ingresar') };
  document.getElementById('ttl').textContent = T.ingresar; document.getElementById('sub').textContent = BP.t('ing_sub', 'Favoritos, alertas, tus contactos y, si publicás, tu panel. Sin contraseña: te mandamos un código al mail.');
  document.getElementById('btnMail').textContent = T.continuar; document.getElementById('btnPerfil').textContent = T.continuar; document.getElementById('btnCode').textContent = T.ingresar;
  document.getElementById('again').textContent = BP.t('ing_reenviar', 'Reenviar código');
  const qs = BP.qs(); const volver = qs.get('volver') || 'panel'; const perfil = qs.get('perfil') || '';
  /* lanz3-visitante · Quien vino desde una acción (crear una alerta, guardar) vuelve a esa misma página con sus filtros:
     se acepta una dirección de este portal con su búsqueda (buscar.html?op=…, propiedad-…, guardados.html). Nada de
     otro dominio ni de otra carpeta, y nunca de vuelta a ingresar. */
  const volverSeguro = v => { try { const base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, ''); const u = new URL(v, base); if (u.origin !== location.origin || u.href.indexOf(base) !== 0) return null; const rel = u.href.slice(base.length); return /^([a-z0-9-]+\.html|propiedad-[^/?#]+|(departamentos|pisos|ph|casas|propiedades)-[a-z0-9-]+)([?#]|$)/i.test(rel) && !/^ingresar\.html/i.test(rel) ? rel : null; } catch (e) { return null; } };
  const destino = () => { if (volver === 'publicar') return 'publicar-aviso.html' + (perfil ? '?perfil=' + perfil : ''); if (volver === 'contactos') return 'panel.html#contactos'; if (volver === 'curacion') return 'curacion.html'; if (/^[a-z0-9-]+\.html(#[\w-]*)?$/i.test(volver)) return volver; return volverSeguro(volver) || 'index.html'; };   /* 16/9 · sin destino explícito, la landing del portal (decisión de Tomás); Mi cuenta queda a un clic */
  const fm = document.getElementById('stepMail'), fc = document.getElementById('stepCode'), fp = document.getElementById('stepPerfil'), email = document.getElementById('email');
  fm.addEventListener('submit', e => e.preventDefault()); fc.addEventListener('submit', e => e.preventDefault()); fp.addEventListener('submit', e => e.preventDefault());
  if (volver === 'publicar') {
    /* 23/9/2026 · El ?perfil= viajaba hasta publicar-aviso sin que esta pantalla lo mostrara: una desarrolladora que
       venía de Membresía llegaba a un "Creá tu cuenta para publicar" genérico y no sabía si estaba en el lugar correcto.
       Ahora el título y la bajada dicen para quién es la cuenta y qué se le va a pedir después del código. */
    const T = {
      desarrolladora: ['ing_crea_desa', 'Creá tu cuenta de desarrolladora', 'ing_crea_desa_sub', 'Un mail y un código. Después cargás los datos de la empresa, el CUIT y tu primer desarrollo.'],
      profesional:    ['ing_crea_prof', 'Creá tu cuenta de inmobiliaria o corredor', 'ing_crea_prof_sub', 'Un mail y un código. Después cargás la matrícula y tu primer aviso.'],
      gestor:         ['ing_crea_gestor', 'Creá tu cuenta de gestor de alquileres', 'ing_crea_gestor_sub', 'Un mail y un código. Después cargás tus datos, el mandato de un propietario y tu primer aviso.'],
      dueno:          ['ing_crea_dueno', 'Creá tu cuenta de dueño directo', 'ing_crea_dueno_sub', 'Un mail y un código. Después cargás tu DNI, un comprobante de titularidad y la propiedad.']
    }[perfil === 'inmobiliaria' || perfil === 'corredor' ? 'profesional' : perfil] || ['ing_crea_cuenta', 'Creá tu cuenta para publicar', 'ing_crea_sub', 'Un mail y un código. Después completás tu perfil y cargás la propiedad.'];
    document.getElementById('ttl').textContent = BP.t(T[0], T[1]); document.getElementById('sub').textContent = BP.t(T[2], T[3]);
  }
  const mode = await BPStore.init();
  document.getElementById('modeNote').textContent = mode === 'local' ? BP.t('ing_modo_local', 'Modo local: sin base conectada, la sesión y los datos quedan en este navegador.') : '';
  /* 11/9 · El perfil de la cuenta se pregunta una sola vez, después del código: no si ya lo eligió, no si ya tiene
     publicador (de ahí sale solo), no si vino a publicar (lo define el paso 1 de la carga), no si vino a curar
     y no en modo demo (la sesión es de mentira). Es una preferencia del panel, no un permiso: se cambia desde Mi cuenta.
     11/9 noche · Las salidas: quien busca va a sus favoritos; el dueño directo, al panel (el vacío de Mis avisos ya
     enseña a publicar y Mis propiedades queda a un clic); el profesional, al paso 1 de la carga sin tipo marcado,
     porque ahí sí importa si es inmobiliaria o desarrolladora. Si vino con un destino (volver), ese destino manda. */
  /* 16/9 · Después de elegir el perfil también se va a la landing (decisión de Tomás). El perfil queda guardado y Mi cuenta muestra el riel que corresponde; el profesional define inmobiliaria o desarrolladora cuando toca Publicar. */
  const irA = p => 'index.html';
  const hayQuePreguntar = async () => { if (volver === 'publicar' || volver === 'curacion' || (BPStore.session && BPStore.session.demo) || BPStore.getPerfil()) return false; try { return !(await BPStore.perfilEfectivo()); } catch (e) { return true; } };
  const mostrarPregunta = () => { document.getElementById('ttl').textContent = BP.t('ing_pregunta', '¿Qué venís a hacer a BAIREN?'); document.getElementById('sub').textContent = BP.t('ing_pregunta_sub', 'Así el panel te muestra lo que te sirve. Lo cambiás cuando quieras.'); const caja = document.querySelector('.p-login'); caja.classList.add('pregunta'); const _paso = () => { fm.hidden = true; fc.hidden = true; document.getElementById('captcha').hidden = true; document.getElementById('social').hidden = true; document.getElementById('legal').hidden = true; fp.hidden = false; }; if (window.BPM && BPM.cambioDePaso) BPM.cambioDePaso(caja, _paso, 1); else _paso(); const h = document.getElementById('ttl'); h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); };
  /* La opción elegida lleva la clase .on además de :has(input:checked): el estilo no depende solo de :has() */
  fp.addEventListener('change', () => { fp.querySelectorAll('.p-quien-op').forEach(l => l.classList.toggle('on', !!l.querySelector('input:checked'))); document.getElementById('btnPerfil').disabled = !fp.querySelector('[name=perfil]:checked'); });
  fp.addEventListener('submit', async e => {
    e.preventDefault(); const r = fp.querySelector('[name=perfil]:checked'), b = document.getElementById('btnPerfil'); if (!r || b.disabled) return;
    b.disabled = true; b.textContent = BP.t('ing_guardando', 'Guardando…');
    try { await BPStore.setPerfil(r.value); } catch (err) { b.disabled = false; b.textContent = T.continuar; BP.toast(err.message || BP.t('ing_no_guardo', 'No se pudo guardar.'), 'error'); return; }
    const volverExplicito = qs.get('volver');
    location.href = volverExplicito && volverExplicito !== 'panel' ? destino() : irA(r.value);
  });
  /* 8/10/2026 · ?limpiar=1 (lo manda el freno de rebote del panel) o más de dos vueltas en 15 s: la sesión de este navegador
     está trabada. Se cierra acá y se muestra el formulario, en vez de volver al panel sin fin. */
  if (BPStore.session && (qs.get('limpiar') === '1' || BPStore.rebote('vuelta') > 2)) {
    if (qs.get('limpiar') !== '1') BPStore.avisarRebote('ingresar');
    await BPStore.cerrarSesionLocal(); if (BP.applySession) BP.applySession(null, BPStore.mode);
    BP.toast(BP.t('rebote_toast', 'Tu sesión se trabó. Volvé a ingresar con tu mail.'));
  }
  if (BPStore.session) { if (await hayQuePreguntar()) { mostrarPregunta(); return; } location.replace(destino()); return; }
  let mail = '';
  /* 8/10/2026 · Captcha del pedido de código (Cloudflare Turnstile). Solo con clave en PORTAL_CAPTCHA_SITEKEY
     (supabase-portal.js) y con la base conectada; sin clave no se carga nada de Cloudflare y todo sigue como antes.
     El widget es "interaction-only": casi nadie lo ve, aparece debajo del botón solo si Cloudflare necesita que la
     persona toque la casilla. El token se consigue mientras se escribe el mail y "Continuar" lo espera si todavía no
     llegó. Cada token sirve una vez: después de cada pedido se reinicia y el reenvío usa uno nuevo. Google no pasa por acá. */
  const CAPTCHA_ERR = () => BP.t('ing_err_captcha', 'No pudimos verificar que sos una persona. Probá de nuevo.');
  const captcha = (() => {
    const key = String(window.PORTAL_CAPTCHA_SITEKEY || '').trim();
    if (!key || mode !== 'supabase') return null;
    const caja = document.getElementById('captcha');
    let wid = null, token = '', fallo = false, interactivo = false, carga = null, esperan = [];
    const despertar = () => { const l = esperan; esperan = []; l.forEach(f => f()); };
    const cargar = () => carga || (carga = new Promise((res, rej) => {
      if (window.turnstile) return res();
      const s = document.createElement('script'); s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; s.async = true;
      s.onload = () => window.turnstile ? res() : rej(new Error('turnstile'));
      s.onerror = () => { carga = null; s.remove(); rej(new Error('turnstile')); };
      document.head.appendChild(s);
    }));
    const dibujar = () => cargar().then(() => {
      if (wid != null) return;
      caja.hidden = false;
      wid = window.turnstile.render(caja, {
        sitekey: key, appearance: 'interaction-only', size: 'flexible', theme: 'dark', language: ({ en: 'en', pt: 'pt-br' })[BP.lang] || 'es',
        callback: t => { token = t; fallo = false; despertar(); },
        'expired-callback': () => { token = ''; },   /* vence a los 5 minutos; Turnstile pide otro solo */
        'timeout-callback': () => { token = ''; fallo = true; despertar(); },
        'error-callback': () => { token = ''; fallo = true; despertar(); },
        'before-interactive-callback': () => { interactivo = true; caja.style.margin = '12px 0 4px'; },
        'after-interactive-callback': () => { interactivo = false; caja.style.margin = ''; }
      });
    }).catch(() => { fallo = true; despertar(); });
    const reiniciar = () => { token = ''; if (wid != null) { try { window.turnstile.reset(wid); } catch (e) { /* nada */ } } else dibujar(); };
    dibujar();
    return {
      listo: () => !!token,
      /* El token del próximo pedido: el que ya está o el que llegue. '' si falló, si la casilla quedó sin tocar o si
         pasan 30 segundos sin token y sin casilla a la vista. */
      token: () => new Promise(res => {
        if (token) return res(token);
        if (fallo) { fallo = false; reiniciar(); }
        const t0 = Date.now();
        const fin = () => { clearInterval(iv); res(token); };
        const iv = setInterval(() => { if (!interactivo && Date.now() - t0 > 30000) { esperan = esperan.filter(f => f !== fin); fin(); } }, 500);
        esperan.push(fin);
      }),
      usado: reiniciar   /* después de cada pedido: el token ya se gastó (o Supabase lo rechazó) */
    };
  })();
  async function send(){ const b = document.getElementById('btnMail'); if (b.disabled) return; if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())) { BP.errorCampo('email', BP.t('ing_err_mail', 'Revisá el mail, por ejemplo nombre@dominio.com.')); return; }
    /* En un reenvío el formulario del mail está oculto: el error va debajo del código, que es lo que se ve */
    const errorEnvio = msg => BP.errorCampo(fc.hidden ? 'email' : 'code', msg);
    b.disabled = true; b.textContent = BP.t('ing_enviando', 'Enviando…'); await BPStore.init();
    let captchaToken = '';
    if (captcha) {
      if (!captcha.listo()) b.textContent = BP.t('ing_verificando', 'Verificando…');
      captchaToken = await captcha.token();
      if (!captchaToken) { b.disabled = false; b.textContent = T.continuar; errorEnvio(CAPTCHA_ERR()); return; }
      b.textContent = BP.t('ing_enviando', 'Enviando…');
    }
    let r; try { r = await BPStore.sendCode(email.value, captchaToken ? { captchaToken } : undefined); } catch (err) { r = { ok: false, msg: BPStore.errorHumano(err, 'enviar') }; }
    if (captchaToken) captcha.usado();
    b.disabled = false; b.textContent = T.continuar; if (!r.ok) { errorEnvio(r.msg); return; } mail = email.value.trim().toLowerCase(); document.getElementById('codeMsg').textContent = r.msg; const _paso = () => { fm.hidden = true; document.getElementById('social').hidden = true; fc.hidden = false; }; if (window.BPM && BPM.cambioDePaso) BPM.cambioDePaso(document.querySelector('.p-login'), _paso, 1); else _paso(); const c = document.getElementById('code'); c.value = ''; c.focus(); }
  fm.addEventListener('submit', e => { e.preventDefault(); send(); });
  let reenviando = false;
  document.getElementById('again').addEventListener('click', e => { e.preventDefault(); const ag = e.currentTarget; if (reenviando) return; reenviando = true; ag.setAttribute('aria-disabled', 'true'); send(); const t0 = ag.textContent; let seg = 30; const cuenta = n => BP.tf('ing_reenviar_en', 'Reenviar en {s} s', { s: n }); ag.textContent = cuenta(30); const iv = setInterval(() => { seg--; if (seg <= 0) { clearInterval(iv); reenviando = false; ag.textContent = t0; ag.removeAttribute('aria-disabled'); } else ag.textContent = cuenta(seg); }, 1000); });
  document.getElementById('back').addEventListener('click', e => { e.preventDefault(); const volver = () => { fc.hidden = true; fm.hidden = false; document.getElementById('social').hidden = false; }; if (window.BPM && BPM.cambioDePaso) BPM.cambioDePaso(document.querySelector('.p-login'), volver, -1); else volver(); });
  fc.addEventListener('submit', async e => {
    e.preventDefault(); const code = document.getElementById('code'), b = document.getElementById('btnCode');
    if (!/^\d{6,8}$/.test(code.value.trim())) { BP.errorCampo('code', BP.t('ing_err_codigo', 'El código tiene seis dígitos.')); return; }
    b.disabled = true; b.textContent = BP.t('ing_verificando', 'Verificando…');
    let r; try { r = await BPStore.verifyCode(mail, code.value); } catch (err) { r = { ok: false, msg: BPStore.errorHumano(err, 'verificar') }; }
    if (!r.ok) { b.disabled = false; b.textContent = T.ingresar; BP.errorCampo('code', r.msg); code.select(); return; }
    b.textContent = BP.t('ing_entrando', 'Entrando…');
    if (await hayQuePreguntar()) { mostrarPregunta(); return; }
    BP.toast(BP.t('ing_listo', 'Listo, entraste.')); setTimeout(() => location.href = destino(), 500);
  });
  /* 11/9 noche · Google y Apple vuelven a esta misma página con sus parámetros: la rama de arriba (sesión ya abierta)
     decide si hace la pregunta del perfil y recién después manda al destino. Antes iban directo al destino y nunca la veían. */
  document.querySelectorAll('[data-soc]').forEach(b => b.addEventListener('click', async () => { if (mode === 'supabase') { const { error } = await BPStore.sb.auth.signInWithOAuth({ provider: b.dataset.soc, options: { redirectTo: location.origin + location.pathname.replace(/[^/]*$/, '') + 'ingresar.html' + location.search } }); if (error) BP.toast(error.message, 'error'); } else { BP.toast(BP.t('ing_social_off', 'Google y Apple todavía no están activos. Usá el mail.')); } }));
})();
});
</script>
