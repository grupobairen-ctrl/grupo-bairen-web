  const id = BP.qs().get('id') || BP.qs().get('slug') || BP.idFromPath();

  if (!a && id) {

    if (pausada) { const info = (BP.favInfo.get() || {})[id] || {}; main.innerHTML = `<section class="p-page"><div class="p-prose p-fpausada"><p class="p-fop">${BP.t('ficha_pausada_tag', 'Pausada por ahora')}</p><h1>${info.t ? BP.esc(info.t) : BP.t('ficha_pausada_t', 'Esta propiedad está pausada')}</h1><p>${BP.t('ficha_pausada_p', 'Quien la publica la pausó. Si vuelve, la vas a ver en Guardados.')}</p><p><a class="p-btn p-btn-fill" href="${BP.esc(BP.ultimaBusqueda())}">${BP.t('ficha_pausada_ver', 'Ver otras propiedades')}</a></p></div></section>`; document.title = BP.t('ficha_pausada_title', 'Propiedad pausada · BAIREN'); return; }

  const ANCHO_FOTO = Math.min(1600, Math.round((window.innerWidth || 390) * Math.min(window.devicePixelRatio || 1, 2)));

  const ANCHO_VISOR = Math.min(1800, Math.round((window.innerWidth || 390) * Math.min(window.devicePixelRatio || 1, 2)));

  const tit = BPData.titulo(a), calle = BPData.calle(a), nombre = BPData.nombre(a), desde = BPData.disponibleDesde(a);

  const expensasAparte = !!a.expensas && !BPData.expensasIncluidas(a);

  const extras = [

    a.cocheras > 0 ? (a.cocheras === 1 ? T('ficha_x_coch_1', '1 cochera') : TF('ficha_x_coch_n', '{n} cocheras', { n: a.cocheras })) : null
  ].filter(Boolean);
  /* escritorio simple · En la compu los números van en una sola línea, con lo de más al final:

  const datosLinea = numeros.map(n => n[1] === T('ficha_estadia_min', 'Estadía mínima') ? TF('cond_estadia_min', 'Estadía mínima de {p}', { p: n[0] })
    : (typeof n[0] === 'number' || /^\$/.test(String(n[0]))) ? n[0] + ' ' + String(n[1]).toLowerCase() : String(n[0])).concat(extras);
  /* Una unidad de un emprendimiento: el desarrollo (link a su página), el piso y unidad, la etapa y la entrega */
  const empLinea = a.emprendimiento ? `<p class="p-femp"><a href="${BPData.urlEmp(a)}">${BP.esc(a.emprendimiento)}</a>${[a.unidad, BPData.etapaTxt(a)].filter(Boolean).map(x => '&nbsp;· ' + BP.esc(x)).join('')}</p>` : '';

  const condiciones = [

    BPData.sinGarantia(a) ? T('ui_dato_sin_garantia_propietaria', 'Sin garantía propietaria') : null,

  const tiene = (a.amenities || []).filter(x => x !== 'Pet friendly').slice(0, 10);

  const hayMapa = (a.lat != null && a.lng != null) || !!calle;

  /* lanz3-visitante · En venta, el precio por m² cuando hay superficie */
  const porM2 = a.op === 'venta' && a.precio && a.m2 ? TF('ficha_por_m2', '{p} por m²', { p: BP.fmtPrecio(a.precio / a.m2, a.moneda) }) : '';
