  <script>/* El velo de carga: navy desde el primer byte, se retira cuando la página está lista de verdad:
     load + ningún esqueleto a la vista + las fotos del primer pantallazo cargadas. Si eso pasa en menos de
     500 ms nadie lo ve; si se vio, se queda hasta los 800 ms para no titilar; a los 8 s se va pase lo que
     pase. Inline y sin dependencias: si un script no carga, el velo se va igual. */
  (function(h){h.classList.add('cargando');var V=window.BPVelo={retenido:false,cargado:false},obs=null,timer=null;
  var ESQ='.p-skel,.p-skel-card,.p-skel-ficha,.p-skel-line,.p-skel-vcard,.p-skel-panel,.p-skel-form,.p-skel-bloque,.p-skel-cta,.p-fhero-skel,.h-esq';
  V.soltar=function(){if(!h.classList.contains('cargando'))return;V.retenido=false;h.classList.remove('cargando');if(obs)obs.disconnect();try{document.dispatchEvent(new Event('bairen:velo'))}catch(e){}};
  V.retener=function(){V.retenido=true};V.seguir=function(){V.retenido=false;pedir()};
  /* Visible de verdad: checkVisibility ve lo que un rectángulo no (un details cerrado, content-visibility) */
  var vis=function(e){return e.checkVisibility?e.checkVisibility({contentVisibilityAuto:true,visibilityProperty:true}):e.getClientRects().length>0};
  V.lista=function(){if(!V.cargado)return false;var es=document.querySelectorAll(ESQ),i;for(i=0;i<es.length;i++)if(vis(es[i]))return false;
    var im=document.images,H=innerHeight,W=innerWidth,r;for(i=0;i<im.length;i++){if(im[i].complete||!im[i].getAttribute('src')||!vis(im[i]))continue;r=im[i].getBoundingClientRect();if(r.width>0&&r.bottom>0&&r.top<H&&r.right>0&&r.left<W)return false}return true};
  var revisar=function(){if(V.retenido||timer||!V.lista())return;var t=performance.now();timer=setTimeout(function(){if(!V.retenido)V.soltar()},t>500?Math.max(0,800-t):0)};
  var pedido=false,pedir=function(){if(pedido)return;pedido=true;requestAnimationFrame(function(){pedido=false;revisar()})};
  addEventListener('load',function(){V.cargado=true;pedir()});
  document.addEventListener('DOMContentLoaded',function(){obs=new MutationObserver(pedir);obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','src','hidden','style']})});
  document.addEventListener('load',pedir,true);document.addEventListener('error',pedir,true);
  setTimeout(V.soltar,8000)})(document.documentElement);</script>

    f.hidden = true; contactOk.hidden = false; contactOk.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => contactOk.focus({ preventScroll: true }), 300);
    BP.toast(TF('ficha_toast_enviada', 'Tu consulta va directo a {p}.', { p: pubNombre }));
  });
  document.getElementById('contactOtra').addEventListener('click', () => { contactOk.hidden = true; openForm(); });
  const btnTel = document.getElementById('verTel');
  if (btnTel) btnTel.addEventListener('click', e => {
    const b = e.target.closest('button'); const tel = String(pub.telefono || '');
    if (b.dataset.visible !== '1') { b.dataset.visible = '1'; b.innerHTML = BP.ico.phone + ' ' + BP.esc(tel); if (window.BPM && BPM.ok) Motion.animate(b, { opacity: [0, 1] }, { duration: BPM.DUR.rapido, ease: BPM.CURVA }); BPStore.evento && BPStore.evento('ver_telefono', { aviso: a.id }); return; }
    const marcar = () => { location.href = 'tel:' + tel.replace(/\s/g, ''); };
    if (window.BPM && BPM.copiar) BPM.copiar(b, tel, T('ui_copiado', 'Copiado')).then(o => { if (o) BP.toast(T('ficha_tel_copiado', 'Teléfono copiado.')); else marcar(); }); else marcar();
  });
  const btnBaja = document.getElementById('bajaPrecio'); if (btnBaja) btnBaja.addEventListener('click', () => { if (btnBaja.disabled) return; btnBaja.disabled = true; btnBaja.textContent = T('ficha_alerta_creada', 'Alerta creada'); const al = BP.alerts.get(); al.push({ tipo: 'precio', avisoId: a.id, creada: new Date().toISOString() }); BP.alerts.set(al); BP.toast(T('ficha_toast_baja', 'Te avisamos si baja de precio. Con tu cuenta, por mail.')); });
  document.querySelectorAll('[data-rep]').forEach(b => b.addEventListener('click', async () => { if (b.disabled) return; document.querySelectorAll('[data-rep]').forEach(x => { x.disabled = true; }); b.textContent = T('ficha_rep_ok', 'Enviado, gracias'); const r = BP.reportes.get(); r.push({ avisoId: a.id, motivo: b.dataset.rep, fecha: new Date().toISOString() }); BP.reportes.set(r); await BPStore.addDenuncia(a.id, b.dataset.rep); BP.toast(T('ficha_rep_toast', 'Gracias. Revisamos el aviso en menos de 24 horas.')); }));
  document.getElementById('share').addEventListener('click', () => BP.compartir({ titulo: a.titulo, texto: TF('ficha_en_bairen', '{t} en BAIREN', { t: a.titulo }), url: location.href }));
  /* vistas (contador local de prueba) */
  try { const n = await BPStore.addVista(a.id); document.getElementById('vistas').textContent = n === 1 ? T('ficha_vista_1', '1 vista') : TF('ficha_vistas', '{n} vistas', { n }); } catch (e) {}
  /* mapa: el mismo embed de Google Maps que usa la ficha de bairengroup.com */
  try { const dirQ = String(a.dir || '').replace(/\bal\s+(\d)/i, '$1'); const mapsQ = encodeURIComponent(dirQ + (a.unidad && !a.dirAprox ? ' ' + a.unidad : '') + ', ' + (a.barrio || '') + ', Buenos Aires, Argentina'); const mf = document.getElementById('mapFrame'); if (mf) mf.src = 'https://www.google.com/maps?q=' + mapsQ + '&output=embed&z=' + (a.dirAprox ? 15 : 16) + '&hl=' + (BP.lang === 'pt' ? 'pt-BR' : BP.lang); } catch (e) {}
  /* JSON-LD */
  const ld = { '@context':'https://schema.org', '@type':'RealEstateListing', name: a.titulo, description: (a.descripcion||'').slice(0,300), url: location.href, image: fotos.slice(0,3), datePosted: a.publicadoEn, offers: { '@type':'Offer', price: a.precio, priceCurrency: 'USD', availability: a.reservado ? 'https://schema.org/LimitedAvailability' : 'https://schema.org/InStock', offeredBy: { '@type': pub.portal ? 'Organization' : pub.tipo === 'dueno' ? 'Person' : 'RealEstateAgent', name: pub.nombre, identifier: pub.matricula || pub.badge || 'Selección BAIREN' } }, address: { '@type':'PostalAddress', streetAddress: a.dir, addressLocality: a.barrio, addressRegion: a.ciudad, addressCountry: 'AR' } };
  const s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
})();
});
</script>
