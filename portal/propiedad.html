  let origenLb = null;
  const pintarTiras = () => {
    if (!lbTiras) return;

      lbTiras.innerHTML = fotos.map((f, i) => `<button type="button" class="t" data-lbt="${i}" aria-label="Ver foto ${i+1}"><img src="${BP.sbImg(f, 200)}" alt="" loading="lazy"></button>`).join('');
      lbTiras.querySelectorAll('[data-lbt]').forEach(b => b.addEventListener('click', () => showLb(Number(b.dataset.lbt))));
    }
    lbTiras.querySelectorAll('.t').forEach((b, i) => { const on = i === cur; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'true' : 'false'); if (on) b.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' }); });
  };
  const showLb = (i, dir) => {
    if (!fotos.length) return;

    if (grande !== chica) { const alta = new Image(); alta.onload = () => { if (lbImg.src === chica) lbImg.src = grande; }; alta.src = grande; }
    lbCount.textContent = (cur+1) + ' de ' + fotos.length;
    lb.classList.add('open'); lb.setAttribute('aria-hidden','false'); lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true');
    lb.setAttribute('aria-label', 'Fotos de ' + a.titulo); document.body.style.overflow = 'hidden';
    lb.querySelectorAll('button').forEach(x => x.removeAttribute('tabindex'));

      abridorLb = document.activeElement;

        else lbImg.addEventListener('load', () => requestAnimationFrame(listo), { once: true });

    let cerrado = false; const unaVez = () => { if (cerrado) return; cerrado = true; fin(); };
    if (window.BPM && BPM.ok) { BPM.salir(lb.querySelector('.velo')); BPM.cerrarHacia(lbImg, origenLb).then(unaVez, unaVez); setTimeout(unaVez, 400); } else unaVez();
  };
  const closeLb = () => { if (soltarLb) { const f = soltarLb; soltarLb = null; f(); } else cerrarLbSolo(); };
  /* Arrastrar con el dedo para pasar de foto */
  if (lbMarco) {
    let x0 = null;
    lbMarco.addEventListener('pointerdown', e => { x0 = e.clientX; });
    lbMarco.addEventListener('pointerup', e => {
      if (x0 === null) return; const d = e.clientX - x0; x0 = null;
      if (Math.abs(d) > 55) showLb(cur + (d < 0 ? 1 : -1), d < 0 ? 1 : -1);
    });
    lbMarco.addEventListener('pointercancel', () => { x0 = null; });
  }
  lb.querySelectorAll('button').forEach(x => x.tabIndex = -1);
  gal.querySelectorAll('[data-i]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); origenLb = el; showLb(Number(el.dataset.i)); }));
  document.querySelectorAll('#strip [data-t]').forEach(th => th.addEventListener('dblclick', () => { origenLb = th; showLb(Number(th.dataset.t)); }));
  const heroSlides = document.getElementById('heroSlides'), strip = document.getElementById('strip');
  if (heroSlides && strip) {
    const setActive = i => strip.querySelectorAll('.thumb').forEach((th, n) => th.classList.toggle('active', n === i));
    strip.querySelectorAll('[data-t]').forEach(th => th.addEventListener('click', () => { const i = Number(th.dataset.t); heroSlides.scrollTo({ left: i * heroSlides.clientWidth, behavior: 'smooth' }); setActive(i); }));
    let tk; heroSlides.addEventListener('scroll', () => { clearTimeout(tk); tk = setTimeout(() => { const i = Math.round(heroSlides.scrollLeft / Math.max(1, heroSlides.clientWidth)); setActive(i); const th = strip.querySelectorAll('.thumb')[i]; if (th) th.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); }, 80); }, { passive: true });
  }
  lb.querySelectorAll('[data-lb-close]').forEach(b => b.addEventListener('click', closeLb)); lb.querySelector('[data-lb-prev]').addEventListener('click', () => showLb(cur-1, -1)); lb.querySelector('[data-lb-next]').addEventListener('click', () => showLb(cur+1, 1));
  document.addEventListener('keydown', e => { if (!lb.classList.contains('open')) return; if (e.key === 'ArrowLeft') showLb(cur-1, -1); if (e.key === 'ArrowRight') showLb(cur+1, 1); });
  if (a.video) { const v = document.getElementById('video'); if (a.video.tipo === 'youtube') { const m = a.video.url.match(/(?:v=|be\/|embed\/)([A-Za-z0-9_-]{6,})/); v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${m ? m[1] : ''}" title="Video de ${BP.esc(a.titulo)}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`; } else if (a.video.tipo === 'bunny') { v.innerHTML = `<iframe src="${BP.esc(a.video.url)}" title="Video de ${BP.esc(a.titulo)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`; } else { v.innerHTML = `<video src="${BP.esc(a.video.url)}" controls playsinline preload="metadata"></video>`; } }
  const desc = document.getElementById('desc'), more = document.getElementById('descMore'); if (desc.scrollHeight <= desc.clientHeight + 4) more.hidden = true; more.addEventListener('click', () => { desc.classList.toggle('clamp'); more.textContent = desc.classList.contains('clamp') ? 'Leer más' : 'Leer menos'; });
  /* pestañas de características: rol de pestaña, flechas para moverse, un solo tab en el orden de tabulación */
  /* La foto del hero se retira más lento que el scroll y el titular se apaga: profundidad, no efecto */
  if (window.BPM && BPM.profundidad) BPM.profundidad('.p-fhero', '.p-fhero-slides', '.p-fhero-content');
  const tabBtns = Array.from(document.querySelectorAll('.p-tabs2 button'));
  const activarTab = b => { tabBtns.forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-selected', on ? 'true' : 'false'); x.tabIndex = on ? 0 : -1; }); ['gen','serv','amb'].forEach(k => document.getElementById('tab-' + k).hidden = k !== b.dataset.tab); };
  tabBtns.forEach((b, i) => { b.addEventListener('click', () => activarTab(b)); b.addEventListener('keydown', e => { if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return; e.preventDefault(); const n = tabBtns[(i + (e.key === 'ArrowRight' ? 1 : tabBtns.length - 1)) % tabBtns.length]; activarTab(n); n.focus(); }); });
  const mensaje = document.getElementById('mensaje'), qText = document.getElementById('qText');
  document.querySelectorAll('#quick button').forEach(b => b.addEventListener('click', () => { b.classList.toggle('on'); const qs = Array.from(document.querySelectorAll('#quick button.on')).map(x => x.textContent); mensaje.value = msgDefault + (qs.length ? ' ' + qs.join(' ') : '') + (qText.value.trim() ? ' ' + qText.value.trim() : ''); }));
  const ctaCard = document.getElementById('ctaCard'), contactForm = document.getElementById('contactForm');
  const openForm = () => { ctaCard.hidden = true; const okb = document.getElementById('contactOk'); if (okb) okb.hidden = true; contactForm.hidden = false; contactForm.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => contactForm.querySelector('input[name=nombre]').focus({ preventScroll: true }), 320); };
  const qv = document.getElementById('quiereVisita'); if (qv) qv.addEventListener('change', () => { document.getElementById('visitaCampo').hidden = !qv.checked; if (qv.checked) document.getElementById('visitaFecha').focus(); });
  const btnAbrir = document.getElementById('abrirForm'); if (btnAbrir) btnAbrir.addEventListener('click', openForm);
  const btnVisita = document.getElementById('abrirVisita'); if (btnVisita) btnVisita.addEventListener('click', () => { openForm(); const qv = document.getElementById('quiereVisita'); if (qv && !qv.checked) { qv.checked = true; qv.dispatchEvent(new Event('change')); } });
  const mctaBtn = document.getElementById('mctaBtn'); if (mctaBtn) mctaBtn.addEventListener('click', openForm);
  const qSendBtn = document.getElementById('qSend'); if (qSendBtn) qSendBtn.addEventListener('click', () => { const t = qText.value.trim(); const qs = Array.from(document.querySelectorAll('#quick button.on')).map(x => x.textContent); if (!t && !qs.length) { BP.toast('Elegí una pregunta o escribí la tuya.'); return; } mensaje.value = msgDefault + (qs.length ? ' ' + qs.join(' ') : '') + (t ? ' ' + t : ''); openForm(); });
  /* Consulta: validación en línea campo por campo, botón ocupado mientras se registra y un estado de éxito en el lugar del formulario */
  const contactOk = document.getElementById('contactOk');
  document.getElementById('contactForm').addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target; const btn = f.querySelector('button[type=submit]');
    const nombre = f.nombre.value.trim(), mail = f.email.value.trim(), tel = f.telefono.value.trim();
    if (!nombre) { BP.errorCampo('cfNombre', 'Decinos tu nombre.'); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { BP.errorCampo('cfEmail', 'Revisá el mail, por ejemplo nombre@dominio.com.'); return; }
    if (tel.replace(/\D/g, '').length < 8) { BP.errorCampo('cfTel', 'Teléfono con código de área, por ejemplo 11 5555 6666.'); return; }
    const pideVisita = !!(f.quiere_visita && f.quiere_visita.checked && f.visita_deseada && f.visita_deseada.value);
    if (f.quiere_visita && f.quiere_visita.checked && !pideVisita) { BP.errorCampo('visitaFecha', 'Elegí día y hora.'); return; }
    if (!f.acepto.checked) { BP.errorCampo('cfAcepto', 'Para enviar la consulta hay que aceptar los términos.'); return; }
    btn.disabled = true; const etiqueta = btn.innerHTML; btn.innerHTML = BP.ico.mail + ' Enviando…';
    try { await BPStore.addConsulta({ aviso_id: a.id, aviso_titulo: a.titulo, publicador_id: pub.storeId || pub.id, publicador_nombre: pub.nombre, nombre, email: mail, telefono: tel, mensaje: f.mensaje.value, acepto_tyc: true, enviada_a: pub.email, canal: pideVisita ? 'visita' : 'formulario', visita_deseada: pideVisita ? new Date(f.visita_deseada.value).toISOString() : null }); } catch (err) { console.warn(err); }
    const subject = encodeURIComponent('Consulta por ' + a.titulo + ' (' + a.codigo + ') desde BAIREN'); const body = encodeURIComponent(f.mensaje.value + (pideVisita ? '\n\nQuiero visitar el ' + new Date(f.visita_deseada.value).toLocaleString('es-AR', { weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' }) + '.' : '') + '\n\n' + nombre + ' · ' + tel + ' · ' + mail);
    if (pub.email) window.location.href = 'mailto:' + pub.email + '?subject=' + subject + '&body=' + body;
    btn.disabled = false; btn.innerHTML = etiqueta;
    f.hidden = true; contactOk.hidden = false; contactOk.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => contactOk.focus({ preventScroll: true }), 300);
    BP.toast('Tu consulta va directo a ' + pub.nombre + '.');
  });
  document.getElementById('contactOtra').addEventListener('click', () => { contactOk.hidden = true; openForm(); });
  const btnTel = document.getElementById('verTel');
  if (btnTel) btnTel.addEventListener('click', e => {
    const b = e.target.closest('button'); const tel = String(pub.telefono || '');
    if (b.dataset.visible !== '1') { b.dataset.visible = '1'; b.innerHTML = BP.ico.phone + ' ' + BP.esc(tel); if (window.BPM && BPM.ok) Motion.animate(b, { opacity: [0, 1] }, { duration: BPM.DUR.rapido, ease: BPM.CURVA }); BPStore.evento && BPStore.evento('ver_telefono', { aviso: a.id }); return; }
    const marcar = () => { location.href = 'tel:' + tel.replace(/\s/g, ''); };
    if (window.BPM && BPM.copiar) BPM.copiar(b, tel, 'Copiado').then(o => { if (o) BP.toast('Teléfono copiado.'); else marcar(); }); else marcar();
  });
  const btnBaja = document.getElementById('bajaPrecio'); if (btnBaja) btnBaja.addEventListener('click', () => { if (btnBaja.disabled) return; btnBaja.disabled = true; btnBaja.textContent = 'Alerta creada'; const al = BP.alerts.get(); al.push({ tipo: 'precio', avisoId: a.id, creada: new Date().toISOString() }); BP.alerts.set(al); BP.toast('Te avisamos si baja de precio. Con tu cuenta, por mail.'); });
  document.querySelectorAll('[data-rep]').forEach(b => b.addEventListener('click', async () => { if (b.disabled) return; document.querySelectorAll('[data-rep]').forEach(x => { x.disabled = true; }); b.textContent = 'Enviado, gracias'; const r = BP.reportes.get(); r.push({ avisoId: a.id, motivo: b.dataset.rep, fecha: new Date().toISOString() }); BP.reportes.set(r); await BPStore.addDenuncia(a.id, b.dataset.rep); BP.toast('Gracias. Revisamos el aviso en menos de 24 horas.'); }));
  document.getElementById('share').addEventListener('click', () => BP.compartir({ titulo: a.titulo, texto: a.titulo + ' en BAIREN', url: location.href }));
  /* vistas (contador local de prueba) */
  try { const n = await BPStore.addVista(a.id); document.getElementById('vistas').textContent = n + (n === 1 ? ' vista' : ' vistas'); } catch (e) {}
  /* mapa: el mismo embed de Google Maps que usa la ficha de bairengroup.com */
  try { const dirQ = String(a.dir || '').replace(/\bal\s+(\d)/i, '$1'); const mapsQ = encodeURIComponent(dirQ + (a.unidad && !a.dirAprox ? ' ' + a.unidad : '') + ', ' + (a.barrio || '') + ', Buenos Aires, Argentina'); const mf = document.getElementById('mapFrame'); if (mf) mf.src = 'https://www.google.com/maps?q=' + mapsQ + '&output=embed&z=' + (a.dirAprox ? 15 : 16) + '&hl=es'; } catch (e) {}
  /* JSON-LD */
  const ld = { '@context':'https://schema.org', '@type':'RealEstateListing', name: a.titulo, description: (a.descripcion||'').slice(0,300), url: location.href, image: fotos.slice(0,3), datePosted: a.publicadoEn, offers: { '@type':'Offer', price: a.precio, priceCurrency: 'USD', availability: a.reservado ? 'https://schema.org/LimitedAvailability' : 'https://schema.org/InStock', offeredBy: { '@type': pub.tipo === 'dueno' ? 'Person' : 'RealEstateAgent', name: pub.nombre, identifier: pub.matricula || 'Dueño verificado' } }, address: { '@type':'PostalAddress', streetAddress: a.dir, addressLocality: a.barrio, addressRegion: a.ciudad, addressCountry: 'AR' } };
  const s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
})();
});
