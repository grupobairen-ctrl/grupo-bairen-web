  const dondeBusca = b => {
    const z = (b.zonas || []).map(BP.zonaLabel); if (!z.length) return t('dg_ex_donde_todo', 'Buenos Aires');

  const lineaDe = b => b.linea || BPDigital.lineaDe(b.operacion, null, b.plazo_meses);
  const datosBusqueda = b => {
    const l = [], mes = b.operacion !== 'venta';
    if (+b.precio_max) l.push(tf('dg_ex_hasta', 'Hasta {p}', { p: BP.fmtPrecio(+b.precio_max, b.moneda) }) + (mes ? ' ' + t('dg_ex_por_mes', 'por mes') : ''));
    const dm = +b.dormitorios_min; if (dm) l.push(dm === 1 ? t('dg_ex_dorm_1', '1 dormitorio o más') : tf('dg_ex_dorm_n', '{n} dormitorios o más', { n: dm }));
    if (+b.m2_min) l.push(tf('dg_ex_m2', '{n} m² o más', { n: BP.fmtN(+b.m2_min) }));
    const f = fechaDia(b.desde); if (f) { const hoy = new Date(); hoy.setHours(0, 0, 0, 0); l.push(f > hoy ? tf('dg_ex_desde', 'Desde el {f}', { f: corta(f) }) : t('dg_ex_desde_ya', 'Para ahora')); }

  /* Hoja: sube desde abajo en el celular, panel centrado en la compu. Foco atrapado, Escape y vuelta al que la abrió. */

    const id = 'dgH' + Math.random().toString(36).slice(2, 8);

    document.body.appendChild(w); document.documentElement.classList.add('p-dg-quieta');
    requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('on')));
    const caja = w.querySelector('.p-dg-hoja'); let soltar = null, ida = false;

    w.addEventListener('mousedown', e => { if (e.target === w) cerrar(); });
    caja.querySelectorAll('[data-cerrar]').forEach(b => b.addEventListener('click', cerrar));
    return { w, caja, cerrar };
  };
  const confirmar = (titulo, texto, si, peligro) => new Promise(res => {
    let r = false;
    const h = hoja({ titulo, clase: 'p-dg-hoja-chica', primero: '[data-si]', alCerrar: () => res(r),

    h.caja.querySelector('[data-si]').addEventListener('click', () => { r = true; h.cerrar(); });
  });
  const pronto = main => {

  };

  BP.header(); BP.footer(); if (window.BPStore) BPStore.init(); await BPStore.ready;
  document.title = t('dg_ex_doc', 'Explorar') + ' · BAIREN';
  const main = $('contenido');
  if (!window.BPDigital || !BPDigital.activo()) { pronto(main); return; }
  await BP.probePretty();

  const ses = BPStore.session;
  let pub = null, cur = false;
  if (ses) [pub, cur] = await Promise.all([BPStore.getMyPublicador().catch(() => null), BPStore.isCurador().catch(() => false)]);
  const E = { avisos: [], porId: new Map(), nov: [], filtro: 'todo', ver: 20, bus: [], misBus: new Set(), misProps: [], filtroSb: 'todas', unidades: null, pubs: [] };
  const herr = !!(pub || cur);

  /* ── Estructura ── */
  const sk = n => Array.from({ length: n }, () => `<div class="p-ex-sk-item" aria-hidden="true"><span class="p-dg-sk p-ex-sk-foto"></span><span class="p-ex-sk-l"><span class="p-dg-sk"></span><span class="p-dg-sk"></span><span class="p-dg-sk"></span></span></div>`).join('');
  const urlIngresarSb = 'ingresar.html?volver=' + encodeURIComponent('explorar.html' + location.search + '#se-busca');
  const pasos = `<ol class="p-ex-pasos">
      <li><b>${esc(t('dg_ex_paso1_t', 'Publicás tu búsqueda'))}</b><span>${esc(t('dg_ex_paso1', 'Tus datos quedan reservados.'))}</span></li>
      <li><b>${esc(t('dg_ex_paso2_t', 'Recibís propuestas'))}</b><span>${esc(t('dg_ex_paso2', 'Inmobiliarias y dueños te ofrecen unidades.'))}</span></li>
      <li><b>${esc(t('dg_ex_paso3_t', 'Elegís'))}</b><span>${esc(t('dg_ex_paso3', 'Al aceptar una, conversan en BAIREN.'))}</span></li></ol>`;
  main.innerHTML = `
  <header class="p-ex-cab">
    <p class="p-ex-sobre">${BP.ico.search}<span>${esc(t('dg_ex_sobre', 'Explorar'))}</span></p>
    <h1 class="p-ex-h1">${t('dg_ex_h1', 'El mercado, <em>hoy</em>')}</h1>

  <div class="p-ex-cuerpo${herr ? ' con-herr' : ''}">
    <div class="p-ex-principal">

        ${pasos}

      </section>
    </aside>
  </div>`;
  main.removeAttribute('aria-busy');
  /* En la compu, lo propio del publicador se ve abierto; en el celular queda plegado para no empujar el feed */
  if ($('misDet')) { try { $('misDet').open = matchMedia('(min-width: 960px)').matches; } catch (e) { $('misDet').open = true; } }

  /* ── Pestañas (flechas, Inicio y Fin; #se-busca abre la segunda) ── */
  const tabs = [$('tabNov'), $('tabSb')], panes = [$('panNov'), $('panSb')];
  const abrirTab = (i, foco) => {
    tabs.forEach((b, j) => { const on = i === j; b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; panes[j].hidden = !on; if (on && !QUIETO) { panes[j].classList.remove('entra'); void panes[j].offsetWidth; panes[j].classList.add('entra'); } });

    ul.innerHTML = E.pubs.length ? E.pubs.slice(0, 6).map(p => `<li>
        <span class="p-ex-mi-t">${esc(p.titulo)}</span>
        <span class="p-ex-mi-m"><span class="p-ex-estado e-${esc(p.estado)}">${esc((EST_PUB[p.estado] || EST_PUB.en_revision)())}</span>${esc((TIPO_TXT[p.tipo] || TIPO_TXT.novedad)())}</span>
        ${p.estado === 'rechazada' && p.motivo ? `<span class="p-ex-mi-motivo">${esc(tf('dg_ex_motivo', 'Motivo: {m}', { m: p.motivo }))}</span>` : ''}
        ${p.estado === 'en_revision' || p.estado === 'publicada' ? `<button type="button" class="p-dg-link" data-retirar="${esc(p.id)}">${esc(t('dg_ex_retirar', 'Retirar'))}</button>` : ''}
      </li>`).join('')
      : `<li class="p-ex-mi-vacio">${esc(t('dg_ex_sin_pubs', 'Todavía no publicaste novedades.'))}</li>`;
  }
  const contarMis = () => { const n = $('nMis'); if (!n) return; const k = E.pubs.length + E.misProps.length; n.textContent = k || ''; n.hidden = !k; };
  function pintarMisProps(){
    const ul = $('misProps'), tt = $('misPropsT'); if (!ul) return; contarMis();
    ul.hidden = tt.hidden = !E.misProps.length; if (!E.misProps.length) return;
    const EST = { enviada: t('dg_ex_pe_enviada', 'Enviada'), aceptada: t('dg_ex_pe_aceptada', 'Aceptada'), rechazada: t('dg_ex_pe_rechazada', 'No aceptada'), retirada: t('dg_ex_pe_retirada', 'Retirada') };
    ul.innerHTML = E.misProps.slice(0, 5).map(p => `<li>
      <span class="p-ex-mi-t">${esc(p.aviso_titulo || t('dg_ex_una_unidad', 'Una unidad'))}</span>
      <span class="p-ex-mi-m"><span class="p-ex-estado e-${esc(p.estado)}">${esc(EST[p.estado] || p.estado)}</span>${esc(p.busqueda ? queBusca(p.busqueda) + ' · ' + dondeBusca(p.busqueda) : '')}</span>
      ${p.estado === 'aceptada' && p.operacion_id ? `<a class="p-dg-link" href="mensajes.html?op=${encodeURIComponent(p.operacion_id)}">${esc(t('dg_ex_conversar', 'Ir a la conversación'))}</a>` : ''}
    </li>`).join('');
  }
  async function publicarNovedad(boton){
    const unidades = await misUnidades();
    const TIPOS = [['lanzamiento', TIPO_TXT.lanzamiento()], ['avance_obra', TIPO_TXT.avance_obra()], ['novedad', TIPO_TXT.novedad()]];
    const h = hoja({ titulo: t('dg_ex_pub_btn', 'Publicar novedad'), devolverA: boton, primero: '[name=tipo]:checked',
      cuerpo: `<form class="p-dg-form" id="fNov" novalidate>
        <fieldset class="p-dg-grupo" id="gTipo"><legend>${esc(t('dg_ex_que_contas', 'Tipo'))}</legend><div class="p-dg-ops p-dg-ops-seg">
          ${TIPOS.map((x, i) => `<label class="p-dg-op"><input type="radio" name="tipo" value="${x[0]}"${i === 2 ? ' checked' : ''}><span>${esc(x[1])}</span></label>`).join('')}
        </div></fieldset>
        <label class="p-dg-campo"><span>${esc(t('dg_ex_titulo', 'Título'))}</span><input id="novTit" type="text" maxlength="120" required autocomplete="off" placeholder="${esc(t('dg_ex_titulo_ph', 'Ej.: Preventa de la torre de Núñez'))}"></label>
        <label class="p-dg-campo"><span>${esc(t('dg_ex_texto', 'Texto'))} <small>${esc(t('dg_ex_opcional', '(opcional)'))}</small></span><textarea id="novTxt" maxlength="1500" rows="5"></textarea></label>
        <div class="p-dg-fila2">
          <label class="p-dg-campo"><span>${esc(t('dg_ex_entrega_l', 'Fecha de entrega'))} <small>${esc(t('dg_ex_opcional', '(opcional)'))}</small></span><input id="novEnt" type="date"></label>
          <label class="p-dg-campo"><span>${esc(t('dg_ex_unidad_l', 'Unidad'))} <small>${esc(t('dg_ex_opcional', '(opcional)'))}</small></span><select id="novUni"><option value="">${esc(t('dg_ex_ninguna', 'Ninguna'))}</option>${unidades.map(u => `<option value="${esc(u.id)}">${esc([u._tit, u._lugar].filter(Boolean).join(' · '))}</option>`).join('')}</select></label>
        </div>
        <p class="p-dg-nota">${BP.ico.shield}<span>${esc(t('dg_ex_nov_nota', 'La revisamos antes de publicarla. Sin teléfonos ni enlaces.'))}</span></p>
        <div class="p-dg-acts"><button type="button" class="p-btn" data-cerrar>${esc(t('dg_ex_cancelar', 'Cancelar'))}</button><button type="submit" class="p-btn p-btn-fill" id="novEnviar">${esc(t('dg_ex_enviar_rev', 'Enviar a revisión'))}</button></div>
      </form>` });
    const f = h.caja.querySelector('#fNov');
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const tit = f.querySelector('#novTit'), titulo = tit.value.trim();
      if (titulo.length < 3) { BP.errorCampo(tit, t('dg_ex_err_titulo', 'Escribí un título de al menos 3 letras.')); return; }
      const btn = f.querySelector('#novEnviar'); btn.disabled = true; btn.textContent = t('dg_ex_enviando', 'Enviando…');
      try {
        await BPDigital.publicar({ tipo: f.querySelector('[name=tipo]:checked').value, titulo, texto: f.querySelector('#novTxt').value.trim() || null, entrega: f.querySelector('#novEnt').value || null, aviso_id: f.querySelector('#novUni').value || null });
        h.cerrar(); BP.toast(t('dg_ex_nov_ok', 'Recibida. Se publica cuando la aprobemos.'));
        await Promise.all([cargarMisPubs(), cur ? cargarRevisar() : null]);
      } catch (err) { btn.disabled = false; btn.textContent = t('dg_ex_enviar_rev', 'Enviar a revisión'); BP.toast(msjError(err, t('dg_ex_err_nov', 'No pudimos enviar la novedad.')), 'error'); }
    });
  }
  if (pub) {
    $('btnNov').addEventListener('click', e => publicarNovedad(e.currentTarget));
    $('misPubs').addEventListener('click', async e => {
      const b = e.target.closest('[data-retirar]'); if (!b) return;
      if (!(await confirmar(t('dg_ex_retirar_t', '¿Retirar esta publicación?'), t('dg_ex_retirar_p', 'Deja de verse en Explorar.'), t('dg_ex_retirar', 'Retirar'), true))) return;
      try { await BPDigital.estadoPublicacion(b.dataset.retirar, 'retirada'); BP.toast(t('dg_ex_retirada_ok', 'Publicación retirada.')); await Promise.all([cargarMisPubs(), cargarFeed(), cur ? cargarRevisar() : null]); }
      catch (err) { BP.toast(msjError(err, t('dg_ex_err', 'No pudimos guardar el cambio.')), 'error'); }
    });
  }

  /* ── Curación: publicaciones para revisar ── */
  async function cargarRevisar(){
    const host = $('revLista'); if (!host) return;
    let l = [];
    try { l = await BPDigital.publicacionesPendientes(); } catch (err) { host.removeAttribute('aria-busy'); BP.estadoError(host, t('dg_ex_err_rev', 'No pudimos cargar lo pendiente.'), cargarRevisar); return; }
    host.removeAttribute('aria-busy');
    const n = $('nRev'); n.textContent = l.length || ''; n.hidden = !l.length; host.closest('.p-ex-caja').classList.toggle('sin-pendientes', !l.length);
    host.innerHTML = l.length ? l.map(p => {
      const quien = p.publicador_nombre || (p.publicadores && p.publicadores.nombre) || '';
      const a = p.aviso_id ? E.porId.get(String(p.aviso_id)) : null;
      const meta = [quien && tf('dg_ex_por', 'Por {n}', { n: quien }), p.entrega && tf('dg_ex_entrega', 'Entrega estimada: {f}', { f: mesAnio(p.entrega) }), a && BPData.titulo(a)].filter(Boolean).join(' · ');
      return `<article class="p-ex-rev">
        ${tipoTag(p.tipo, p.creado_en)}
        <p class="p-ex-rev-t">${esc(p.titulo)}</p>
        ${p.texto ? `<p class="p-ex-rev-txt">${esc(p.texto)}</p>` : ''}
        ${meta ? `<p class="p-ex-rev-m">${esc(meta)}</p>` : ''}
        <div class="p-ex-acts"><button type="button" class="p-btn p-btn-sm p-btn-fill" data-aprobar="${esc(p.id)}">${esc(t('dg_ex_aprobar', 'Publicar'))}</button><button type="button" class="p-btn p-btn-sm" data-rechazar="${esc(p.id)}">${esc(t('dg_ex_rechazar', 'Rechazar'))}</button></div>
      </article>`; }).join('')
      : `<p class="p-ex-mi-vacio">${esc(t('dg_ex_rev_vacio', 'Nada pendiente.'))}</p>`;
  }
  if (cur) $('revLista').addEventListener('click', async e => {
    const ap = e.target.closest('[data-aprobar]'), re = e.target.closest('[data-rechazar]');
    if (ap) {
      ap.disabled = true;
      try { await BPDigital.estadoPublicacion(ap.dataset.aprobar, 'publicada'); BP.toast(t('dg_ex_aprobada', 'Publicada. Ya se ve en Explorar.')); await Promise.all([cargarRevisar(), cargarFeed(), pub ? cargarMisPubs() : null]); }
      catch (err) { ap.disabled = false; BP.toast(msjError(err, t('dg_ex_err', 'No pudimos guardar el cambio.')), 'error'); }
      return;
    }
    if (!re) return;
    const h = hoja({ titulo: t('dg_ex_rechazar_t', 'Rechazar la publicación'), clase: 'p-dg-hoja-chica', devolverA: re, primero: 'textarea',
      cuerpo: `<form class="p-dg-form" id="fRech" novalidate>
        <label class="p-dg-campo"><span>${esc(t('dg_ex_motivo_l', 'Motivo'))}</span><textarea id="rechMot" rows="3" maxlength="400" required placeholder="${esc(t('dg_ex_motivo_ph', 'Lo ve quien publicó, para corregirla.'))}"></textarea></label>
        <div class="p-dg-acts"><button type="button" class="p-btn" data-cerrar>${esc(t('dg_ex_cancelar', 'Cancelar'))}</button><button type="submit" class="p-btn p-btn-fill p-dg-peligro">${esc(t('dg_ex_rechazar', 'Rechazar'))}</button></div>
      </form>` });
    h.caja.querySelector('#fRech').addEventListener('submit', async ev => {
      ev.preventDefault();
      const m = h.caja.querySelector('#rechMot'); if (!m.value.trim()) { BP.errorCampo(m, t('dg_ex_err_motivo', 'Escribí el motivo: lo ve quien publicó.')); return; }
      try { await BPDigital.estadoPublicacion(re.dataset.rechazar, 'rechazada', m.value.trim()); h.cerrar(); BP.toast(t('dg_ex_rechazada_ok', 'Rechazada. Quien publicó ve el motivo.')); await Promise.all([cargarRevisar(), pub ? cargarMisPubs() : null]); }
      catch (err) { BP.toast(msjError(err, t('dg_ex_err', 'No pudimos guardar el cambio.')), 'error'); }
    });
  });

  /* ── A cargar ── */
  await cargarFeed();
  await Promise.all([cargarSb(), cur ? cargarRevisar() : null, pub ? cargarMisPubs() : null]);
})();
});
</script>
</body>
</html>
