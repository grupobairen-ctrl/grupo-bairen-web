<!-- 8/10/2026 · La operación digital · Mensajes. Dos vistas en la misma página:
     · Bandeja (mensajes.html): mis operaciones (BPDigital.bandeja), con filtros y, para la curación, "Ver todas".
     · Operación (mensajes.html?op=<id>): el chat, el recorrido de 7 pasos con los hitos intercalados, las acciones del
       paso siguiente según el lado (BPDigital.PUEDE) y los detalles (contacto, visitas, documentos, recorrido y, para la
       plataforma, el cobro simulado). En el celular es una pantalla completa tipo chat; en escritorio, dos columnas.
     Está apagada para el público: sin BPDigital.activo() muestra "Muy pronto". Toda la lógica de datos vive en js/digital.js. -->
<body class="p-product p-mensajes">
<div class="p-velo" aria-hidden="true"><span class="w">BAIREN</span></div>
<div id="pHeader"></div>
<main id="contenido" class="ms-main" aria-busy="true">
  <div class="ms-app" id="msApp">
    <section class="ms-bandeja" id="msBandeja" aria-labelledby="msTit">
      <div class="ms-bhead">
        <h1 class="ms-tit" id="msTit">Mensajes</h1>
        <button type="button" class="ms-conm" id="msTodas" aria-pressed="false" hidden>Ver todas</button>
      </div>
      <div class="ms-filtros" id="msFiltros" role="group" aria-label="Filtrar conversaciones" hidden></div>
      <div class="ms-lista" id="msLista">
        <ul class="ms-filas ms-esq" aria-hidden="true"><li><span class="ms-fila"><span class="ms-foto"></span><span class="ms-fila-cuerpo"><i></i><i></i><i></i></span></span></li><li><span class="ms-fila"><span class="ms-foto"></span><span class="ms-fila-cuerpo"><i></i><i></i><i></i></span></span></li><li><span class="ms-fila"><span class="ms-foto"></span><span class="ms-fila-cuerpo"><i></i><i></i><i></i></span></span></li></ul>
      </div>
    </section>
    <section class="ms-op" id="msOp" aria-label="Operación"></section>
  </div>
</main>
<div id="pFooter"></div>

<script src="supabase-portal.js?v=20261009a" defer></script><script src="js/errores.js?v=20261009a" defer></script>
<script src="../mapa-barrios.js?v=20261009a" defer></script>
<script src="js/bairen-motion.js?v=20261009a" defer></script><script src="js/i18n-portal.js?v=20261009a" defer></script><script src="js/ui.js?v=20261009a" defer></script><script src="js/store.js?v=20261009a" defer></script>
<script src="js/digital.js?v=20261009a" defer></script>
<script src="js/data.js?v=20261009a" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
(async function(){
  'use strict';
  BP.header(); BP.footer(); if (window.BPStore) BPStore.init();
  /* Entrada directa a una operación (aviso, ficha): en el celular, la pantalla del chat desde el primer cuadro */
  if (new URLSearchParams(location.search).get('op')) document.body.classList.add('ms-en-op');

  /* ── textos, formato e íconos ─────────────────────────── */
  const t = (k, d) => BP.t('dg_ms_' + k, d);
  const tf = (k, d, v) => BP.tf('dg_ms_' + k, d, v);
  const esc = BP.esc;
  const $ = id => document.getElementById(id);
  const main = $('contenido');
  const svg = (d, extra) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"${extra || ''}>${d}</svg>`;
  const ICO = {
    volver: svg('<path d="M15 18l-6-6 6-6"/>', ' stroke-width="1.7"'),
    enviar: svg('<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>', ' stroke-width="1.8"'),
    info: svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.7v.3"/>'),
    mas: svg('<circle cx="6" cy="12" r="1.15" fill="currentColor"/><circle cx="12" cy="12" r="1.15" fill="currentColor"/><circle cx="18" cy="12" r="1.15" fill="currentColor"/>'),
    abajo: svg('<path d="M6 9l6 6 6-6"/>'),
    doc: svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>'),
    verif: svg('<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8 7.5 9.5 4.3-1.5 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2 2 4-4"/>'),
    x: BP.ico.x, chat: BP.ico.chat, wa: BP.ico.wa, mail: BP.ico.mail, phone: BP.ico.phone
  };
  const LOC = () => BP.LOCALE();
  const dos = n => String(n).padStart(2, '0');
  const fecha = v => { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d; };
  const hhmm = d => dos(d.getHours()) + ':' + dos(d.getMinutes());
  const mismoDia = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const ddmm = d => d.getDate() + '/' + (d.getMonth() + 1);
  const diaCorto = d => { try { return d.toLocaleDateString(LOC(), { weekday: 'short' }).replace(/\.$/, ''); } catch (e) { return ''; } };
  /* "jue 20/10 15:00" */
  const fmtVisita = v => { const d = fecha(v); return d ? (diaCorto(d) + ' ' + ddmm(d) + ' ' + hhmm(d)).trim() : ''; };
  const fmtFechaHora = v => { const d = fecha(v); if (!d) return ''; return ddmm(d) + (d.getFullYear() !== new Date().getFullYear() ? '/' + d.getFullYear() : '') + ' ' + hhmm(d); };
  /* La hora de la bandeja: "Ahora", "hace 5 min", "15:02", "Ayer", "lun", "6/10" */
  const horaRel = v => {
    const d = fecha(v); if (!d) return '';
    const ahora = new Date(), min = (ahora - d) / 60000;
    if (min < 1) return t('ahora', 'Ahora');
    if (min < 60) return tf('hace_min', 'hace {n} min', { n: Math.floor(min) });
    if (mismoDia(d, ahora)) return hhmm(d);
    const ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
    if (mismoDia(d, ayer)) return t('ayer', 'Ayer');
    if (ahora - d < 6 * 864e5) return diaCorto(d);
    return ddmm(d) + (d.getFullYear() !== ahora.getFullYear() ? '/' + String(d.getFullYear()).slice(2) : '');
  };
  const diaLargo = d => {
    const hoy = new Date(); if (mismoDia(d, hoy)) return t('hoy', 'Hoy');
    const ayer = new Date(); ayer.setDate(ayer.getDate() - 1); if (mismoDia(d, ayer)) return t('ayer', 'Ayer');
    let s = ''; try { s = d.toLocaleDateString(LOC(), d.getFullYear() !== hoy.getFullYear() ? { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' } : { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { s = ddmm(d); }
    return s.charAt(0).toUpperCase() + s.slice(1);
  };
  const fmtPeriodo = p => { const m = /^(\d{4})-(\d{2})$/.exec(p || ''); if (!m) return p || ''; try { return new Date(+m[1], +m[2] - 1, 1).toLocaleDateString(LOC(), { month: 'long', year: 'numeric' }); } catch (e) { return p; } };
  const fmtMonto = (n, moneda) => n == null ? '' : (moneda === 'ARS' ? '$ ' : 'USD ') + Number(n).toLocaleString(LOC(), { maximumFractionDigits: 2 });
  const recorte = (s, n) => { const x = String(s || '').replace(/\s+/g, ' ').trim(); return x.length > n ? x.slice(0, n - 1).trimEnd() + '…' : x; };
  const iso = v => { const d = fecha(v); return d ? d.toISOString() : null; };
  const limpio = o => { if (!o) return null; const r = {}; Object.keys(o).forEach(k => { const v = o[k]; if (v !== undefined && v !== null && v !== '') r[k] = v; }); return Object.keys(r).length ? r : null; };
  const movil = () => matchMedia('(max-width: 859px)').matches;
  const panelFlotante = () => !matchMedia('(min-width: 1280px)').matches;
  const quieto = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TIPO_PUB = { dueno: t('tp_dueno', 'Dueño directo'), profesional: t('tp_profesional', 'Inmobiliaria'), inmobiliaria: t('tp_profesional', 'Inmobiliaria'), desarrolladora: t('tp_desarrolladora', 'Desarrolladora'), gestor: t('tp_gestor', 'Gestora') };
  const EST_V = { pedida: t('v_pedida', 'Pedida'), confirmada: t('v_confirmada', 'Confirmada'), realizada: t('v_realizada', 'Hecha'), cancelada: t('v_cancelada', 'Cancelada'), pendiente: t('v_pendiente', 'Pendiente') };
  const DOC_T = { reserva: t('doc_reserva', 'Reserva'), contrato: t('doc_contrato', 'Contrato'), boleto: t('doc_boleto', 'Boleto'), convenio: t('doc_convenio', 'Convenio'), inventario: t('doc_inventario', 'Inventario'), otro: t('doc_otro', 'Documento') };
  const DOC_E = { borrador: t('doc_borrador', 'Borrador'), enviado: t('doc_enviado', 'Enviado'), firmado: t('doc_firmado_e', 'Firmado'), anulado: t('doc_anulado', 'Anulado') };
  const EST_C = { simulado: t('c_simulado', 'Simulado'), pendiente: t('c_pendiente', 'Pendiente'), facturado: t('c_facturado', 'Facturado'), cobrado: t('c_cobrado', 'Cobrado'), anulado: t('c_anulado', 'Anulado') };
  const PAGA = { publicador: t('paga_publicador', 'paga quien publica'), interesado: t('paga_interesado', 'paga quien busca'), propietario: t('paga_propietario', 'paga el propietario') };
  const nom = s => { const x = String(s || '').trim(); return x ? x.charAt(0).toUpperCase() + x.slice(1) : x; };
  const crear = html => { const tpl = document.createElement('template'); tpl.innerHTML = html.trim(); return tpl.content; };

  document.title = t('titulo', 'Mensajes') + ' · BAIREN';
  $('msTit').textContent = t('titulo', 'Mensajes');
  $('msFiltros').setAttribute('aria-label', t('filtros_aria', 'Filtrar conversaciones'));
  $('msOp').setAttribute('aria-label', t('op_aria', 'Operación'));

  /* ── interruptor y sesión ─────────────────────────────── */
  if (window.BPStore && BPStore.ready) await BPStore.ready;
  const D = window.BPDigital;
  if (!D || !D.activo()) { pronto(); return; }
  if (!window.BPStore || !BPStore.requireSession()) return;
  try { await BP.probePretty(); } catch (e) { /* enlaces con .html */ }

  function pronto(){
    document.body.classList.remove('ms-en-op');
    main.removeAttribute('aria-busy');
    main.innerHTML = `<div class="ms-pronto">
      <span class="ms-pronto-ico">${ICO.chat}</span>
      <h1 class="ms-pronto-t">${esc(t('pronto_t', 'Mensajes, muy pronto'))}</h1>
      <p class="ms-pronto-p">${esc(t('pronto_p', 'Vas a poder hablar con quien publica, coordinar visitas y seguir cada paso de la operación sin salir de BAIREN.'))}</p>
      <a class="ms-btn ms-btn-navy" href="index.html">${esc(t('pronto_btn', 'Volver al inicio'))}</a></div>`;
  }

  /* ── estado ───────────────────────────────────────────── */
  const st = {
    lista: [], firmaLista: '', filtro: 'todas', todas: false, cur: false,
    opId: null, d: null, firmaD: '', msjs: [], ids: new Set(), ultimoId: 0, dibujados: new Set(), ult: {}, corte: null,
    gen: 0, tick: 0, timer: null, ocupado: false, enviando: false, plegadas: {}, borradores: {}, soltarPanel: null, soltarMas: null, scrollBandeja: 0
  };
  const app = $('msApp'), opEl = $('msOp'), listaEl = $('msLista');
  try { st.todas = sessionStorage.getItem('bp_ms_todas') === '1'; } catch (e) {}

  /* ════════════════ Bandeja ════════════════ */
  const cerrada = r => r.etapa === 'cerrada' || r.etapa === 'caida';
  function filtradas(){
    const l = st.lista;
    if (st.filtro === 'interesado') return l.filter(r => r.lado === 'interesado');
    if (st.filtro === 'publicador') return l.filter(r => r.lado === 'publicador');
    if (st.filtro === 'cerradas') return l.filter(cerrada);
    return l;
  }
  function pintarFiltros(){
    const host = $('msFiltros');
    const hayI = st.lista.some(r => r.lado === 'interesado'), hayP = st.lista.some(r => r.lado === 'publicador');
    const fs = [['todas', t('f_todas', 'Todas')]];
    if (hayI && hayP) fs.push(['interesado', t('f_interesado', 'Como interesado')], ['publicador', t('f_publicador', 'Como publicador')]);
    fs.push(['cerradas', t('f_cerradas', 'Cerradas')]);
    if (!fs.some(f => f[0] === st.filtro)) st.filtro = 'todas';
    host.hidden = !st.lista.length;
    host.innerHTML = fs.map(f => `<button type="button" class="ms-filtro" data-f="${f[0]}" aria-pressed="${f[0] === st.filtro}">${esc(f[1])}</button>`).join('');
  }
  $('msFiltros').addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    st.filtro = b.dataset.f; st.firmaLista = ''; pintarBandeja();
    const nb = $('msFiltros').querySelector(`[data-f="${st.filtro}"]`); if (nb) nb.focus();
  });
  const fotoHTML = (url, titulo, cls, ancho, ya) => {
    const ini = (String(titulo || 'B').trim().charAt(0) || 'B').toUpperCase();
    return `<span class="ms-foto ${cls || ''}" aria-hidden="true"><span class="ms-foto-ini">${esc(ini)}</span>${url ? `<img src="${esc(BP.sbImg(url, ancho || 200))}" alt=""${ya ? '' : ' loading="lazy"'} decoding="async" onerror="this.remove()">` : ''}</span>`;
  };
  const etapaHTML = e => `<span class="ms-etapa ms-e-${esc(e)}">${esc(D.ETAPA_TXT[e] || e)}</span>`;
  function contraparteFila(r){
    if (r.lado === 'plataforma') return [nom(r.contraparte), r.publicador_nombre].filter(Boolean).join(t('con_y', ' con '));
    return (r.lado === 'publicador' ? nom(r.contraparte) : r.contraparte) || (r.lado === 'interesado' ? t('quien_publica', 'Quien publica') : t('interesado', 'Interesado'));
  }
  function filaHTML(r){
    const on = r.id === st.opId;
    const nl = (on && !document.hidden) ? 0 : (r.no_leidos || 0);
    const yo = r.ultimo_lado && r.ultimo_lado === r.lado;
    const pref = !r.ultimo_texto ? '' : yo ? t('vos', 'Vos') + ': ' : r.ultimo_lado === 'plataforma' ? t('equipo_corto', 'BAIREN') + ': ' : '';
    const ult = r.ultimo_texto ? pref + recorte(r.ultimo_texto, 120) : t('sin_mensajes', 'Sin mensajes todavía');
    const cuando = r.ultimo_en || r.actualizada_en;
    return `<li><a class="ms-fila${nl ? ' sin-leer' : ''}${on ? ' on' : ''}${cerrada(r) ? ' archivada' : ''}" href="mensajes.html?op=${esc(encodeURIComponent(r.id))}" data-op="${esc(r.id)}"${on ? ' aria-current="true"' : ''}>
      ${fotoHTML(r.foto, r.aviso_titulo, 'ms-fila-foto')}
      <span class="ms-fila-cuerpo">
        <span class="ms-fila-l1"><span class="ms-fila-tit">${esc(r.aviso_titulo || t('una_unidad', 'Una propiedad'))}</span><time class="ms-fila-hora" datetime="${esc(cuando || '')}">${esc(horaRel(cuando))}</time></span>
        <span class="ms-fila-l2"><span class="ms-fila-con">${esc(contraparteFila(r))}${r.aviso_lugar ? ' · ' + esc(r.aviso_lugar) : ''}</span>${etapaHTML(r.etapa)}</span>
        <span class="ms-fila-l3"><span class="ms-fila-ult">${esc(ult)}</span>${nl ? `<span class="ms-nl"><span aria-hidden="true">${nl > 99 ? '99+' : nl}</span><span class="ms-sr">${esc(nl === 1 ? t('nl_uno', 'un mensaje sin leer') : tf('nl_varios', '{n} mensajes sin leer', { n: nl }))}</span></span>` : ''}</span>
      </span></a></li>`;
  }
  function vacioBandeja(){
    return `<div class="ms-vacio"><span class="ms-vacio-ico">${ICO.chat}</span>
      <p class="ms-vacio-t">${esc(t('vacio_t', 'Todavía no tenés conversaciones'))}</p>
      <p class="ms-vacio-p">${esc(t('vacio_p', 'Cuando le escribas a quien publica una propiedad, la conversación y cada paso de la operación van a quedar acá.'))}</p>
      <a class="ms-btn ms-btn-navy" href="buscar.html">${esc(t('vacio_btn', 'Buscar propiedades'))}</a></div>`;
  }
  function pintarBandeja(){
    const firma = JSON.stringify([st.filtro, st.opId, document.hidden, st.lista.map(r => [r.id, r.etapa, r.ultimo_en, r.ultimo_texto, r.no_leidos, r.actualizada_en, horaRel(r.ultimo_en || r.actualizada_en)])]);
    if (firma === st.firmaLista) return; st.firmaLista = firma;
    pintarFiltros();
    const foco = document.activeElement && listaEl.contains(document.activeElement) ? (document.activeElement.dataset.op || null) : null;
    const arriba = listaEl.scrollTop;
    const filas = filtradas();
    if (!st.lista.length) listaEl.innerHTML = vacioBandeja();
    else if (!filas.length) listaEl.innerHTML = `<p class="ms-lista-vacia">${esc(t('vacio_filtro', 'No hay conversaciones con este filtro.'))}</p>`;
    else listaEl.innerHTML = `<ul class="ms-filas">${filas.map(filaHTML).join('')}</ul>`;
    listaEl.scrollTop = arriba;
    if (foco) { const a = listaEl.querySelector(`[data-op="${CSS.escape(foco)}"]`); if (a) a.focus({ preventScroll: true }); }
    const n = st.lista.reduce((s, r) => s + ((r.id === st.opId && !document.hidden) ? 0 : (r.no_leidos || 0)), 0);
    document.title = (n ? '(' + n + ') ' : '') + t('titulo', 'Mensajes') + ' · BAIREN';
  }
  async function cargarBandeja(silencioso){
    try {
      const l = await D.bandeja({ todas: st.todas && st.cur });
      st.lista = Array.isArray(l) ? l : [];
      pintarBandeja();
    } catch (e) {
      if (silencioso) { console.warn('bandeja', e); return; }
      st.firmaLista = '';
      BP.estadoError(listaEl, (e && e.message) || t('err_bandeja', 'No pudimos cargar tus mensajes.'), () => cargarBandeja());
    }
  }
  listaEl.addEventListener('click', e => {
    const a = e.target.closest('a[data-op]'); if (!a) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
    e.preventDefault(); irA(a.dataset.op, true);
  });
  const conm = $('msTodas');
  conm.addEventListener('click', async () => {
    st.todas = !st.todas; conm.setAttribute('aria-pressed', String(st.todas));
    try { sessionStorage.setItem('bp_ms_todas', st.todas ? '1' : '0'); } catch (e) {}
    st.firmaLista = ''; await cargarBandeja();
    BP.anunciar(st.todas ? t('todas_on', 'Ves todas las operaciones de BAIREN.') : t('todas_off', 'Ves solo tus operaciones.'));
  });

  /* ════════════════ Operación ════════════════ */
  const ladoTxt = l => l === 'plataforma' ? t('equipo', 'Equipo BAIREN') : l === 'publicador' ? ((st.d && st.d.publicador && st.d.publicador.nombre) || t('quien_publica', 'Quien publica')) : l === 'interesado' ? (nom(st.d && st.d.interesado && st.d.interesado.nombre) || t('interesado', 'Interesado')) : 'BAIREN';
  const esVenta = op => op.linea === 'venta' || op.linea === 'pozo' || (!op.linea && op.tipo === 'venta');
  const hitosOrden = () => (st.d.hitos || []).slice().sort((a, b) => (+new Date(a.creado_en) - +new Date(b.creado_en)) || (a.id - b.id));
  function ultimoDe(tipos){ const hs = hitosOrden(); for (let i = hs.length - 1; i >= 0; i--) if (tipos.indexOf(hs[i].tipo) > -1) return hs[i]; return null; }
  function pedidaPendiente(){ const u = ultimoDe(['visita_pedida', 'visita_confirmada', 'visita_realizada', 'visita_cancelada']); return u && u.tipo === 'visita_pedida' && u.datos && u.datos.fecha ? u : null; }
  function visitaPendiente(){

      velo.addEventListener('mousedown', e => { if (e.target === velo) cerrar(null); });

            if (c.pos && !(num > 0)) return mostrarErr(tf('num_pos', '"{c}" tiene que ser mayor a cero.', { c: c.label }), c.n);
            if (c.max != null && num > c.max) return mostrarErr(tf('num_max', '"{c}" puede ser hasta {m}.', { c: c.label, m: c.max }), c.n);

    if (Array.isArray(d.cargos)) secs.push(det('cobro', t('s_cobro', 'Cobro (simulado)'), cobroHTML(), d.cargos.length));
    p.innerHTML = `<div class="ms-panel-head"><h3 class="ms-panel-t" id="msPanelT">${esc(t('detalles', 'Detalles'))}</h3><button type="button" class="ms-ico-btn" data-cerrar-panel aria-label="${esc(t('cerrar_detalles', 'Cerrar los detalles'))}">${ICO.x}</button></div><div class="ms-panel-in">${secs.join('')}</div>`;
    p.querySelectorAll('details[data-sec]').forEach(x => x.addEventListener('toggle', () => { st.plegadas[x.dataset.sec] = !x.open; }));
  }
  function abrirPanel(){
    opEl.classList.add('ms-panel-on'); const btn = opEl.querySelector('.ms-info-btn'); if (btn) btn.setAttribute('aria-expanded', 'true');
    const p = $('msPanel'); if (!p || !panelFlotante()) return;
    st.soltarPanel = BP.focoAtrapado(p, { devolverA: btn, primero: p.querySelector('[data-cerrar-panel]'), alCerrar: () => { st.soltarPanel = null; cerrarPanel(true); } });
  }
  function cerrarPanel(desdeTrampa){
    opEl.classList.remove('ms-panel-on'); const btn = opEl.querySelector('.ms-info-btn'); if (btn) btn.setAttribute('aria-expanded', 'false');
    if (!desdeTrampa && st.soltarPanel) { const f = st.soltarPanel; st.soltarPanel = null; f(); }
  }

  /* ── El chat: mensajes y renglones de los hitos, en orden ── */
  function itemsTodos(){
    const ms = st.msjs.map(m => ({ k: 'm' + m.id, t: +new Date(m.creado_en), m }));
    const hs = (st.d && st.d.hitos || []).map(h => ({ k: 'h' + h.id, t: +new Date(h.creado_en), h }));
    return ms.concat(hs).sort((a, b) => (a.t - b.t) || (a.k < b.k ? -1 : a.k > b.k ? 1 : 0));
  }
  function msjHTML(m, cont, nuevo){
    const lado = st.d.lado, equipo = m.lado === 'plataforma', mio = !equipo && m.lado === lado;
    const cls = equipo ? 'equipo' : mio ? 'mio' : (lado === 'plataforma' && m.lado === 'publicador') ? 'otro der' : 'otro';
    const quien = mio ? t('vos', 'Vos') : ladoTxt(m.lado);
    const etiqueta = (equipo || lado === 'plataforma') && !cont ? `<span class="ms-quien" aria-hidden="true">${esc(quien)}</span>` : '';
    const f = fecha(m.creado_en) || new Date();
    return `<div class="ms-m ${cls}${cont ? ' cont' : ''}${nuevo ? ' ms-entra' : ''}" data-k="m${esc(m.id)}">${etiqueta}<div class="ms-burb"><span class="ms-sr">${esc(quien)}: </span>${esc(m.texto)}</div><span class="ms-meta"><time datetime="${esc(m.creado_en)}">${esc(hhmm(f))}</time><span class="ms-visto"></span></span></div>`;
  }
  function hitoHTML(h, nuevo){
    const x = hitoTexto(h), f = fecha(h.creado_en) || new Date();
    return `<div class="ms-hito ms-hito-${esc(h.tipo)}${nuevo ? ' ms-entra' : ''}" data-k="h${esc(h.id)}"><span class="ms-hito-t"><b>${esc(x.base)}</b>${x.det ? ' · ' + esc(x.det) : ''}${x.conFecha ? '' : `<span class="ms-hito-h"> · ${esc(hhmm(f))}</span>`}</span></div>`;
  }
  const cercaDelFinal = el => el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  function abajoDelTodo(suave){
    const l = $('msLog'); if (!l) return;
    l.scrollTo({ top: l.scrollHeight, behavior: suave && !quieto() ? 'smooth' : 'auto' });
    const n = $('msNuevos'); if (n) n.hidden = true;
  }
  /* Agrega lo que falta al final del registro (sin redibujar lo anterior: el lector de pantalla lee solo lo nuevo) */
  function agregar(nuevo){
    const log = $('msLog'); if (!log || !st.d) return;
    const estabaAbajo = cercaDelFinal(log);
    const frag = document.createDocumentFragment(); let propios = false, ajenos = false;
    itemsTodos().forEach(it => {
      if (st.dibujados.has(it.k)) return; st.dibujados.add(it.k);
      const d = new Date(it.t), dk = d.toDateString();
      if (dk !== st.ult.dia) { frag.appendChild(crear(`<div class="ms-dia" role="separator"><span>${esc(diaLargo(d))}</span></div>`)); st.ult = { dia: dk }; }
      if (it.h) { frag.appendChild(crear(hitoHTML(it.h, nuevo))); st.ult = { dia: dk }; return; }
      const m = it.m;
      if (st.corte != null && m.id === st.corte) { frag.appendChild(crear(`<div class="ms-corte" role="separator"><span>${esc(t('sin_leer', 'Sin leer'))}</span></div>`)); st.ult = { dia: dk }; }
      const cont = !!st.ult.el && st.ult.lado === m.lado && (it.t - st.ult.t) < 300000;
      if (cont) st.ult.el.classList.add('sig');
      const el = crear(msjHTML(m, cont, nuevo)).firstElementChild; el._m = m;
      frag.appendChild(el); st.ult = { dia: dk, lado: m.lado, t: it.t, el };
      if (m.lado === st.d.lado) propios = true; else ajenos = true;
    });
    if (!frag.childNodes.length) return;
    log.appendChild(frag);
    marcarVisto();
    if (!nuevo) return;
    if (estabaAbajo || propios) abajoDelTodo(true);
    else if (ajenos) { const n = $('msNuevos'); if (n) n.hidden = false; }
  }
  function pintarLog(){
    const log = $('msLog'); if (!log) return;
    log.setAttribute('aria-live', 'off');
    log.innerHTML = ''; st.dibujados = new Set(); st.ult = {};
    agregar(false);
    if (!log.children.length) log.innerHTML = `<p class="ms-log-vacio">${esc(t('log_vacio', 'Todavía no hay mensajes. Escribí el primero.'))}</p>`;
    const c = log.querySelector('.ms-corte');
    if (c) log.scrollTop = Math.max(0, c.offsetTop - 24); else log.scrollTop = log.scrollHeight;
    setTimeout(() => log.setAttribute('aria-live', 'polite'), 300);
  }
  /* "Visto" debajo del último mensaje propio, cuando la otra parte lo leyó */
  function marcarVisto(){
    const log = $('msLog'); if (!log || !st.d || st.d.lado === 'plataforma') return;
    const mios = log.querySelectorAll('.ms-m.mio'); log.querySelectorAll('.ms-visto').forEach(s => { s.textContent = ''; });
    const ult = mios[mios.length - 1]; if (!ult || !ult._m) return;
    if (ult._m.leido_en) ult.querySelector('.ms-visto').textContent = ' · ' + t('visto', 'Visto');
  }
  function sumar(lista){
    let n = 0;
    (lista || []).forEach(m => { if (!m || st.ids.has(m.id)) return; st.ids.add(m.id); st.msjs.push(m); n++; if (+m.id > st.ultimoId) st.ultimoId = +m.id; });
    if (n) { const v = $('msLog') && $('msLog').querySelector('.ms-log-vacio'); if (v) v.remove(); agregar(true); }
    return n;
  }

  /* ── Escribir ──────────────────────────────────────────── */
  function prepararComposer(){
    const f = $('msComp'), ta = $('msTexto'), b = $('msEnviar');
    const ajustar = () => { ta.style.height = 'auto'; const alto = ta.scrollHeight + 2; ta.style.height = Math.min(alto, 140) + 'px'; ta.style.overflowY = alto > 140 ? 'auto' : 'hidden'; b.disabled = !ta.value.trim() || st.enviando; if (st.opId) st.borradores[st.opId] = ta.value; };
    ta.addEventListener('input', ajustar);
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); enviar(); } });
    f.addEventListener('submit', e => { e.preventDefault(); enviar(); });
    ta.addEventListener('focus', () => { if (movil()) setTimeout(() => { const l = $('msLog'); if (l && cercaDelFinal(l)) abajoDelTodo(false); }, 320); });
    ta._ajustar = ajustar;
  }
  function habilitarComposer(){
    const ta = $('msTexto'); if (!ta || !st.d) return;
    ta.disabled = false;
    ta.placeholder = st.d.lado === 'plataforma' ? t('ph_equipo', 'Escribí como equipo BAIREN') : t('ph', 'Escribí un mensaje');
    ta.value = st.borradores[st.opId] || ''; ta._ajustar();
  }
  async function enviar(){
    const ta = $('msTexto'), b = $('msEnviar'); if (!ta || !st.d) return;
    const texto = ta.value.trim(); if (!texto || st.enviando) return;
    const op = st.opId, etapaAntes = st.d.operacion.etapa;
    st.enviando = true; b.disabled = true; ta.setAttribute('aria-busy', 'true');
    try {
      const m = await D.enviar(op, st.d.lado, texto);
      if (st.opId !== op) return;
      ta.value = ''; delete st.borradores[op]; sumar([m]);
      if (etapaAntes === 'consulta' || !(st.d.hitos || []).some(h => h.tipo === 'conversacion')) recargarDetalle(true);
      cargarBandeja(true);
    } catch (e) { BP.toast((e && e.message) || t('err_enviar', 'No pudimos mandar el mensaje. Probá de nuevo.'), 'error'); }
    finally { st.enviando = false; ta.removeAttribute('aria-busy'); if (ta._ajustar) ta._ajustar(); if (!movil()) ta.focus(); }
  }

  /* ── Abrir, recargar y cerrar una operación ────────────── */
  const firmaDetalle = d => JSON.stringify([d.operacion && [d.operacion.etapa, d.operacion.motivo_caida, d.operacion.monto_contrato, d.operacion.precio_cierre, d.operacion.plazo_meses, d.operacion.moneda, d.operacion.linea], d.lado, (d.hitos || []).map(h => h.id), (d.visitas || []).map(v => [v.id, v.estado, v.fecha]), (d.documentos || []).map(x => [x.id, x.estado]), d.cargos && d.cargos.length, d.publicador && d.publicador.whatsapp, d.interesado && [d.interesado.telefono, d.interesado.verificado]]);
  async function recargarDetalle(silencioso){
    const op = st.opId, g = st.gen;
    try {
      const d = await D.detalle(op); if (g !== st.gen) return;
      const firma = firmaDetalle(d); st.d = d;
      if (firma === st.firmaD) return; st.firmaD = firma;
      pintarHead(); pintarRecorrido(); pintarAcciones(); pintarPanel(); agregar(true);
      const btn = opEl.querySelector('.ms-info-btn'); if (btn) btn.setAttribute('aria-expanded', String(opEl.classList.contains('ms-panel-on')));
    } catch (e) { if (!silencioso) throw e; console.warn('detalle', e); }
  }
  async function abrirOp(id, conFoco){
    const g = ++st.gen;
    if (!st.opId && movil()) st.scrollBandeja = window.scrollY;
    cerrarMas(); if (st.soltarPanel) cerrarPanel();
    Object.assign(st, { opId: id, d: null, firmaD: '', msjs: [], ids: new Set(), ultimoId: 0, dibujados: new Set(), ult: {}, corte: null });
    opEl.classList.remove('ms-panel-on');
    document.body.classList.add('ms-en-op'); app.classList.add('con-op');
    st.firmaLista = ''; pintarBandeja();
    esqueletoOp();
    try {
      const [d, ms] = await Promise.all([D.detalle(id), D.mensajes(id)]);
      if (g !== st.gen) return;
      st.d = d; st.firmaD = firmaDetalle(d);
      const lado = d.lado;
      const primero = lado !== 'plataforma' ? (ms || []).find(m => m.lado !== lado && !m.leido_en) : null;
      if (primero && (ms || []).indexOf(primero) > 0) st.corte = primero.id;
      (ms || []).forEach(m => { st.ids.add(m.id); st.msjs.push(m); if (+m.id > st.ultimoId) st.ultimoId = +m.id; });
      pintarHead(); pintarRecorrido(); pintarAcciones(); pintarPanel(); pintarLog(); habilitarComposer();
      main.removeAttribute('aria-busy');
      document.title = recorte((d.aviso && d.aviso.titulo) || t('titulo', 'Mensajes'), 48) + ' · ' + t('titulo', 'Mensajes') + ' · BAIREN';
      if (conFoco) { const h = $('msOpTit'); if (h) h.focus({ preventScroll: true }); }
      const n = await D.leidos(id);
      if (n) { const r = st.lista.find(x => x.id === id); if (r) r.no_leidos = 0; st.firmaLista = ''; pintarBandeja(); }
    } catch (e) {
      if (g !== st.gen) return;
      console.warn('operación', e); main.removeAttribute('aria-busy'); errorOp(e);
    }
  }
  function cerrarOp(){
    st.gen++; cerrarMas(); if (st.soltarPanel) cerrarPanel();
    const previa = st.opId; st.opId = null; st.d = null;
    document.body.classList.remove('ms-en-op'); app.classList.remove('con-op'); opEl.classList.remove('ms-panel-on');
    opVacia(); st.firmaLista = ''; pintarBandeja();
    document.title = t('titulo', 'Mensajes') + ' · BAIREN';
    if (movil()) window.scrollTo(0, st.scrollBandeja || 0);
    const a = previa ? listaEl.querySelector(`[data-op="${CSS.escape(previa)}"]`) : null; if (a) a.focus({ preventScroll: !movil() });
  }
  function irA(id, empujar){
    const url = id ? 'mensajes.html?op=' + encodeURIComponent(id) : 'mensajes.html';
    if (empujar) {
      if (id && st.opId && !movil()) history.replaceState({ op: id, empujado: !!(history.state && history.state.empujado) }, '', url);
      else history.pushState({ op: id || null, empujado: !!id }, '', url);
    }
    if (id) abrirOp(id, true); else cerrarOp();
  }
  /* Volver: si esta misma página abrió la operación, el atrás del navegador; si se entró directo, a la bandeja */
  function volver(){ if (history.state && history.state.op && history.state.empujado) history.back(); else irA(null, true); }
  window.addEventListener('popstate', () => { const id = new URLSearchParams(location.search).get('op'); if (id) { if (id !== st.opId) abrirOp(id, true); } else if (st.opId) cerrarOp(); });

  /* ── iPhone: el teclado no tapa el campo (la pantalla de la operación sigue al viewport visible) ── */
  function ajustarVisual(){
    const vv = window.visualViewport; if (!vv) return;
    if (!document.body.classList.contains('ms-en-op') || !movil()) { opEl.style.removeProperty('--ms-alto'); opEl.style.removeProperty('--ms-arriba'); return; }
    opEl.style.setProperty('--ms-alto', Math.round(vv.height) + 'px');
    opEl.style.setProperty('--ms-arriba', Math.round(vv.offsetTop) + 'px');
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', ajustarVisual); visualViewport.addEventListener('scroll', ajustarVisual); }
  window.addEventListener('resize', () => { ajustarVisual(); if (!panelFlotante() && st.soltarPanel) { const f = st.soltarPanel; st.soltarPanel = null; f(); opEl.classList.remove('ms-panel-on'); } });
  /* El aviso "Mensajes nuevos" se va solo al llegar abajo (scroll no burbujea: se escucha en captura) */
  document.addEventListener('scroll', e => { const l = $('msLog'), n = $('msNuevos'); if (l && n && e.target === l && !n.hidden && cercaDelFinal(l)) n.hidden = true; }, { capture: true, passive: true });

  /* ── Lo nuevo, cada 8 s con la pestaña a la vista ───────── */
  async function traerNuevos(completo){
    const op = st.opId, g = st.gen; if (!op || !st.d) return;
    const nuevos = await D.mensajes(op, st.ultimoId || undefined); if (g !== st.gen) return;
    const ajenos = (nuevos || []).filter(m => !st.ids.has(m.id) && m.lado !== st.d.lado);
    sumar(nuevos);
    if (ajenos.length) { await D.leidos(op); const r = st.lista.find(x => x.id === op); if (r) r.no_leidos = 0; }
    if (completo || ajenos.length) await recargarDetalle(true);
    if (completo && st.d && st.d.lado !== 'plataforma') {
      const todos = await D.mensajes(op); if (g !== st.gen) return;
      const porId = new Map((todos || []).map(m => [m.id, m]));
      let cambio = false;
      st.msjs.forEach(m => { const x = porId.get(m.id); if (x && x.leido_en && !m.leido_en) { m.leido_en = x.leido_en; cambio = true; } });
      sumar(todos);
      if (cambio) { const log = $('msLog'); if (log) log.querySelectorAll('.ms-m').forEach(el => { if (el._m) { const x = porId.get(el._m.id); if (x && x.leido_en) el._m.leido_en = x.leido_en; } }); marcarVisto(); }
    }
  }
  async function tic(){
    if (document.hidden || st.ocupado) return;
    st.ocupado = true; st.tick++;
    try {
      if (st.opId) await traerNuevos(st.tick % 3 === 0);
      if (st.tick % (st.opId ? 3 : 2) === 0) await cargarBandeja(true);
      else pintarBandeja();
    } catch (e) { console.warn('actualización', e); }
    finally { st.ocupado = false; }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { st.firmaLista = ''; tic(); } });

  /* ── Arranque ─────────────────────────────────────────── */
  try { st.cur = await BPStore.isCurador(); } catch (e) { st.cur = false; }
  if (st.cur) { conm.hidden = false; conm.textContent = t('ver_todas', 'Ver todas'); conm.setAttribute('aria-pressed', String(st.todas)); } else st.todas = false;
  await cargarBandeja();
  main.removeAttribute('aria-busy');
  const inicial = new URLSearchParams(location.search).get('op');
  history.replaceState({ op: inicial || null }, '', location.href);
  if (inicial) abrirOp(inicial, false); else opVacia();
  st.timer = setInterval(tic, 8000);
})();
});
</script>
