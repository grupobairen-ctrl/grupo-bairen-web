<!DOCTYPE html>

  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>/* El velo de carga: navy desde el primer byte, se retira cuando la página está lista de verdad:
     load + ningún esqueleto a la vista + las fotos del primer pantallazo cargadas. Si eso pasa en menos de
     500 ms nadie lo ve; si se vio, se queda hasta los 800 ms para no titilar; a los 8 s se va pase lo que
     pase. Inline y sin dependencias: si un script no carga, el velo se va igual. */
  (function(h){h.classList.add('cargando');var V=window.BPVelo={retenido:false,cargado:false},obs=null,timer=null;
  var ESQ='.p-skel,.p-skel-card,.p-skel-ficha,.p-skel-line,.p-skel-vcard,.p-skel-panel,.p-skel-form,.p-skel-bloque,.p-skel-cta,.p-fhero-skel,.h-esq';
  V.soltar=function(){if(!h.classList.contains('cargando'))return;V.retenido=false;h.classList.remove('cargando');if(obs)obs.disconnect();try{document.dispatchEvent(new Event('bairen:velo'))}catch(e){}};
  V.retener=function(){V.retenido=true};V.seguir=function(){V.retenido=false;pedir()};
  /* Visible de verdad: checkVisibility ve lo que un rectángulo no (un details cerrado, content-visibility) */
  var vis=function(e){return e.checkVisibility?e.checkVisibility({contentVisibilityAuto:true,visibilityProperty:true}):e.getClientRects().length>0};
  V.lista=function(){if(!V.cargado)return false;var es=document.querySelectorAll(ESQ),i;for(i=0;i<es.length;i++)if(vis(es[i]))return false;
    var im=document.images,H=innerHeight,W=innerWidth,r;for(i=0;i<im.length;i++){if(im[i].complete||!im[i].getAttribute('src')||!vis(im[i]))continue;r=im[i].getBoundingClientRect();if(r.width>0&&r.bottom>0&&r.top<H&&r.right>0&&r.left<W)return false}return true};
  var revisar=function(){if(V.retenido||timer||!V.lista())return;var t=performance.now();timer=setTimeout(function(){if(!V.retenido)V.soltar()},t>500?Math.max(0,800-t):0)};
  var pedido=false,pedir=function(){if(pedido)return;pedido=true;requestAnimationFrame(function(){pedido=false;revisar()})};
  addEventListener('load',function(){V.cargado=true;pedir()});
  document.addEventListener('DOMContentLoaded',function(){obs=new MutationObserver(pedir);obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','src','hidden','style']})});
  document.addEventListener('load',pedir,true);document.addEventListener('error',pedir,true);
  setTimeout(V.soltar,8000)})(document.documentElement);</script>
  <title>Kit visual de la red · BAIREN</title>
  <meta name="description" content="Las piezas de la red BAIREN, construidas: tipografía, botones, chips, sellos, tarjetas, propuesta, obra, perfil y barra."><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#131D2D">

<body class="r-body">
<div class="p-velo" aria-hidden="true"><span class="w">BAIREN</span></div>
<div id="pHeader"></div>
<main id="contenido" class="r-contenedor" aria-busy="true">
  <div class="r-esq" aria-hidden="true"><span class="p-skel-line t"></span><span class="p-skel-line"></span><span class="p-skel-line"></span></div>
</main>
<div id="pFooter"></div>

<script src="../mapa-barrios.js?v=20261003a" defer></script><script src="supabase-portal.js?v=20261003a" defer></script><script src="js/errores.js?v=20261003a" defer></script>
<script src="js/motion.js?v=20261003a" defer></script><script src="js/bairen-motion.js?v=20261003a" defer></script>

<script>
/* El kit visual de la red (4/10/2026): cada pieza construida de verdad, con datos reales del portal cuando los hay.
   Es la referencia para todo lo que se construya después: si una pieza cambia, cambia acá primero. Página interna (noindex). */
document.addEventListener('DOMContentLoaded', function(){ (async function(){
  BP.header('red'); BP.footer(); if (window.BPStore) BPStore.init();
  const R = BPRed, esc = BP.esc, main = document.getElementById('contenido');
  await BP.probePretty();
  let avisos = [];
  try { ({ avisos } = await BPData.load()); } catch (e) { console.error(e); }
  avisos = (avisos || []).filter(a => !a.demo && a.fotos && a.fotos.length);
  const a1 = avisos[0], a2 = avisos[1] || avisos[0];
  const busq = Object.assign(R.vacia(), { intencion: a1 && a1.op === 'venta' ? 'comprar' : 'alquilar', zonas: a1 ? [a1.zona] : ['Palermo'], ambMin: 2, presupuestoMax: a1 && a1.precio ? Math.round(a1.precio * 1.05) : 700000, imprescindibles: ['vista', 'cochera'] });
  const c1 = a1 ? R.coincidencia(a1, busq) : null;
  const pub = a1 ? BPData.pub(a1.publicadorId) : null;
  const nPub = a1 ? avisos.filter(a => a.publicadorId === a1.publicadorId).length : 0;
  const ej = '<span class="r-ejemplo">Ejemplo</span>';

  const bloque = (id, ceja, titulo, para, lienzo, navy) => `<section class="r-kit-bloque" id="${id}"><header><p class="r-ceja">${ceja}</p><h2 class="r-h2" style="margin:0">${titulo}</h2><p>${para}</p></header><div class="r-kit-lienzo${navy ? ' navy' : ''}">${lienzo}</div></section>`;

  main.innerHTML = `
    <header class="r-ini-cab" style="padding-bottom:8px"><div>
      <p class="r-ceja">Kit visual de la red</p>
      <h1 class="r-h1">Las piezas de BAIREN, <em>construidas</em>.</h1>
      <p class="r-bajada">Cada pieza de la red tal como se ve en el portal, con datos reales donde los hay. Lo inventado para mostrar va rotulado como ejemplo.</p>
      <ul class="r-kit-indice">
        <li><a href="#tipografia">Tipografía</a></li><li><a href="#botones">Botones</a></li><li><a href="#chips">Chips</a></li><li><a href="#sellos">Sellos</a></li>
        <li><a href="#tarjeta">Tarjeta de unidad</a></li><li><a href="#busqueda">Búsqueda sin nombres</a></li><li><a href="#propuesta">Propuesta</a></li>
        <li><a href="#obra">Línea de obra</a></li><li><a href="#perfil">Perfil</a></li><li><a href="#medidor">Medidor</a></li><li><a href="#barra">Barra inferior</a></li>
      </ul>
    </div></header>

    ${bloque('tipografia', 'Tipografía', 'La frase que importa, en <em>itálica oro</em>.', 'Playfair para títulos y cifras; Jost para leer; versalitas espaciadas para rótulos. Una sola frase en itálica oro por título.', `
      <p class="r-ceja" style="margin:0">Rótulo en versalitas</p>
      <p class="r-h1" style="margin:0">Si no está a la altura, <em>no entra</em>.</p>
      <p class="r-h2" style="margin:0">Seguí lo que te <em>importa</em></p>
      <p class="r-bajada" style="margin:0">Texto para leer, con aire: nunca más de 65 caracteres por línea.</p>
      <p class="r-dato" style="margin:0">Dato tabular · 186 m² · 4 amb. · USD 1.150.000</p>`)}

    ${bloque('botones', 'Botones', 'Una acción importante por <em>pantalla</em>.', 'Navy lleno para la acción; contorno para lo secundario; subrayado oro para lo terciario. El oro nunca rellena un botón.', `
      <div class="r-kit-fila"><button type="button" class="r-btn flecha">Ver propiedades</button><button type="button" class="r-btn r-btn-sec">Seguir</button><button type="button" class="r-btn-link">Editar</button><button type="button" class="r-btn" disabled>Desactivado</button></div>
      <p class="r-kit-nota">La flecha aparece solo cuando el botón lleva a otra pantalla.</p>`)}

    ${bloque('chips', 'Chips', 'Elegir sin <em>pensar</em>.', 'Contorno para lo que se puede elegir; navy con tilde para lo elegido. Siempre con su estado accesible.', `
      <div class="r-chips"><button type="button" class="r-chip" aria-pressed="true">Vista abierta</button><button type="button" class="r-chip" aria-pressed="true">Piso alto</button><button type="button" class="r-chip" aria-pressed="false">Cochera</button><button type="button" class="r-chip" aria-pressed="false">Palermo <small>13</small></button></div>`)}

    ${bloque('sellos', 'Sellos', 'Lo que alguien <em>comprobó</em>.', 'Filete oro, nunca relleno. Tres sellos, y solo cuando el dato está verificado.', `
      <div class="r-kit-fila">${R.sello('Miembro verificado · hasta USD 1,2 M')}${R.sello('Matrícula CUCICBA verificada')}${R.sello('Obra entregada')}</div>
      <div class="r-kit-fila">${ej}</div>`)}

    ${bloque('tarjeta', 'Tarjeta de unidad', 'La foto manda; la coincidencia <em>explica</em>.', 'Foto vertical 4:5 producida, la coincidencia sobre la foto, la dirección en serif y qué le falta para la búsqueda. La grande abre el inicio del miembro.', a1 ? `
      <div class="r-grilla">${R.tarjeta(a1, c1)}${a2 && a2 !== a1 ? R.tarjeta(a2, R.coincidencia(a2, busq)) : ''}</div>
      <p class="r-kit-nota">Unidades reales del portal, contra una búsqueda de ejemplo: ${esc(R.resumen(busq))}.</p>
      ${R.tarjeta(a1, c1, { grande: true, ceja: 'La que mejor coincide' })}` : '<p class="r-kit-nota">No pudimos traer unidades del portal.</p>')}

    ${bloque('busqueda', 'Búsqueda sin nombres', 'Lo que ve <em>el que vende</em>.', 'Grupos de tres búsquedas o más, para que nadie sea identificable. El que vende manda su unidad; la base elige a quién le llega.', `
      <div class="r-busq-grilla">${R.busq({ zona: 'Palermo', operacion: 'venta', amb_min: 4, presupuesto_desde: 1000000, presupuesto_hasta: 2000000, busquedas: 12, imprescindibles: ['vista', 'cochera'] }, { ejemplo: true })}${R.busq({ zona: 'Recoleta', operacion: 'alquiler', amb_min: 2, presupuesto_desde: 1000, presupuesto_hasta: 2000, busquedas: 5, imprescindibles: ['amoblado'] }, { ejemplo: true })}</div>`)}

    ${bloque('propuesta', 'Propuesta', 'Dos respuestas, un <em>toque</em>.', '"Me interesa" abre el contacto; "No, gracias" pide un motivo opcional que mejora las próximas. Nadie ve los datos del miembro antes de que acepte.', a1 ? `
      <div style="max-width:440px">${R.prop(a1, { ejemplo: true, de: pub && pub.nombre, nota: 'Tiene la vista que buscás. Se puede visitar esta semana.', porque: c1 ? R.frase(c1) : '' })}</div>` : '')}

    ${bloque('obra', 'Línea de obra', 'De la excavación a la <em>entrega</em>.', 'Los hitos que carga la desarrolladora. El actual en oro; lo que falta, en contorno.', `
      <div style="max-width:520px">${ej}${R.obraLinea([{ titulo: 'Excavación', fecha: '2026-03-01', porcentaje: 10 }, { titulo: 'Estructura', fecha: '2026-07-01', porcentaje: 45 }, { titulo: 'Cerramientos', fecha: '2026-10-01', porcentaje: 70, nota: 'Carpinterías en los pisos altos.' }, { titulo: 'Entrega', fecha: '2027-04-01', porcentaje: 100 }], { actual: 2 })}</div>
      <p class="r-kit-nota">Se ve completa en <a href="obra.html?e=ejemplo">la obra de ejemplo</a>.</p>`)}

    ${bloque('perfil', 'Perfil', 'Hechos, no <em>seguidores</em>.', 'Sin corazones ni contadores de gente. Lo que se puede comprobar: unidades, tiempo de respuesta, desde cuándo publica, matrícula.', pub ? `
      <div class="r-perfil" style="max-width:520px">
        <div class="r-perfil-portada">${a1 && a1.fotos[0] ? `<img src="${esc(BP.sbImg(a1.fotos[0], 900))}" alt="">` : ''}</div>
        <span class="r-perfil-logo">${esc((pub.nombre || 'B').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase())}</span>
        <b class="r-h3" style="margin:0">${esc(pub.nombre || '')}</b>
        ${pub.badge ? R.sello(pub.badge) : ''}
        <div class="r-hechos"><div><b>${nPub}</b><span>unidades</span></div><div><b>–</b><span>responde</span></div><div><b>2026</b><span>desde</span></div></div>
        <button type="button" class="r-btn r-btn-sec">Seguir</button>
      </div>
      <p class="r-kit-nota">El tiempo de respuesta se calcula cuando haya consultas suficientes; mientras, va un guion.</p>` : '')}

    ${bloque('medidor', 'Medidor de la búsqueda', 'Cuánto falta para recibir <em>mejores propuestas</em>.', 'El premio de completarla son mejores propuestas, no una medalla.', R.progresoHTML(busq, { completar: false }))}

    ${bloque('barra', 'Barra inferior', 'La red en el <em>celular</em>.', 'Cinco destinos fijos. Lo nuevo se marca con un punto oro, nunca con un número rojo.', R.tabbar('inicio', { muestra: true, punto: ['propuestas'] }))}
  `;
  main.removeAttribute('aria-busy');
  R.engancharProps(main, () => Promise.resolve());
  main.querySelectorAll('.r-chips .r-chip').forEach(x => x.addEventListener('click', () => x.setAttribute('aria-pressed', x.getAttribute('aria-pressed') !== 'true')));
  if (window.BPM) { if (BPM.titular) BPM.titular(main.querySelector('.r-h1')); if (BPM.init) BPM.init(main); }
})(); });
</script>
</body>
</html>
