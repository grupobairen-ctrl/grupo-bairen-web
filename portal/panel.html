/* 6.5 · Cuatro páginas bajaban todo para terminar redirigiendo a Ingresar.
   La comprobación de sesión ocurre acá, antes de los datos y de los assets pesados.
   Solo decide en modo local; con base conectada decide el store, que ya tiene la sesión. */
(function(){try{
  var u=localStorage.getItem('bp_user');
  var sb=Object.keys(localStorage).some(function(k){return k.indexOf('sb-')===0&&k.indexOf('auth-token')>-1});
  /* 8/10/2026 · Desde el 17/9 la sesión vive en una cookie de .bairengroup.com (sb-…-auth-token.0), no en localStorage:
     sin mirarla, quien entró después del 17/9 rebotaba entre esta página e Ingresar sin fin (iPhone, ventana privada). */
  var ck=/(?:^|;\s*)sb-[^=;]*auth-token(?:\.\d+)?=/.test(document.cookie);
  var demo=/[?&]demo=1(&|$)/.test(location.search)||sessionStorage.getItem('bp_demo')==='1';
  /* Freno: si ya mandó dos veces a Ingresar en 15 s, no manda más (decide el store, que mira la base). */
  var fk='bp_rebote_temprano',ahora=Date.now(),fl=[];try{fl=JSON.parse(sessionStorage.getItem(fk)||'[]').filter(function(t){return ahora-t<15000});}catch(e){}
  if((!u||u==='null')&&!sb&&!ck&&!demo&&fl.length<2){fl.push(ahora);try{sessionStorage.setItem(fk,JSON.stringify(fl));}catch(e){}location.replace('ingresar.html?volver='+encodeURIComponent('panel.html'));}
}catch(e){}})();
</script>

<script>
/* 6.1 · los scripts externos bajan en paralelo y corren en orden; esto espera a que esten */
document.addEventListener('DOMContentLoaded', function(){
(async function(){
  BP.header(); BP.footer();
  const mode = await BPStore.init();
  if (!BPStore.requireSession('panel.html')) return;
  const pub = await BPStore.getMyPublicador();
  const curador = await BPStore.isCurador();
  /* 8/10/2026 (venta) · El dueño directo sin verificar: qué documentos mandó (DNI y titularidad). null si no se pudo leer. */
  const verifs = pub && pub.tipo === 'dueno' && !pub.verificado && BPStore.misVerificaciones ? await BPStore.misVerificaciones(pub.id) : null;
  const docs = BPStore.docsEnviados ? BPStore.docsEnviados(verifs) : {};
  const faltanDocs = Array.isArray(verifs) && !(docs.dni && docs.titularidad);
  const faltanDocsTxt = () => !docs.dni && !docs.titularidad ? BP.t('pan_faltan_docs', 'Faltan tu DNI y el comprobante de titularidad.') : !docs.dni ? BP.t('pan_falta_dni', 'Falta tu DNI.') : BP.t('pan_falta_tit', 'Falta el comprobante de titularidad.');
  const URL_DOCS = 'publicar-aviso.html?paso=documentos';
  /* 12/9 · Idioma: todo lo visible pasa por BP.t / BP.tf con el castellano como valor por defecto (en es no cambia nada).
     Los rótulos del riel usan las mismas claves que el desplegable "Mi cuenta" del header (ui.js). Las fechas siguen a
     BP.lang; los datos (títulos, barrios, nombres) no se traducen; los estados del aviso sí, por clave. */
  document.title = BP.t('pan_title', 'Panel · BAIREN');
  const LOC = ({ en: 'en-US', pt: 'pt-BR' })[BP.lang] || 'es-AR';
  const estadoBadge = e => `<span class="p-badge ${e==='publicado'?'':e==='rechazado'||e==='cambios'?'demo':'dueno'}">${e === 'cambios' ? BP.t('pan_est_cambios', 'Cambios pedidos') : BP.t('pan_est_' + e, BP.estadoLabel(e))}</span>`;
  /* 8/10/2026 (lanz3-publicador) · Un borrador con motivo es uno al que la curación le pidió cambios: dice eso, no "Borrador" */
  const estadoDe = a => a.estado_curacion === 'borrador' && a.motivo_rechazo ? 'cambios' : a.estado_curacion;
  const TABS = [['avisos','Mis avisos','building','mis_avisos'],['propiedades','Mis propiedades','home','mis_propiedades'],['interesados','Interesados','chat','interesados'],['contactos','Mis contactos','mail','mis_contactos'],['favoritos','Favoritos','heart','favoritos'],['alertas','Búsquedas y alertas','bell','alertas'],['cuenta','Mi cuenta','user','mi_cuenta']];
  const nav = document.getElementById('sideNav'), content = document.getElementById('content');
  /* 11/9 · El riel según el perfil de la cuenta (busca, dueno, profesional): una preferencia que se elige al crear la
     cuenta y se cambia en Mi cuenta, no un permiso. Sin perfil (cuenta vieja, demo) el riel completo, como siempre.
     Importar no es una vista: va como enlace a importar.html, con su propio ícono porque el set de ui.js no tiene uno.
     11/9 noche · La lista de ids vive en BPStore.rielDe: la misma que usa el desplegable "Mi cuenta" del header. */
  let perfil = BPStore.getPerfil() || BPStore.perfilDePublicador(pub);   /* lo mismo que BPStore.perfilEfectivo(), sin volver a pedir el publicador */
  const ICO_IMPORTAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>';
  let riel = BPStore.rielDe(perfil, pub);
  const primeraVista = () => riel.find(id => TABS.some(t => t[0] === id)) || 'avisos';
  /* Feedback de una visita: lo escribe el corredor, lo lee el propietario en "Mis propiedades". */
  content.addEventListener('submit', async e => {
    const f = e.target.closest('.p-fb'); if (!f) return; e.preventDefault();
    const txt = f.fb.value.trim(); if (!txt) return;
    try { await BPStore.feedbackVisita(f.dataset.id, txt); BP.toast(BP.t('pan_fb_guardado', 'Guardado. El propietario lo ve en su cuenta.')); await renderAvisos(); }
    catch (err) { BP.toast(BPStore.demo ? BP.t('img_demo', 'En modo demo no se guarda.') : BPStore.errorAlGuardar(err), 'error'); }
  });
  /* Confirmar una visita pedida desde la ficha: crea la visita (la ve el propietario) y avisa. */
  content.addEventListener('click', async e => {
    const b = e.target.closest('[data-confirmar]'); if (!b) return;
    b.disabled = true;
    try { await BPStore.addVisita(b.dataset.aviso, { tipo: 'visita', fecha: b.dataset.fecha, nota: 'Visita pedida desde la ficha por ' + b.dataset.nombre, consulta_id: b.dataset.confirmar, estado: 'confirmada' }); const marca = document.createElement('span'); marca.className = 'p-badge p-visita-ok'; marca.innerHTML = BP.ico.check + ' ' + BP.esc(BP.t('pan_confirmada', 'Confirmada')); b.replaceWith(marca); BP.toast(BP.tf('pan_visita_confirmada', 'Visita confirmada. Avisale a {n} por WhatsApp o mail.', { n: b.dataset.nombre })); }
    catch (err) { b.disabled = false; BP.toast(BPStore.demo ? BP.t('img_demo', 'En modo demo no se guarda.') : BPStore.errorAlGuardar(err, BP.t('pan_no_confirmo_g', 'No se pudo confirmar la visita.')), 'error'); }
  });
  document.addEventListener('click', e => { if (!e.target.closest('details.p-mas')) document.querySelectorAll('details.p-mas[open]').forEach(d => { d.open = false; }); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('details.p-mas[open]').forEach(d => { d.open = false; const sm = d.querySelector('summary'); if (sm) sm.focus(); }); });
  let tab = (location.hash || '').slice(1); if (!TABS.some(t => t[0] === tab)) tab = primeraVista();
  /* Contadores del riel: lo que ya se sabe (favoritos, alertas) va enseguida; avisos e interesados los completa la vista al cargar */
  const cuenta = { favoritos: BP.favs.get().length, alertas: BP.alerts.get().length };
  const contador = k => cuenta[k] != null && cuenta[k] > 0 ? `<span class="n">${cuenta[k]}</span>` : '';
  /* 12/9 · El contador de alertas se completa con las de la base (sin frenar el riel); la vista Alertas ya lo hace al cargar */
  if (tab !== 'alertas' && riel.indexOf('alertas') > -1) BPStore.cargarAlertas().then(l => actualizarContador('alertas', l.length)).catch(() => {});
  function renderNav(){
    /* Si llegó por hash a una vista que su perfil no muestra (un profesional a #favoritos), se muestra igual y el riel la suma antes de Mi cuenta: nunca un callejón sin salida */
    const ids = riel.slice(); if (TABS.some(t => t[0] === tab) && ids.indexOf(tab) === -1) ids.splice(Math.max(0, ids.indexOf('cuenta')), 0, tab);
    const item = id => { const t = TABS.find(x => x[0] === id); if (t) return `<a href="#${t[0]}" class="${t[0]===tab?'on':''}"${t[0]===tab?' aria-current="page"':''}>${BP.ico[t[2]]}<span>${BP.t(t[3], t[1])}</span>${contador(t[0])}</a>`; if (id === 'importar') return `<a href="importar.html">${ICO_IMPORTAR}<span>${BP.t('importar_cartera', 'Importar')}</span></a>`; if (id === 'os') return `<a href="${BPStore.OS_URL}" rel="noopener" title="${BP.esc(BP.t('pan_os_title', 'Visitas, reservas y cobros de tus unidades'))}">${BP.ico.arrow}<span>${BP.t('bairen_os', 'Bairen OS')}</span></a>`; return ''; };
    /* 12/9 · La imagen de la cuenta (48 px) a la izquierda del mail y el perfil; sin imagen, el ícono genérico */
    nav.innerHTML = `<div class="who">${BP.avatar(BPStore.getAvatar(), 'p-avatar-who', 48)}<span class="txt"><span class="q">${BP.esc(BPStore.session.email).replace(/@(.*)$/, '<wbr><span class="dom">@$1</span>')}</span>${perfil ? `<span class="rol">${BPStore.perfilTxt(perfil, pub)}</span>` : ''}${mode === 'local' ? `<span class="p-badge demo">${BP.t('pan_modo_local', 'modo local')}</span>` : ''}</span></div><div class="p-rail">` + ids.map(item).join('') + `</div><div class="p-rail p-rail-pie">` + (curador ? `<a href="curacion.html">${BP.ico.shield}<span>${BP.t('curacion', 'Curación')}</span></a>` : '') + `<a href="#" data-logout>${BP.ico.x}<span>${BP.t('cerrar_sesion', 'Cerrar sesión')}</span></a></div>`; BP.avatarFallback(nav, BPStore.session.email); nav.querySelector('[data-logout]').addEventListener('click', async e => { e.preventDefault(); await BPStore.signOut(); location.href = 'index.html'; }); }
  function actualizarContador(k, n){ cuenta[k] = n; const a = nav.querySelector(`a[href="#${k}"]`); if (!a) return; let sp = a.querySelector('.n'); if (n > 0) { if (!sp) { sp = document.createElement('span'); sp.className = 'n'; a.appendChild(sp); } sp.textContent = n; } else if (sp) sp.remove(); }
  /* Cambiar de vista lleva siempre al título de esa vista, justo debajo del riel (en celular,
     debajo de las pastillas pegadas al header). Sin la navegación por ancla del navegador,
     que con un #id inexistente dejaba el scroll en cualquier lado. */
  const irAlContenido = () => { const rail = nav.getBoundingClientRect(); const pegado = getComputedStyle(nav).position === 'sticky' && window.innerWidth < 1024 ? rail.height : 0; const top = content.getBoundingClientRect().top + window.scrollY - 64 - pegado - 12; const raiz = document.documentElement; const antes = raiz.style.scrollBehavior; raiz.style.scrollBehavior = 'auto'; window.scrollTo(0, Math.max(0, top)); raiz.style.scrollBehavior = antes; };
  const ESQUELETO = content.innerHTML;   /* el de la carga inicial, se reutiliza al cambiar de vista */
  let vistaEnCurso = 0;
  const cambiarVista = async (nuevo, empujar) => {
    const mia = ++vistaEnCurso; tab = nuevo; if (empujar) history.pushState(null, '', '#' + tab);
    marcarActiva();
    content.innerHTML = ESQUELETO; content.setAttribute('aria-busy', 'true'); irAlContenido();   /* respuesta inmediata: esqueleto en su lugar */
    await render(); if (mia !== vistaEnCurso) return;   /* si tocaron otra pestaña mientras cargaba, gana la última */
    irAlContenido(); requestAnimationFrame(irAlContenido);
    const h = content.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  };
  nav.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (!a) return; e.preventDefault(); const nuevo = a.getAttribute('href').slice(1); if (!TABS.some(t => t[0] === nuevo)) return; if (nuevo === tab) { irAlContenido(); return; } cambiarVista(nuevo, true); });
  const desdeUrl = () => { const nuevo = (location.hash || ('#' + primeraVista())).slice(1); if (TABS.some(t => t[0] === nuevo) && nuevo !== tab) cambiarVista(nuevo, false); };
  window.addEventListener('hashchange', desdeUrl); window.addEventListener('popstate', desdeUrl);

  function marcarActiva(){
    nav.querySelectorAll('a[href^="#"]').forEach(a => { const on = a.getAttribute('href') === '#' + tab; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    /* En celular la fila de pastillas desliza: la activa se centra en la fila, sin mover la página */
    const rail = nav.querySelector('.p-rail'), a = nav.querySelector('a.on');
    if (rail && a && rail.scrollWidth > rail.clientWidth) rail.scrollTo({ left: Math.max(0, a.offsetLeft - (rail.clientWidth - a.offsetWidth) / 2), behavior: 'smooth' });
  }
  async function render(){
    if (!nav.querySelector('.p-rail') || !nav.querySelector(`.p-rail a[href="#${tab}"]`)) renderNav();
    marcarActiva();
    content.removeAttribute('aria-busy');
    if (tab === 'avisos') return renderAvisos();
    if (tab === 'propiedades') return renderPropiedades();
    if (tab === 'interesados') return renderInteresados();
    if (tab === 'contactos') return renderContactos();
    if (tab === 'favoritos') return renderFavoritos();
    if (tab === 'alertas') return renderAlertas();
    return renderCuenta();
  }

  /* ── Mis avisos ─────────────────────────────────────────────────────────
     Se cargan una vez (avisos, vistas, consultas, visitas y fotos) y después se
     filtra, ordena y pinta sin volver a la base. Las acciones vuelven a cargar. */
  const LA = { q: '', estado: '', op: '', orden: 'recientes', max: 12 };
  let cacheAvisos = null;
  /* Contrato de operación (8/10/2026): venta, alquiler (tradicional) y mediano (3 a 12 meses). Las claves no cambian. */
  /* 8/10/2026 (lanz3-publicador) · Cortas, como en las tarjetas: la fila de compu cortaba el precio ("Las Cañitas · US…") */
  const OP_TXT = { venta: BP.t('card_venta', 'Venta'), mediano: BP.t('card_alq_mediano', 'Mediano plazo'), alquiler: BP.t('card_alquiler', 'Alquiler') };
  /* Moneda (contrato 8/10/2026): el alquiler tradicional puede estar en pesos; el resto, USD */
  const precioTxt = a => a.moneda === 'ARS' && a.precio != null ? '$\u00a0' + BP.fmtN(Math.round(Number(a.precio))) : BP.fmtUSD(a.precio == null ? null : Number(a.precio));
  const POR_MES = BP.t('ui_por_mes', '/mes'), RESERVADA = BP.t('card_reservada', 'Reservada');
  const TIPO_VISITA = v => v === 'reserva' ? BP.t('pan_tipo_reserva', 'Reserva') : v === 'cierre' ? BP.t('pan_tipo_cierre', 'Cierre') : BP.t('pan_tipo_visita', 'Visita');
  async function cargarAvisos(){
    const avisos = (await BPStore.myAvisos()).filter(a => a.estado_curacion !== 'vencido'); const cons = await BPStore.consultasRecibidas(pub.id);
    const ids = avisos.map(a => a.id);
    const vServer = await BPStore.vistasDe(ids), cServer = await BPStore.consultasDe(ids);
    const vistasLocales = !Object.keys(vServer).length;
    const vis = await BPStore.visitasDe(ids);
    const fotos = {}; for (const a of avisos) fotos[a.id] = a.fotos && a.fotos.length ? await BPStore.resolveFoto(a.fotos.slice().sort((x,y)=>(x.orden||0)-(y.orden||0))[0].url) : '';
    const vistaDe = a => (vServer[String(a.id)] != null ? vServer[String(a.id)] : BPStore.vistas(a.id));
    const consultaDe = a => (cServer[String(a.id)] != null ? cServer[String(a.id)] : cons.filter(c => c.aviso_id === a.id).length);
    avisos.forEach(a => { a._vistas = vistaDe(a); a._consultas = consultaDe(a); a._visitas = (vis[a.id] || []); a._foto = fotos[a.id]; });
    cacheAvisos = { avisos, cons, vistasLocales };
    actualizarContador('avisos', avisos.length); actualizarContador('interesados', cons.length);
    return cacheAvisos;
  }
  function filtrarAvisos(avisos){
    const q = LA.q.trim().toLowerCase();
    const l = avisos.filter(a => {
      if (q && [a.titulo, a.emprendimiento, a.direccion, a.unidad, a.barrio, a.codigo].filter(Boolean).join(' ').toLowerCase().indexOf(q) === -1) return false;
      if (LA.estado === 'reservado') { if (a.estado !== 'reservado') return false; }
      else if (LA.estado === 'pendiente') { if (['borrador','rechazado','en_revision'].indexOf(a.estado_curacion) === -1) return false; }
      else if (LA.estado && a.estado_curacion !== LA.estado) return false;
      if (LA.op && a.operacion !== LA.op) return false;
      return true;
    });
    const t = a => new Date(a.actualizado_en || a.updated_at || a.publicado_en || a.created_at || 0).getTime();
    if (LA.orden === 'vistas') l.sort((a, b) => b._vistas - a._vistas);
    else if (LA.orden === 'consultas') l.sort((a, b) => b._consultas - a._consultas);
    else if (LA.orden === 'az') l.sort((a, b) => String(a.titulo || a.direccion).localeCompare(String(b.titulo || b.direccion), 'es'));
    else l.sort((a, b) => t(b) - t(a));
    return l;
  }
  /* 8/10/2026 (venta) · Un emprendimiento en borrador es una fila con su lista de unidades ("Torre Ejemplo · 6 unidades").
     La lista viaja con el borrador (unidades_borrador); sin esa columna en la base, la de este navegador. */
  const listaBorrador = a => {

            <div class="ops" role="radiogroup" aria-label="${BP.esc(BP.t('img_elegir_icono', 'Elegir un ícono'))}">${iconos.map(a => `<label class="op${av0.tipo === 'icono' && av0.id === a.id ? ' on' : ''}"><input type="radio" name="avatar" value="${BP.esc(a.id)}" aria-label="${BP.esc(BP.t('pan_av_' + String(a.id).replace(/\D/g, ''), a.nombre))}"${av0.tipo === 'icono' && av0.id === a.id ? ' checked' : ''}><img src="${BP.esc(BPStore.AVATAR_DIR + a.archivo)}" alt="" width="44" height="44" decoding="async"></label>`).join('')}</div>
            <div class="acts"><button type="button" class="p-btn p-btn-sm" data-avatar-subir>${BP.t('img_subir', 'Subir una foto')}</button><input type="file" accept="image/*" hidden data-avatar-file aria-label="${BP.esc(BP.t('img_subir', 'Subir una foto'))}"><button type="button" class="p-btn p-btn-sm p-btn-quiet" data-avatar-quitar${av0.tipo === 'foto' ? '' : ' hidden'}>${BP.t('img_quitar', 'Quitar')}</button></div>
            <p class="p-note">${BP.t('img_nota', 'Un ícono o una foto tuya. La foto se recorta sola, cuadrada y al centro.')}</p>
          </fieldset></dd></div>`;
    content.innerHTML = `<h1 class="p-h2">${BP.t('mi_cuenta', 'Mi cuenta')}</h1>
      <dl class="p-ficha-cuenta">
        ${filaImagen}
        <div><dt>${BP.t('pan_mail', 'Mail')}</dt><dd>${BP.esc(BPStore.session.email)}</dd></div>
        <div><dt>${BP.t('pan_en_bairen', 'En BAIREN')}</dt><dd data-perfil-txt>${perfil ? BPStore.perfilTxt(perfil, pub) : BP.t('pan_sin_elegir', 'Sin elegir: el panel muestra todo')}</dd></div>
        ${pub ? `<div><dt>${BP.t('pan_publicador', 'Publicador')}</dt><dd>${BP.esc(pub.nombre)}</dd></div><div><dt>${BP.t('pan_tipo', 'Tipo')}</dt><dd>${tipo}</dd></div><div><dt>${BP.t('pan_verificacion', 'Verificación')}</dt><dd>${pub.verificado ? BP.ico.check + BP.t('pan_verificado', ' Verificado') : faltanDocs ? `<span class="p-faltan-docs">${faltanDocsTxt()}</span> <a class="p-btn p-btn-sm p-btn-fill" href="${URL_DOCS}">${BP.t('pan_cargar_docs', 'Cargar documentos')}</a>` : BP.t('pan_verif_pend_bairen', 'Pendiente: la revisa BAIREN')}</dd></div>${pub.matricula ? `<div><dt>${BP.t('pan_matricula', 'Matrícula')}</dt><dd>${BP.esc(pub.matricula)}</dd></div>` : ''}` : `<div><dt>${BP.t('pan_publicador', 'Publicador')}</dt><dd>${BP.t('pan_sin_publicador', 'Sin perfil todavía. Se crea al publicar.')}</dd></div>`}
      </dl>
      <fieldset class="p-perfil-sel"><legend>${BP.t('pan_que_venis', 'Qué venís a hacer a BAIREN')}</legend><p class="p-note">${BP.t('pan_perfil_nota', 'Decide qué muestra el panel, no lo que podés hacer. Lo cambiás cuando quieras.')}</p><div class="ops">${BPStore.PERFILES.map(p => `<label${p === perfil ? ' class="on"' : ''}><input type="radio" name="perfil" value="${p}"${p === perfil ? ' checked' : ''}><span>${BPStore.perfilTxt(p, pub)}</span></label>`).join('')}</div></fieldset>
      <div class="p-head-acts p-cuenta-acts">${pub ? `<a class="p-btn" href="publicar-aviso.html?paso=perfil">${BP.t('pan_editar_publicador', 'Editar perfil de publicador')}</a>` : `<a class="p-btn p-btn-fill" href="publicar-aviso.html">${BP.t('pan_publicar_prop', 'Publicar una propiedad')}</a>`}<button type="button" class="p-btn p-btn-quiet" data-logout>${BP.t('cerrar_sesion', 'Cerrar sesión')}</button></div>
      <p class="p-note p-cuenta-priv">${BP.t('pan_privacidad', '<b>Privacidad.</b> Podés pedir acceso, corrección o borrado de tus datos escribiendo a <a href="mailto:portal@bairengroup.com">portal@bairengroup.com</a>. Los documentos de verificación se eliminan después de revisarlos.')}</p>`;
    content.querySelector('[data-logout]').addEventListener('click', async () => { await BPStore.signOut(); location.href = 'index.html'; });
    /* Cambiar el perfil redibuja el riel sin recargar; si no se pudo guardar, vuelve la marca anterior.
       11/9 noche · Mientras guarda, el grupo entero queda deshabilitado (estado "guardando" visible y sin dobles
       clics); la clase .on acompaña a la opción marcada, así el estilo no depende solo de :has(). */
    const marcarPerfil = () => content.querySelectorAll('.p-perfil-sel label').forEach(l => l.classList.toggle('on', !!l.querySelector('input:checked')));
    content.querySelectorAll('.p-perfil-sel [name=perfil]').forEach(r => r.addEventListener('change', async () => {
      const antes = perfil; const fs = r.closest('fieldset'); marcarPerfil();
      fs.disabled = true;
      try { await BPStore.setPerfil(r.value); }
      catch (e) { const prev = content.querySelector(`.p-perfil-sel [value="${antes}"]`); if (prev) prev.checked = true; else r.checked = false; marcarPerfil(); BP.toast(BPStore.errorAlGuardar(e), 'error'); return; }
      finally { fs.disabled = false; }
      perfil = r.value; riel = BPStore.rielDe(perfil, pub); renderNav(); marcarActiva();
      const dd = content.querySelector('[data-perfil-txt]'); if (dd) dd.textContent = BPStore.perfilTxt(perfil, pub);
      BP.toast(BPStore.session.demo ? BP.t('img_demo', 'En modo demo no se guarda.') : BP.t('pan_perfil_listo', 'Listo. El panel ya muestra lo que te sirve.'));
    }));
    /* 12/9 · La imagen: mismo patrón que el perfil. Mientras guarda, el grupo entero queda deshabilitado; si no se pudo,
       vuelve la marca anterior. Al guardar se repinta la imagen actual, el .who del riel y el header (lo hace el store). */
    const sel = content.querySelector('[data-avatar-sel]'); BP.avatarFallback(sel, email);
    /* Si falta el SVG de un ícono, su casilla muestra el número en navy en vez de la imagen rota */
    sel.querySelectorAll('.op img').forEach((img, i) => img.addEventListener('error', () => { const l = img.closest('label'); if (l) l.classList.add('ph'); const b = document.createElement('b'); b.textContent = String(i + 1); img.replaceWith(b); }, { once: true }));
    const pintarAvatar = () => {
      const av = BPStore.getAvatar(); const act = sel.querySelector('[data-avatar-actual]');
      act.innerHTML = BP.avatar(av, 'p-avatar-actual', 56); act.setAttribute('aria-label', av.tipo ? BP.t('img_actual', 'Tu imagen actual') : BP.t('img_sin', 'Sin imagen todavía: se muestra el ícono genérico')); BP.avatarFallback(act, email);
      sel.querySelectorAll('label.op').forEach(l => { const i = l.querySelector('input'); const on = av.tipo === 'icono' && i.value === av.id; i.checked = on; l.classList.toggle('on', on); });
      sel.querySelector('[data-avatar-quitar]').hidden = av.tipo !== 'foto';
      renderNav(); marcarActiva();
    };
    /* Deshabilitar el grupo le saca el foco a lo que estaba enfocado (el radio, el botón): al terminar vuelve al mismo control */
    const ocupado = (on, devolverA) => { sel.disabled = on; if (on) sel.setAttribute('aria-busy', 'true'); else { sel.removeAttribute('aria-busy'); if (devolverA && !devolverA.hidden && (document.activeElement === document.body || sel.contains(document.activeElement))) { try { devolverA.focus({ preventScroll: true }); } catch (e) {} } } };
    const listo = () => { pintarAvatar(); BP.toast(BPStore.session.demo ? BP.t('img_demo', 'En modo demo no se guarda.') : BP.t('img_listo', 'Listo.')); };
    sel.querySelectorAll('[name=avatar]').forEach(r => r.addEventListener('change', async () => {
      sel.querySelectorAll('label.op').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
      ocupado(true);
      try { await BPStore.setAvatar({ icono: r.value }); }
      catch (e) { ocupado(false, r); pintarAvatar(); BP.toast(BPStore.errorAlGuardar(e), 'error'); return; }
      ocupado(false, r); listo();
    }));
    const file = sel.querySelector('[data-avatar-file]'), btnSubir = sel.querySelector('[data-avatar-subir]'), btnQuitar = sel.querySelector('[data-avatar-quitar]');
    btnSubir.addEventListener('click', () => file.click());
    file.addEventListener('change', async () => {
      const f = file.files && file.files[0]; if (!f) return;
      const txt = btnSubir.textContent; btnSubir.textContent = BP.t('img_subiendo', 'Subiendo…'); btnSubir.classList.add('ocupado'); ocupado(true);
      try { await BPStore.setAvatarFoto(f); }
      catch (e) { BP.toast(BPStore.errorAlGuardar(e, BP.t('img_no_subio', 'La foto no se pudo subir.')), 'error'); return; }
      finally { file.value = ''; btnSubir.textContent = txt; btnSubir.classList.remove('ocupado'); ocupado(false, btnSubir); }
      listo();
    });
    btnQuitar.addEventListener('click', async () => {
      ocupado(true);
      try { await BPStore.setAvatar({ icono: null }); }
      catch (e) { ocupado(false, btnQuitar); BP.toast(BPStore.errorAlGuardar(e), 'error'); return; }
      ocupado(false, btnSubir); listo();   /* "Quitar" desaparece: el foco pasa a "Subir una foto" */
    });
  }
  render();
})();
});
</script>
</body>
</html>
