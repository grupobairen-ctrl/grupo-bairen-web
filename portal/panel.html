     500 ms nadie lo ve; si se vio, se queda hasta los 800 ms para no titilar; a los 8 s se va pase lo que
     pase. Inline y sin dependencias: si un script no carga, el velo se va igual. */

  V.soltar=function(){if(!h.classList.contains('cargando'))return;V.retenido=false;h.classList.remove('cargando');if(obs)obs.disconnect();try{document.dispatchEvent(new Event('bairen:velo'))}catch(e){}};
  V.retener=function(){V.retenido=true};V.seguir=function(){V.retenido=false;pedir()};
  /* Visible de verdad: checkVisibility ve lo que un rectángulo no (un details cerrado, content-visibility) */
  var vis=function(e){return e.checkVisibility?e.checkVisibility({contentVisibilityAuto:true,visibilityProperty:true}):e.getClientRects().length>0};
  V.lista=function(){if(!V.cargado)return false;var es=document.querySelectorAll(ESQ),i;for(i=0;i<es.length;i++)if(vis(es[i]))return false;
    var im=document.images,H=innerHeight,W=innerWidth,r;for(i=0;i<im.length;i++){if(im[i].complete||!im[i].getAttribute('src')||!vis(im[i]))continue;r=im[i].getBoundingClientRect();if(r.width>0&&r.bottom>0&&r.top<H&&r.right>0&&r.left<W)return false}return true};
  var revisar=function(){if(V.retenido||timer||!V.lista())return;var t=performance.now();timer=setTimeout(function(){if(!V.retenido)V.soltar()},t>500?Math.max(0,800-t):0)};
  var pedido=false,pedir=function(){if(pedido)return;pedido=true;requestAnimationFrame(function(){pedido=false;revisar()})};
  addEventListener('load',function(){V.cargado=true;pedir()});
  document.addEventListener('DOMContentLoaded',function(){obs=new MutationObserver(pedir);obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','src','hidden','style']})});
  document.addEventListener('load',pedir,true);document.addEventListener('error',pedir,true);
  setTimeout(V.soltar,8000)})(document.documentElement);</script>

    catch (err) { b.disabled = false; BP.toast(BPStore.demo ? 'En modo demo no se guarda.' : 'No se pudo confirmar: ' + (err.message || err), 'error'); }

  let tab = (location.hash || '').slice(1); if (!TABS.some(t => t[0] === tab)) tab = primeraVista();

    const item = id => { const t = TABS.find(x => x[0] === id); if (t) return `<a href="#${t[0]}" class="${t[0]===tab?'on':''}"${t[0]===tab?' aria-current="page"':''}>${BP.ico[t[2]]}<span>${t[1]}</span>${contador(t[0])}</a>`; if (id === 'importar') return `<a href="importar.html">${ICO_IMPORTAR}<span>Importar</span></a>`; if (id === 'os') return `<a href="${BPStore.OS_URL}" rel="noopener" title="Visitas, reservas y cobros de tus unidades">${BP.ico.arrow}<span>Bairen OS</span></a>`; return ''; };

  function actualizarContador(k, n){ cuenta[k] = n; const a = nav.querySelector(`a[href="#${k}"]`); if (!a) return; let sp = a.querySelector('.n'); if (n > 0) { if (!sp) { sp = document.createElement('span'); sp.className = 'n'; a.appendChild(sp); } sp.textContent = n; } else if (sp) sp.remove(); }

        ${a.motivo_rechazo ? `<div class="p-note p-aviso-motivo">Motivo: ${BP.esc(a.motivo_rechazo)}</div>` : ''}
        <details class="p-visitas"><summary>Visitas y reservas <span class="n">${visitas.length}</span>${a.propietario_email ? ' <small>· las ve ' + BP.esc(a.propietario_email) + '</small>' : ''}</summary>
          <ul>${visitas.slice(0,5).map(v => `<li>${new Date(v.fecha).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' })} · <b>${v.tipo === 'reserva' ? 'Reserva' : v.tipo === 'cierre' ? 'Cierre' : 'Visita'}</b>${v.nota ? ' · ' + BP.esc(v.nota) : ''}${v.feedback ? ` · <i>"${BP.esc(v.feedback)}"</i>` : (v.tipo === 'visita' && v.estado !== 'cancelada' && new Date(v.fecha) <= new Date()) ? ` <form class="p-fb" data-id="${v.id}"><input name="fb" placeholder="¿Qué dijo quien visitó?" aria-label="Qué dijo el que visitó" required><button type="submit" class="p-btn p-btn-sm">Guardar</button></form>` : ''}</li>`).join('') || '<li>Sin registros todavía.</li>'}</ul>
          <form class="p-visita-form" data-aviso="${a.id}"><select name="tipo" class="p-fsel" aria-label="Tipo de registro"><option value="visita">Visita</option><option value="reserva">Reserva</option><option value="cierre">Cierre</option></select><input type="datetime-local" name="fecha" class="p-fsel" required aria-label="Fecha y hora"><input type="text" name="nota" placeholder="Nota (opcional)" aria-label="Nota" class="p-fsel"><button type="submit" class="p-btn p-btn-sm p-btn-navy" data-visita>Registrar</button></form>
        </details>
      </div>
      <dl class="p-aviso-cifras"><div><dt>Vistas</dt><dd>${a._vistas}</dd></div><div><dt>Consultas</dt><dd>${a._consultas}</dd></div><div><dt>Fotos</dt><dd>${(a.fotos||[]).length}</dd></div></dl>
      <div class="acts">${primaria}${mas ? `<details class="p-mas"><summary aria-label="Más acciones" title="Más acciones">···</summary><div class="p-mas-menu">${mas}</div></details>` : ''}</div>
    </div>`;
  }
  function pintarAvisos(){
    const { avisos, cons, vistasLocales } = cacheAvisos;
    const pubCount = avisos.filter(a => a.estado_curacion === 'publicado').length, rev = avisos.filter(a => a.estado_curacion === 'en_revision').length;
    const vistas = avisos.reduce((s, a) => s + a._vistas, 0);
    const lista = filtrarAvisos(avisos); const visibles = lista.slice(0, LA.max);
    const hayFiltro = LA.q || LA.estado || LA.op;
    let html = `<div class="p-head-row"><div><h1 class="p-h2">Mis avisos</h1><p class="p-sub">${BP.esc(pub.nombre)} · ${pub.verificado ? BP.ico.check + ' verificado' : 'verificación pendiente'}</p></div><div class="p-head-acts">${pub.tipo !== 'dueno' ? '<a class="p-btn" href="importar.html">Importar cartera</a>' : ''}<a class="p-btn p-btn-fill" href="publicar-aviso.html">Publicar otra</a></div></div>
      ${vistasLocales && BPStore.mode !== 'supabase' ? '<p class="p-note p-nota-vistas">Vistas y consultas de este navegador. Con la base conectada, las de todos los visitantes.</p>' : ''}<div class="p-kpis"><div class="p-kpi"><b>${pubCount}</b><span>Publicados</span></div><div class="p-kpi"><b>${rev}</b><span>En revisión</span></div><div class="p-kpi"><b>${vistas}</b><span>Vistas${vistasLocales ? ' en este navegador' : ''}</span></div><div class="p-kpi"><b>${cons.length}</b><span>Consultas</span></div></div>`;
    if (!avisos.length) { html += `<div class="p-empty p-ensena"><b>Todavía no cargaste ninguna propiedad.</b><p>Cinco pasos: tu perfil, lo principal, fotos y video, extras, y revisar. Podés guardar y seguir después.</p><a class="p-btn p-btn-fill" href="publicar-aviso.html">Publicar la primera</a></div>`; content.innerHTML = html; return; }
    html += `<form class="p-herr" id="herrAvisos" role="search" aria-label="Buscar y filtrar avisos">
        <label class="p-herr-q"><span class="sr">Buscar</span><input type="search" name="q" value="${BP.esc(LA.q)}" placeholder="Dirección, barrio o código" autocomplete="off"></label>
        <select name="estado" class="p-fsel" aria-label="Estado"><option value="">Todos los estados</option><option value="publicado"${LA.estado==='publicado'?' selected':''}>Publicados</option><option value="reservado"${LA.estado==='reservado'?' selected':''}>Reservadas</option><option value="pausado"${LA.estado==='pausado'?' selected':''}>Pausados</option><option value="pendiente"${LA.estado==='pendiente'?' selected':''}>En revisión, borrador o rechazado</option></select>
        <select name="op" class="p-fsel" aria-label="Operación"><option value="">Todas las operaciones</option><option value="venta"${LA.op==='venta'?' selected':''}>Venta</option><option value="mediano"${LA.op==='mediano'?' selected':''}>Alquiler, mediano plazo</option><option value="alquiler"${LA.op==='alquiler'?' selected':''}>Alquiler, largo plazo</option></select>
        <select name="orden" class="p-fsel" aria-label="Ordenar"><option value="recientes"${LA.orden==='recientes'?' selected':''}>Más recientes</option><option value="vistas"${LA.orden==='vistas'?' selected':''}>Más vistas</option><option value="consultas"${LA.orden==='consultas'?' selected':''}>Más consultas</option><option value="az"${LA.orden==='az'?' selected':''}>Por dirección</option></select>
      </form>
      <p class="p-herr-n" aria-live="polite">${lista.length === avisos.length ? `${avisos.length} ${avisos.length === 1 ? 'aviso' : 'avisos'}` : `${lista.length} de ${avisos.length}`}${hayFiltro ? ' · <button type="button" class="p-link" data-limpiar>Limpiar filtros</button>' : ''}</p>`;
    if (!lista.length) html += `<div class="p-empty">Ningún aviso coincide con la búsqueda. <button type="button" class="p-link" data-limpiar>Limpiar filtros</button></div>`;
    html += `<div class="p-avisos-lista">${visibles.map(filaAviso).join('')}</div>`;
    if (lista.length > LA.max) html += `<div class="p-vermas"><button type="button" class="p-btn" data-vermas>Ver ${Math.min(12, lista.length - LA.max)} más</button><span>${visibles.length} de ${lista.length}</span></div>`;
    content.innerHTML = html;
    /* Herramientas de lista: buscar mientras escribís, filtros al cambiar; sin volver a la base */
    const herr = document.getElementById('herrAvisos');
    if (herr) {
      herr.addEventListener('submit', e => e.preventDefault());
      let t = null; herr.q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { LA.q = herr.q.value; LA.max = 12; pintarAvisos(); const q = document.querySelector('#herrAvisos input[name=q]'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 160); });
      ['estado','op','orden'].forEach(k => herr[k].addEventListener('change', () => { LA[k] = herr[k].value; LA.max = 12; pintarAvisos(); }));
    }
    content.querySelectorAll('[data-limpiar]').forEach(b => b.addEventListener('click', () => { LA.q = ''; LA.estado = ''; LA.op = ''; LA.max = 12; pintarAvisos(); }));
    const vm = content.querySelector('[data-vermas]'); if (vm) vm.addEventListener('click', () => { const antes = LA.max; LA.max += 12; pintarAvisos(); const filas = content.querySelectorAll('.p-aviso-row'); const f = filas[antes]; if (f) { const el = f.querySelector('.acts a, .acts button'); if (el) el.focus(); } });
    /* Un solo menú "···" abierto por vez */
    content.querySelectorAll('details.p-mas').forEach(d => d.addEventListener('toggle', () => { if (d.open) content.querySelectorAll('details.p-mas[open]').forEach(o => { if (o !== d) o.open = false; }); }));
    content.querySelectorAll('.p-visita-form').forEach(f => f.addEventListener('submit', async e => { e.preventDefault(); if (!f.fecha.value) { BP.errorCampo(f.fecha, 'Elegí fecha y hora.'); return; } const bt = f.querySelector('[data-visita]'); bt.disabled = true; try { await BPStore.addVisita(f.dataset.aviso, { tipo: f.tipo.value, fecha: new Date(f.fecha.value).toISOString(), nota: f.nota.value.trim() }); BP.toast('Registrado. El propietario lo ve en su cuenta.'); await renderAvisos(); const d = content.querySelector(`.p-visita-form[data-aviso="${f.dataset.aviso}"]`); if (d) d.closest('details').open = true; } catch (err) { bt.disabled = false; BP.toast(BPStore.demo ? 'En modo demo no se guarda.' : (err.message || 'No se pudo registrar.'), 'error'); } }));
    content.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', async () => { const act = b.dataset.act, id = b.dataset.id; b.disabled = true; if (act === 'reservar' && window.BPM && BPM.sello) { const fila = b.closest('.p-aviso-row'); if (fila) BPM.sello(fila, 'Reservada'); } try { if (act === 'pausar') await BPStore.setEstado(id, 'pausado'); else if (act === 'reactivar') await BPStore.setEstado(id, 'publicado'); else if (act === 'reservar') await BPStore.setEstado(id, 'publicado', null, { estado: 'reservado' }); else if (act === 'disponible') await BPStore.setEstado(id, 'publicado', null, { estado: 'disponible' }); BP.toast(act === 'pausar' ? 'Aviso pausado. Ya no se muestra en los resultados.' : act === 'reactivar' ? 'Aviso publicado de nuevo.' : act === 'reservar' ? 'Marcada como reservada.' : 'Marcada como disponible.'); renderAvisos(); } catch (e) { b.disabled = false; BP.toast(BPStore.demo ? 'En modo demo no se guarda.' : (e.message || 'No se pudo.'), 'error'); } }));
  }
  async function renderAvisos(){
    if (!pub) { content.innerHTML = `<h1 class="p-h2">Mis avisos</h1><div class="p-empty p-ensena"><b>Todavía no tenés perfil de publicador.</b><p>Se crea en el primer paso al publicar: dueño directo, inmobiliaria o desarrolladora.</p><a class="p-btn p-btn-fill" href="publicar-aviso.html">Publicar una propiedad</a></div>`; return; }
    const mia = vistaEnCurso; await cargarAvisos(); if (mia !== vistaEnCurso) return;   /* si mientras cargaba tocaron otra pestaña, no se pisa */
    pintarAvisos();
  }
  async function renderPropiedades(){
    const mia = vistaEnCurso; const mine = await BPStore.avisosDePropietario();
    let html = `<h1 class="p-h2">Mis propiedades</h1><p class="p-sub">Tus unidades publicadas por una inmobiliaria, con las visitas y reservas que registra. Las ves con tu cuenta.</p>`;
    if (!mine.length) { content.innerHTML = html + `<div class="p-empty">No hay propiedades asociadas a ${BP.esc(BPStore.session.email)}. Pedile a tu inmobiliaria que cargue tu mail en el aviso, o <a href="publicar-aviso.html" style="text-decoration:underline">publicala como dueño directo</a>.</div>`; return; }
    const vProp = await BPStore.vistasDe(mine.map(a => a.id)); const visMine = await BPStore.visitasDe(mine.map(a => a.id)); if (mia !== vistaEnCurso) return;
    for (const a of mine) { const vis = visMine[a.id] || []; const foto = a.fotos && a.fotos.length ? await BPStore.resolveFoto(a.fotos.slice().sort((x,y)=>(x.orden||0)-(y.orden||0))[0].url) : ''; const p = BPData.pubDeFila(a.publicador);
      html += `<div class="p-aviso-row" style="margin-bottom:10px;grid-template-columns:120px 1fr"><div class="ph">${foto ? `<img src="${foto}" alt="">` : ''}</div><div><b>${BP.esc(a.titulo || a.direccion)}</b><div class="m">${a.operacion === 'venta' ? 'Venta' : 'Alquiler'} · ${BP.esc(a.barrio||'')} · ${BP.fmtUSD(Number(a.precio))}${a.operacion !== 'venta' ? '/mes' : ''} · publica <b style="display:inline">${BP.esc(p.nombre||'')}</b>${p.matricula ? ' · ' + BP.esc(p.matricula) : ''}</div><div style="margin-top:6px">${BP.estadoBadge(a.estado_curacion)}${a.estado === 'reservado' ? ' <span class="p-badge demo">Reservada</span>' : ''}</div><div class="stats"><span><b>${vProp[String(a.id)] != null ? vProp[String(a.id)] : BPStore.vistas(a.id)}</b> vistas</span><span><b>${vis.length}</b> visitas y reservas</span></div>
        <ul style="list-style:none;margin:10px 0 0;padding:0;font-size:.84rem;color:var(--text-mid)">${vis.map(v => `<li style="padding:6px 0;border-top:1px solid var(--p-line)">${new Date(v.fecha).toLocaleString('es-AR', { dateStyle: 'medium', timeStyle: 'short' })} · <b style="color:var(--navy-deeper)">${v.tipo === 'reserva' ? 'Reserva' : v.tipo === 'cierre' ? 'Cierre' : 'Visita'}</b>${v.nota ? ' · ' + BP.esc(v.nota) : ''}${v.feedback ? `<br><span style="color:var(--navy-deeper)">Lo que dijo: <i>"${BP.esc(v.feedback)}"</i></span>` : ''}</li>`).join('') || '<li>Todavía no hay visitas registradas.</li>'}</ul>
        ${a.estado_curacion === 'publicado' ? `<p style="margin-top:10px"><a class="p-btn p-btn-sm" href="${BP.urlFicha({ id: a.id })}">Ver ficha</a></p>` : ''}</div></div>`; }
    content.innerHTML = html;
  }
  async function renderInteresados(){
    if (!pub) { content.innerHTML = `<h1 class="p-h2">Interesados</h1><div class="p-empty p-ensena"><b>Acá van a aparecer las consultas de tus avisos.</b><p>Con nombre, mail y teléfono de quien pregunta, y el pedido de visita si lo hay. Cada una te llega también por mail.</p><a class="p-btn p-btn-fill" href="publicar-aviso.html">Publicar una propiedad</a></div>`; return; }
    const mia = vistaEnCurso; const cons = await BPStore.consultasRecibidas(pub.id); const avisos = await BPStore.myAvisos(); if (mia !== vistaEnCurso) return;
    content.innerHTML = `<h1 class="p-h2">Interesados</h1><p class="p-sub">Cada consulta te llegó también por mail o WhatsApp. Respondé vos: BAIREN no interviene.</p>` + (cons.length ? `<table class="p-tbl"><thead><tr><th>Fecha</th><th>Propiedad</th><th>Persona</th><th>Mensaje</th><th>Visita</th><th></th></tr></thead><tbody>${cons.map(c => { const a = avisos.find(x => x.id === c.aviso_id); return `<tr><td data-th="Fecha">${new Date(c.created_at).toLocaleDateString('es-AR')}</td><td data-th="Propiedad">${a ? BP.esc(a.titulo || a.direccion) : c.aviso_id}</td><td data-th="Persona">${BP.esc(c.nombre)}<br><small>${BP.esc(c.email)} · ${BP.esc(c.telefono||'')}</small></td><td data-th="Mensaje">${BP.esc(c.mensaje||'')}</td><td data-th="Visita">${c.visita_deseada ? `<b>${new Date(c.visita_deseada).toLocaleString('es-AR', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</b><br><button type="button" class="p-btn p-btn-sm p-btn-fill" data-confirmar="${c.id}" data-aviso="${c.aviso_id}" data-fecha="${c.visita_deseada}" data-nombre="${BP.esc(c.nombre)}">Confirmar visita</button>` : '<small class="m">—</small>'}</td><td>${c.telefono ? `<a class="p-btn p-btn-sm" href="https://wa.me/${String(c.telefono).replace(/\D/g,'')}" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp a ${BP.esc(c.nombre)}">${BP.ico.wa} WhatsApp</a>` : ''}</td></tr>`; }).join('')}</tbody></table>` : '<div class="p-empty p-ensena"><b>Todavía no recibiste consultas.</b><p>Cuando alguien pregunte por un aviso, aparece acá con su nombre, mail y teléfono, y el pedido de visita si lo hay. Te llega también por mail.</p></div>');
  }
  function renderContactos(){
    const cons = BPStore.misConsultas();
    content.innerHTML = `<h1 class="p-h2">Mis contactos</h1><p class="p-sub">Las propiedades por las que consultaste y a quién le llegó tu mensaje.</p>` + (cons.length ? `<table class="p-tbl"><thead><tr><th>Fecha</th><th>Propiedad</th><th>Publicador</th><th>Mensaje</th><th></th></tr></thead><tbody>${cons.map(c => `<tr><td data-th="Fecha">${new Date(c.created_at||c.fecha).toLocaleDateString('es-AR')}</td><td data-th="Propiedad"><a href="propiedad.html?id=${encodeURIComponent(c.aviso_id||c.avisoId)}" style="text-decoration:underline">${BP.esc(c.aviso_titulo || c.aviso_id || c.avisoId)}</a></td><td data-th="Publicador">${BP.esc(c.publicador_nombre || c.publicador || '')}</td><td data-th="Mensaje">${BP.esc(c.mensaje||'')}</td><td><a class="p-btn p-btn-sm" href="propiedad.html?id=${encodeURIComponent(c.aviso_id||c.avisoId)}#contacto">Volver a escribir</a></td></tr>`).join('')}</tbody></table>` : '<div class="p-empty p-ensena"><b>Todavía no consultaste por ninguna propiedad.</b><p>Cuando escribas desde una ficha, acá queda a quién le llegó tu mensaje y cuándo, para retomar la conversación.</p><a class="p-btn" href="buscar.html?op=alquiler">Ver propiedades</a></div>');
  }
  async function renderFavoritos(){
    const mia = vistaEnCurso; const { avisos } = await BPData.load(); if (mia !== vistaEnCurso) return; const favs = avisos.filter(a => BP.isFav(a.id));
    content.innerHTML = `<div class="p-head-row"><h1 class="p-h2">Favoritos</h1><a class="p-link" href="buscar.html?favs=1">Ver como búsqueda</a></div>` + (favs.length ? `<div class="p-grid">${favs.map(BPData.cardV).join('')}</div>` : '<div class="p-empty p-ensena"><b>Todavía no guardaste ninguna propiedad.</b><p>Tocá el corazón en una tarjeta o en una ficha y queda acá para compararlas después.</p><a class="p-btn" href="buscar.html?op=alquiler">Ver propiedades</a></div>');
  }
  function renderAlertas(){
    const al = BP.alerts.get();
    content.innerHTML = `<h1 class="p-h2">Búsquedas y alertas</h1><p class="p-sub">Te avisamos por mail cuando entra una propiedad que coincide o cuando una que seguís baja de precio.</p>` + (al.length ? `<table class="p-tbl"><thead><tr><th>Creada</th><th>Tipo</th><th>Detalle</th><th></th></tr></thead><tbody>${al.map((a, i) => `<tr><td data-th="Creada">${new Date(a.creada).toLocaleDateString('es-AR')}</td><td data-th="Tipo">${a.tipo === 'precio' ? 'Baja de precio' : 'Búsqueda guardada'}</td><td data-th="Detalle">${a.tipo === 'precio' ? `<a href="propiedad.html?id=${encodeURIComponent(a.avisoId)}" style="text-decoration:underline">${BP.esc(a.avisoId)}</a>` : `<a href="${BP.esc(a.url||'buscar.html')}" style="text-decoration:underline">${a.filtros ? [a.filtros.op, (a.filtros.zonas||[]).map(BP.zonaLabel).join(', ')].filter(Boolean).join(' · ') : 'búsqueda'}</a>`}</td><td><button type="button" class="p-btn p-btn-sm" data-del="${i}">Quitar</button></td></tr>`).join('')}</tbody></table>` : '<div class="p-empty p-ensena"><b>Todavía no creaste ninguna alerta.</b><p>Desde el catálogo, con los filtros puestos, tocá "Crear alerta": te avisamos por mail cuando entra una propiedad que coincide.</p><a class="p-btn" href="buscar.html?op=alquiler">Ir al catálogo</a></div>');
    content.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { const a = BP.alerts.get(); a.splice(Number(b.dataset.del), 1); BP.alerts.set(a); renderAlertas(); }));
  }
  function renderCuenta(){
    const tipo = pub ? (pub.tipo === 'dueno' ? 'Dueño directo' : pub.tipo === 'desarrolladora' ? 'Desarrolladora' : 'Inmobiliaria o corredor') : '';
    content.innerHTML = `<h1 class="p-h2">Mi cuenta</h1>
      <dl class="p-ficha-cuenta">
        <div><dt>Mail</dt><dd>${BP.esc(BPStore.session.email)}</dd></div>
        <div><dt>En BAIREN</dt><dd data-perfil-txt>${perfil ? BPStore.PERFIL_TXT[perfil] : 'Sin elegir: el panel muestra todo'}</dd></div>
        ${pub ? `<div><dt>Publicador</dt><dd>${BP.esc(pub.nombre)}</dd></div><div><dt>Tipo</dt><dd>${tipo}</dd></div><div><dt>Verificación</dt><dd>${pub.verificado ? BP.ico.check + ' Verificado' : 'Pendiente: la revisa BAIREN'}</dd></div>${pub.matricula ? `<div><dt>Matrícula</dt><dd>${BP.esc(pub.matricula)}</dd></div>` : ''}` : `<div><dt>Publicador</dt><dd>Sin perfil todavía. Se crea al publicar.</dd></div>`}
      </dl>
      <fieldset class="p-perfil-sel"><legend>Qué venís a hacer a BAIREN</legend><p class="p-note">Decide qué muestra el panel, no lo que podés hacer. Lo cambiás cuando quieras.</p><div class="ops">${BPStore.PERFILES.map(p => `<label${p === perfil ? ' class="on"' : ''}><input type="radio" name="perfil" value="${p}"${p === perfil ? ' checked' : ''}><span>${BPStore.PERFIL_TXT[p]}</span></label>`).join('')}</div></fieldset>
      <div class="p-head-acts p-cuenta-acts">${pub ? `<a class="p-btn" href="publicar-aviso.html?paso=perfil">Editar perfil de publicador</a>` : `<a class="p-btn p-btn-fill" href="publicar-aviso.html">Publicar una propiedad</a>`}<button type="button" class="p-btn p-btn-quiet" data-logout>Cerrar sesión</button></div>
      <p class="p-note p-cuenta-priv"><b>Privacidad.</b> Podés pedir acceso, corrección o borrado de tus datos escribiendo a <a href="mailto:contacto@bairengroup.com">contacto@bairengroup.com</a>. Los documentos de verificación se eliminan después de revisarlos.</p>`;
    content.querySelector('[data-logout]').addEventListener('click', async () => { await BPStore.signOut(); location.href = 'index.html'; });
    /* Cambiar el perfil redibuja el riel sin recargar; si no se pudo guardar, vuelve la marca anterior.
       11/9 noche · Mientras guarda, el grupo entero queda deshabilitado (estado "guardando" visible y sin dobles
       clics); la clase .on acompaña a la opción marcada, así el estilo no depende solo de :has(). */
    const marcarPerfil = () => content.querySelectorAll('.p-perfil-sel label').forEach(l => l.classList.toggle('on', !!l.querySelector('input:checked')));
    content.querySelectorAll('.p-perfil-sel [name=perfil]').forEach(r => r.addEventListener('change', async () => {
      const antes = perfil; const fs = r.closest('fieldset'); marcarPerfil();
      fs.disabled = true;
      try { await BPStore.setPerfil(r.value); }
      catch (e) { const prev = content.querySelector(`.p-perfil-sel [value="${antes}"]`); if (prev) prev.checked = true; else r.checked = false; marcarPerfil(); BP.toast('No se pudo guardar: ' + (e.message || e), 'error'); return; }
      finally { fs.disabled = false; }
      perfil = r.value; riel = BPStore.rielDe(perfil); renderNav(); marcarActiva();
      const dd = content.querySelector('[data-perfil-txt]'); if (dd) dd.textContent = BPStore.PERFIL_TXT[perfil];
      BP.toast(BPStore.session.demo ? 'En modo demo no se guarda.' : 'Listo. El panel ya muestra lo que te sirve.');
    }));
  }
  render();
})();
});
</script>
</body>
</html>
