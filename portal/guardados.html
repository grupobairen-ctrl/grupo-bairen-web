<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>/* El velo de carga: navy desde el primer byte, se retira cuando la página está lista de verdad:
     load + ningún esqueleto a la vista + las fotos del primer pantallazo cargadas. Si eso pasa en menos de
     500 ms nadie lo ve; si se vio, se queda hasta los 800 ms para no titilar; a los 8 s se va pase lo que
     pase. Inline y sin dependencias: si un script no carga, el velo se va igual. */
  (function(h){h.classList.add('cargando');var V=window.BPVelo={retenido:false,cargado:false},obs=null,timer=null;
  var ESQ='.p-skel,.p-skel-card,.p-skel-ficha,.p-skel-line,.p-skel-vcard,.p-skel-panel,.p-skel-form,.p-skel-bloque,.p-skel-cta,.p-fhero-skel,.h-esq';
  V.soltar=function(){if(!h.classList.contains('cargando'))return;V.retenido=false;h.classList.remove('cargando');if(obs)obs.disconnect();try{document.dispatchEvent(new Event('bairen:velo'))}catch(e){}};
  V.retener=function(){V.retenido=true};V.seguir=function(){V.retenido=false;pedir()};
  /* Visible de verdad: checkVisibility ve lo que un rectángulo no (un details cerrado, content-visibility) */
  var vis=function(e){return e.checkVisibility?e.checkVisibility({contentVisibilityAuto:true,visibilityProperty:true}):e.getClientRects().length>0};
  V.lista=function(){if(!V.cargado)return false;var es=document.querySelectorAll(ESQ),i;for(i=0;i<es.length;i++)if(vis(es[i]))return false;
    var im=document.images,H=innerHeight,W=innerWidth,r;for(i=0;i<im.length;i++){if(im[i].complete||!im[i].getAttribute('src')||!vis(im[i]))continue;r=im[i].getBoundingClientRect();if(r.width>0&&r.bottom>0&&r.top<H&&r.right>0&&r.left<W)return false}return true};
  var revisar=function(){if(V.retenido||timer||!V.lista())return;var t=performance.now();timer=setTimeout(function(){if(!V.retenido)V.soltar()},t>500?Math.max(0,800-t):0)};
  var pedido=false,pedir=function(){if(pedido)return;pedido=true;requestAnimationFrame(function(){pedido=false;revisar()})};
  addEventListener('load',function(){V.cargado=true;pedir()});
  document.addEventListener('DOMContentLoaded',function(){obs=new MutationObserver(pedir);obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','src','hidden','style']})});
  document.addEventListener('load',pedir,true);document.addEventListener('error',pedir,true);
  setTimeout(V.soltar,8000)})(document.documentElement);</script>

<!-- 8/10/2026 · Tanda 2 · Guardados: la pestaña de la barra de abajo. Las propiedades marcadas con el corazón (viven en
     este navegador, BP.favs; con sesión, también en portal.favoritos) y, con sesión, las alertas de búsqueda
     (BPStore.cargarAlertas, que trae las de la cuenta y las funde con las de este navegador). -->
<body class="p-product p-guardados">
<div class="p-velo" aria-hidden="true"><span class="w">BAIREN</span></div>
<div id="pHeader"></div>
<main class="p-guardados-in" id="contenido">
  <h1 class="p-gtit" data-i18n="tab_guardados">Guardados</h1>
  <div id="favs" aria-busy="true"><div class="p-grid"><div class="p-skel-vcard" aria-hidden="true"></div><div class="p-skel-vcard" aria-hidden="true"></div></div></div>
  <section class="p-galertas" id="alertasSec" hidden aria-labelledby="alertasT">
    <h2 class="p-sec-t" id="alertasT" data-i18n="alertas_t">Alertas</h2>
    <ul class="p-galertas-lista" id="alertas"></ul>
  </section>
</main>
<div id="pFooter"></div>

<script src="supabase-portal.js?v=20261008f" defer></script><script src="js/errores.js?v=20261008f" defer></script>
<script src="../mapa-barrios.js?v=20261008f" defer></script>
<script src="js/motion.js?v=20261008f" defer></script><script src="js/bairen-motion.js?v=20261008f" defer></script><script src="js/i18n-portal.js?v=20261008f" defer></script><script src="js/ui.js?v=20261008f" defer></script><script src="js/store.js?v=20261008f" defer></script>
<script src="js/data.js?v=20261008f" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
(async function(){
  BP.header(); BP.footer(); if (window.BPStore) BPStore.init();
  document.title = BP.t('tab_guardados', 'Guardados') + ' · BAIREN';
  const host = document.getElementById('favs');
  const vacio = () => `<div class="p-gvacio"><p>${BP.t('guard_vacio', 'Todavía no guardaste propiedades.')}</p><a class="p-btn p-btn-fill" href="buscar.html">${BP.t('tab_buscar', 'Buscar')}</a></div>`;
  const pausada = (id, d) => `<article class="prop-card p-tj p-tj-pausada" data-flip="${BP.esc(id)}">
    <div class="tj-link"><span class="tj-foto">${d.f ? `<img src="${BP.esc(BP.sbImg(d.f, 700))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}<span class="tj-tag res">${BP.t('guard_pausada', 'Pausada por ahora')}</span></span>
    <span class="tj-cuerpo">${d.c ? `<span class="tj-calle">${BP.esc(d.c)}</span>` : ''}<span class="tj-titulo">${BP.esc(d.t || BP.t('guard_una_guardada', 'Una propiedad guardada'))}</span></span></div>
    <button type="button" class="tj-fav on" data-fav="${BP.esc(id)}" aria-pressed="true" aria-label="${BP.esc(BP.t('guard_quitar', 'Quitar de Guardados'))}">${BP.ico.heartFill}</button></article>`;
  /* Lo último que se guardó, primero */
  const ids = BP.favs.get().slice().reverse();
  if (!ids.length) { host.innerHTML = vacio(); host.removeAttribute('aria-busy'); }
  else {
    await BP.probePretty();
    try {
      const { avisos } = await BPData.load();
      /* lanz3-visitante · Una guardada que hoy no está publicada (quien publica la pausó) no desaparece ni deja la
         página en "Todavía no guardaste": queda con su foto y su título, marcada "Pausada por ahora", y el corazón
         sirve para sacarla. Lo que se ve sale de lo anotado al guardarla (BP.favInfo) o, en modo local, de la base. */
      const info = BP.favInfo.get();
      const tarjetas = [];
      for (const id of ids) {
        const a = avisos.find(x => x.id === id);
        if (a) { BP.recordarFav(a); tarjetas.push(BPData.cardV(a)); continue; }
        let d = info[id] || null;
        if (!d && window.BPStore && BPStore.getAviso) { try { const r = await BPStore.getAviso(id); if (r) { const x = await BPData.fromStore(r); d = { t: BPData.titulo(x), c: BPData.calle(x), f: (x.fotos || [])[0] || '' }; } } catch (e) { /* sin dato */ } }
        tarjetas.push(pausada(id, d || {}));
      }
      host.innerHTML = tarjetas.length ? `<div class="p-grid">${tarjetas.join('')}</div>` : vacio();
    } catch (err) { console.error(err); BP.estadoError(host, BP.t('guard_err', 'No pudimos cargar tus guardados.')); }
    host.removeAttribute('aria-busy');
  }
  /* Quitar el corazón acá saca la tarjeta; si no queda ninguna, el vacío */
  document.addEventListener('bp:fav', e => {
    if (e.detail.on) return;
    host.querySelectorAll('.prop-card').forEach(c => { if (c.dataset.flip === e.detail.id) c.remove(); });
    if (!host.querySelector('.prop-card')) host.innerHTML = vacio();
  });

  /* Alertas de búsqueda: sólo con sesión. Sin alertas, un enlace para crear una desde la búsqueda. */
  if (!window.BPStore) return;
  await BPStore.init();
  if (!BPStore.session) return;
  const sec = document.getElementById('alertasSec'), ul = document.getElementById('alertas');
  const OP = { alquiler: BP.t('alquilar', 'Alquilar'), mediano: BP.t('card_alq_mediano', 'Mediano plazo'), largo: BP.t('card_alq_largo', 'Tradicional'), venta: BP.t('card_venta', 'Venta') };
  const resumen = f => [
    OP[f.op] || BP.t('guard_todas_ops', 'Todas las operaciones'),
    (f.zonas && f.zonas.length) ? f.zonas.map(BP.zonaLabel).join(', ') : 'Buenos Aires',
    f.amb ? BP.tf('cat_amb_btn', '{n}+ amb.', { n: f.amb }) : null,
    f.pmax ? BP.tf('guard_hasta', 'hasta {p}', { p: BP.fmtPrecio(f.pmax, f.mon === 'ARS' ? 'ARS' : 'USD') }) : null,
    f.q ? '"' + f.q + '"' : null
  ].filter(Boolean).join(' · ');
  /* La búsqueda de la alerta, a partir de sus filtros (la dirección guardada puede ser de otro dominio) */
  const urlDe = x => {
    const f = x.filtros || {}; if (!Object.keys(f).length) return x.url || 'buscar.html';
    const p = new URLSearchParams(); p.set('op', f.op || '');
    Object.keys(f).forEach(k => { if (['op', 'page', 'sort', 'favs', 'key'].indexOf(k) > -1) return; const v = f[k];
      if (v == null || v === '' || v === false || v === 0 || (Array.isArray(v) && !v.length)) return;
      if (k === 'tipo' && v === 'departamento') return;
      if (Array.isArray(v)) v.forEach(z => p.append(k === 'zonas' ? 'zona' : k, z)); else p.set(k, v === true ? '1' : v); });
    return 'buscar.html?' + p.toString();
  };
  const pintar = lista => {
    const busq = lista.filter(x => x.tipo !== 'precio');
    ul.innerHTML = busq.length ? busq.map((x, i) => `<li><a href="${BP.esc(urlDe(x))}">${BP.ico.bell}<span>${BP.esc(resumen(x.filtros || {}))}</span></a><button type="button" class="p-galerta-x" data-i="${i}" aria-label="${BP.esc(BP.t('guard_quitar_alerta', 'Quitar la alerta'))}">${BP.ico.x}</button></li>`).join('')
      : `<li class="p-galertas-vacio"><a href="buscar.html">${BP.ico.bell}<span>${BP.t('guard_crear_alerta', 'Crear una alerta')}</span></a></li>`;
    ul.querySelectorAll('.p-galerta-x').forEach(b => b.addEventListener('click', async () => {
      const quitada = busq[Number(b.dataset.i)]; const todas = BP.alerts.get(); const j = todas.findIndex(x => BPStore.mismaAlerta(x, quitada));
      if (j > -1) { todas.splice(j, 1); BP.alerts.set(todas); }
      pintar(BP.alerts.get()); BP.toast(BP.t('cat_toast_alerta_quitada', 'Alerta quitada.'));
      const r = await BPStore.borrarAlerta(quitada);
      if (r && r.error) { const t = BP.alerts.get(); if (!t.some(x => BPStore.mismaAlerta(x, quitada))) { t.push(quitada); BP.alerts.set(t); } pintar(BP.alerts.get()); BP.toast(BP.t('cat_toast_alerta_no_quitada', 'No pudimos quitar la alerta. Probá de nuevo.'), 'error'); }
    }));
  };
  sec.hidden = false; pintar(BP.alerts.get());
  try { pintar(await BPStore.cargarAlertas()); } catch (e) { /* queda lo de este navegador */ }
})();
});
</script>
</body>
</html>
