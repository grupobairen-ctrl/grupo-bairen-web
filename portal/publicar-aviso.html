  /* "Los subo después": queda anotado en esta visita y sigue */
  function saltar(){ if (ocupado) return; try { sessionStorage.setItem(DOCS_DESPUES, '1'); } catch (e) { /* nada */ } const dest = desdeRevisar ? 'revisar' : siguiente(actual); if (dest === 'revisar') desdeRevisar = false; ir(dest, 1); }
  function actualizarSalir(){
    const conAviso = haySesion() && !!pub && !modoPerfil && !modoDocs && ['propiedad', 'precio', 'fotos', 'descripcion', 'revisar'].indexOf(actual) > -1;
    const dir = actual === 'propiedad' ? valor('direccion') : aviso.direccion;
    bSalir.textContent = conAviso && String(dir || '').trim() ? T('pub2_salir_guardado', 'Salir, queda guardado') : T('pub2_salir', 'Salir');
  }
  /* Un error de la pantalla anterior no se queda flotando en la siguiente */
  const apagarError = () => { const t = document.getElementById('bpToast'); if (t && t.classList.contains('err')) t.classList.remove('on'); };
  function ir(nombre, dir){
    actual = nombre; if (nombre === 'empresa') mostroEmpresa = true; if (nombre === 'documentos') mostroDocs = true;
    apagarError(); document.body.classList.remove('pf-doble');
    /* Tus documentos cuenta solo para el dueño que pasa por ahí */
    const orden = ORDEN.filter(x => x !== 'documentos' || mostroDocs || modoDocs || pedirDocs()), i = orden.indexOf(nombre);
    prog.querySelector('i').style.width = ((i + 1) / orden.length * 100) + '%'; prog.setAttribute('aria-valuemax', String(orden.length)); prog.setAttribute('aria-valuenow', String(i + 1)); prog.setAttribute('aria-valuetext', TF('pub2_paso_de', 'Paso {n} de {t}', { n: i + 1, t: orden.length }));
    document.body.classList.remove('pf-ancho'); bAtras.hidden = false;
    pant = PANT[nombre]() || {};
    pie(pant.boton || (desdeRevisar ? T('pub2_listo', 'Listo') : T('pub2_continuar', 'Continuar')), pant.botonClase, pant.secundario);
    actualizarSalir();
    document.body.dataset.pantalla = nombre;
    el.classList.remove('entra-d', 'entra-i'); void el.offsetWidth; el.classList.add(dir === -1 ? 'entra-i' : 'entra-d');
    window.scrollTo(0, 0);
    const h = document.getElementById('pfT'); if (h) { try { h.focus({ preventScroll: true }); } catch (e) { /* nada */ } }
  }
  async function continuar(){
    if (ocupado) return; const b = document.getElementById('pfSeguir'); if (!b || b.disabled) return;
    ocupado = true; ocupar(b, true, actual === 'revisar' ? (enCurso() ? T('pub2_guardando', 'Guardando…') : T('pub2_enviando', 'Enviando…')) : T('pub2_guardando', 'Guardando…'));
    let sigue = false;
    try {
      if (pant.leer) pant.leer();
      const ok = pant.validar ? await pant.validar() : true;
      if (!ok) return;
      if (pant.alContinuar) { await pant.alContinuar(); return; }
      await autoguardar(true);
      /* Desde Revisar, Continuar vuelve a Revisar; si en la pantalla 1 cambió lo que se publica, sigue en orden (el precio cambia) */
      if (desdeRevisar && actual === 'que' && claseCambio) desdeRevisar = false;
      const dest = desdeRevisar ? 'revisar' : siguiente(actual);
      if (dest === 'ingreso') { sigue = true; irAIngresar(clase); return; }
      if (dest === 'revisar') desdeRevisar = false;
      sigue = true; ocupado = false; ir(dest, 1);
    } catch (e) { BP.toast(BPStore.errorAlGuardar(e), 'error'); }
    finally { if (!sigue) { ocupado = false; if (document.getElementById('pfSeguir') === b) ocupar(b, false); } }
  }
  async function atras(){
    if (ocupado) return;
    if (subiendo) { BP.toast(T('pub2_espera_fotos', 'Esperá a que terminen de subir las fotos.')); return; }
    if (actual === 'recibido') { location.href = 'panel.html#avisos'; return; }
    if (pant && pant.leer) pant.leer();
    const prev = desdeRevisar ? 'revisar' : anterior(actual);
    if (!prev) { salir(); return; }
    if (desdeRevisar) desdeRevisar = false;
    try { await autoguardar(false); } catch (e) { /* queda en memoria; se guarda al seguir */ }
    ir(prev, -1);
  }
  async function salir(){
    if (subiendo) { BP.toast(T('pub2_espera_fotos', 'Esperá a que terminen de subir las fotos.')); return; }
    if (actual !== 'recibido' && pant && pant.leer) pant.leer();
    if (['propiedad', 'precio', 'fotos', 'descripcion', 'revisar'].indexOf(actual) > -1) { try { await autoguardar(false); } catch (e) { BP.toast(BPStore.errorAlGuardar(e), 'error'); return; } }
    location.href = !haySesion() ? 'publicar.html' : (modoPerfil || modoDocs) ? 'panel.html#cuenta' : 'panel.html#avisos';
  }
  bAtras.addEventListener('click', atras); bSalir.addEventListener('click', salir);

  /* ── Guardar ── */
  async function save(estado){
    const rec = Object.assign({}, aviso); rec.estado_curacion = estado; delete rec.publicador; if (estado === 'en_revision') rec.motivo_rechazo = null;
    if (clase === 'emprendimiento' && tituloAuto) rec.titulo = tituloUnidad(rec.emprendimiento, rec.unidad);
    /* El código lleva la operación (BA-…V-, L-, M-). En "Venta o alquiler" el borrador se guarda antes de elegir entre las
       dos: mientras nunca se envió, si la operación cambió, el código se rehace (saveAviso lo genera de nuevo). */
    const letra = { venta: 'V', alquiler: 'L', mediano: 'M' }[rec.operacion];
    if (rec.codigo && aviso.estado_curacion === 'borrador' && letra && !new RegExp(letra + '-[A-Z0-9]{3}$').test(rec.codigo)) delete rec.codigo;
    const saved = await BPStore.saveAviso(rec);
    aviso.id = saved.id; aviso.codigo = saved.codigo; aviso.slug = saved.slug; aviso.estado_curacion = estado;
    return saved;
  }
  /* El borrador se guarda al pasar de pantalla: con calle y altura (la base la exige; sin ella no se crea un aviso vacío).
     Un aviso en revisión o publicado se guarda solo con la pantalla validada, y conserva su estado. */
  /* La lista de unidades viaja con el borrador (unidades_borrador). Un aviso que dejó de ser emprendimiento la borra. */
  const conLista = () => clase === 'emprendimiento' && !unaUnidad && aviso.estado_curacion === 'borrador';
  const listaLimpia = () => unidades.map(u => ({ id: u.id || null, unidad: u.unidad || '', ambientes: u.ambientes || null, m2_total: u.m2_total || null, precio: u.precio != null ? u.precio : null, estado: u.estado === 'reservado' ? 'reservado' : 'disponible' }));
  async function autoguardar(validado){
    if (!haySesion() || !pub || modoPerfil || modoDocs) return false;
    if (clase === 'emprendimiento') aBase();
    if (!tieneDireccion()) return false;
    if (enCurso() && !validado) return false;
    if (conLista()) { if (aviso.id) unidades[0].id = aviso.id; aviso.unidades_borrador = listaLimpia(); }
    else if (aviso.unidades_borrador) aviso.unidades_borrador = null;
    await save(estadoAlGuardar());
    /* Sin la columna en la base (antes de la 23), la lista se recuerda en este navegador */
    if (conLista() && aviso.id) { unidades[0].id = aviso.id; if (!listaEnBase()) { try { localStorage.setItem(UKEY(aviso.id), JSON.stringify(listaLimpia())); } catch (e) { /* sin lugar: la lista vive en esta pestaña */ } } }
    return true;
  }
  /* Enviar: se revisa todo otra vez (con "Cambiar" se pudo saltear algo), y un emprendimiento crea un aviso por unidad */
  async function enviar(){
    const falta = incompletas()[0];
    if (falta) { desdeRevisar = false; ir(falta, -1); if (falta !== 'empresa') setTimeout(() => { if (pant.leer) pant.leer(); if (pant.validar) pant.validar(); }, 380); return; }
    const eraEnCurso = enCurso();
    if (!eraEnCurso) { const c = document.getElementById('acepto'); if (!c || !c.checked) { BP.errorCampo('acepto', T('pub2_err_acepto', 'Marcá la casilla para enviar.')); return; } }
    const estado = eraEnCurso ? aviso.estado_curacion : 'en_revision';
    let n = 1;
    if (clase === 'emprendimiento') {
      /* Enviada, la lista ya no hace falta: cada unidad es su aviso */
      aBase(); if (aviso.unidades_borrador || 'unidades_borrador' in aviso) aviso.unidades_borrador = null;
      await save(estado); unidades[0].id = aviso.id;
      const base = Object.assign({}, aviso);
      for (let i = 1; i < unidades.length; i++) {
        const u = unidades[i];
        const rec = Object.assign({}, base, { unidad: u.unidad, ambientes: u.ambientes, m2_total: u.m2_total, precio: u.precio, estado: u.estado, estado_curacion: estado, motivo_rechazo: null, titulo: tituloAuto ? tituloUnidad(base.emprendimiento, u.unidad) : base.titulo, fotos: base.fotos.map(f => ({ url: f.url })) });
        delete rec.publicador; delete rec.id; delete rec.codigo; delete rec.unidades_borrador; rec.slug = null;
        if (u.id) { rec.id = u.id; rec.slug = u.slug || null; if (u.codigo) rec.codigo = u.codigo; }
        const s = await BPStore.saveAviso(rec); u.id = s.id; u.slug = s.slug; u.codigo = s.codigo;
        botonOcupado(true, TF('pub2_enviando_n', 'Enviando {n} de {t}…', { n: i + 1, t: unidades.length }));
      }
      n = unidades.length;
      try { localStorage.removeItem(UKEY(aviso.id)); } catch (e) { /* nada */ }
    } else await save(estado);
    /* Aviso al equipo: uno por envío (en un emprendimiento, el de la primera unidad; la cola de curación muestra todas) */
    if (!eraEnCurso && BPStore.notify && aviso.id) Promise.resolve(BPStore.notify('revision', { aviso_id: aviso.id })).catch(() => {});
    recibido(eraEnCurso, n);
  }
  function recibido(cambios, n){
    actual = 'recibido'; document.body.dataset.pantalla = 'recibido'; desdeRevisar = false;
    prog.querySelector('i').style.width = '100%'; prog.setAttribute('aria-valuenow', prog.getAttribute('aria-valuemax') || '8'); bAtras.hidden = true; bSalir.textContent = T('pub2_salir', 'Salir');
    const sub = cambios ? (aviso.estado_curacion === 'publicado' ? T('pub2_rec_publicado', 'Ya se ven en la ficha.') : T('pub2_rec_en_revision', 'Sigue en revisión. Te avisamos por mail cuando esté publicado.'))
      : n > 1 ? TF('pub2_rec_emp', 'Recibimos {n} unidades. Las revisamos en menos de 48 horas y te avisamos por mail.', { n }) : T('pub2_rec_sub', 'Lo revisamos en menos de 48 horas y te avisamos por mail.');
    el.innerHTML = `<div class="pf-recibido"><span class="sello" aria-hidden="true">${ICO.check}</span>${cab(cambios ? T('pub2_rec_cambios_t', 'Cambios guardados') : T('pub2_rec_t', 'Recibido'), sub)}</div>`;
    apagarError(); document.body.classList.remove('pf-ancho'); document.body.classList.add('pf-doble'); pieIn.className = 'pf-pie-in doble';
    pieIn.innerHTML = `<a class="pf-seguir" id="pfOtra" href="publicar-aviso.html?copia=${encodeURIComponent(aviso.id)}">${T('pub2_otra_parecida', 'Publicar otra parecida')}</a><a class="pf-seg2" href="panel.html#avisos">${T('pub2_ir_panel', 'Ir a mi panel')}</a>`;
    el.classList.remove('entra-d', 'entra-i'); void el.offsetWidth; el.classList.add('entra-d');
    window.scrollTo(0, 0); const h = document.getElementById('pfT'); if (h) { try { h.focus({ preventScroll: true }); } catch (e) { /* nada */ } }
  }

  /* ── Por dónde se entra ── */
  let inicio = 'que';
  if (modoPerfil) inicio = 'empresa';
  else if (modoDocs) inicio = 'documentos';
  else if (!haySesion()) inicio = 'que';
  else if (aviso.id || copiaDe) inicio = clase ? (incompletas()[0] || 'revisar') : 'que';   /* editar o copia: directo a lo que falta */
  else if (clase && vuelta) inicio = siguiente('que');                                      /* volvió de Ingresar con la elección hecha */
  ir(inicio, 1);
})();
});
</script>
