  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#131D2D">
  <script>
/* 6.5 · Cuatro páginas bajaban todo para terminar redirigiendo a Ingresar.
   La comprobación de sesión ocurre acá, antes de los datos y de los assets pesados.
   Solo decide en modo local; con base conectada decide el store, que ya tiene la sesión. */
(function(){try{
  var u=localStorage.getItem('bp_user');
  var sb=Object.keys(localStorage).some(function(k){return k.indexOf('sb-')===0&&k.indexOf('auth-token')>-1});
  var demo=/[?&]demo=1(&|$)/.test(location.search)||sessionStorage.getItem('bp_demo')==='1';
  if((!u||u==='null')&&!sb&&!demo){location.replace('ingresar.html?volver='+encodeURIComponent('publicar'));}
}catch(e){}})();
</script>

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    .p-stepper{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 26px}
    .p-stepper button{display:flex;align-items:center;gap:8px;border:1px solid var(--p-line);background:var(--p-card);border-radius:999px;padding:8px 14px;font:500 .78rem var(--font-body);color:var(--text-mid);cursor:pointer;letter-spacing:.06em}
    .p-stepper button i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--p-tray);color:var(--navy-deeper);display:inline-flex;align-items:center;justify-content:center;font-size:.72rem}
    .p-stepper button.on{border-color:var(--gold);color:var(--navy-deeper)} .p-stepper button.on i{background:var(--gold)} .p-stepper button.done i{background:var(--navy-deeper);color:#fff}
    .p-formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px} .p-formgrid .full{grid-column:1/-1}
    .p-fld label{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dark);margin:0 0 6px}
    .p-fld input,.p-fld select,.p-fld textarea{width:100%;height:46px;border:1px solid var(--p-line);border-radius:8px;padding:0 12px;font:400 .95rem var(--font-body);color:var(--navy-deeper);background:var(--p-card)}
    .p-fld textarea{height:auto;min-height:150px;padding:12px;resize:vertical} .p-fld input:focus,.p-fld select:focus,.p-fld textarea:focus{border-color:var(--gold)}
    .p-fld .hint{font-size:.76rem;color:var(--text-mid);margin-top:4px}
    .p-fld.err input,.p-fld.err select,.p-fld.err textarea{border-color:#B3423C}
    .p-card-panel{background:var(--p-card);border:1px solid var(--p-line);border-radius:var(--p-radius);padding:26px}
    .p-seg{display:flex;gap:8px;flex-wrap:wrap} .p-seg label{border:1px solid var(--p-line);border-radius:999px;padding:9px 14px;font:500 .84rem var(--font-body);cursor:pointer;color:var(--navy-deeper);background:var(--p-card);display:inline-flex;gap:8px;align-items:center} .p-seg input{accent-color:var(--navy-deeper)} .p-seg label:has(input:checked){background:var(--navy-deeper);color:#fff;border-color:var(--navy-deeper)}
    .p-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px} .p-foto{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--p-tray)} .p-foto img{width:100%;height:100%;object-fit:cover} .p-foto .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(19,29,45,.8);color:#fff;cursor:pointer} .p-foto .main{position:absolute;left:6px;bottom:6px;background:var(--gold);color:var(--navy-deeper);font-size:.62rem;padding:3px 7px;border-radius:8px;letter-spacing:.1em;text-transform:uppercase}
    .p-drop{border:1px dashed var(--gold);border-radius:16px;padding:26px;text-align:center;color:var(--text-mid);cursor:pointer;background:var(--p-card)} .p-drop b{display:block;color:var(--navy-deeper);font-weight:500;margin-bottom:4px}
    .p-nav-steps{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
    .p-resumen dt{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dark);margin-top:12px} .p-resumen dd{margin:2px 0 0;color:var(--navy-deeper)}
    @media(max-width:700px){.p-formgrid{grid-template-columns:1fr}}
  </style>

<body>
<div id="pHeader"></div>
<div class="p-band"><div class="p-container" style="max-width:920px">
  <span class="p-eyebrow">Publicar</span>
  <h1 class="p-h2" id="ttl" style="font-size:clamp(1.7rem,3vw,2.3rem)">Publicá tu propiedad</h1>
  <p class="p-sub" id="sub">Cinco pasos. Podés guardar y seguir después desde tu panel.</p>
  <div class="p-stepper" id="stepper" style="margin-bottom:0"></div>
</div></div>
<section class="p-page after-band" role="main"><div class="p-container" style="max-width:920px">
  <div class="p-card-panel" id="panel"><div class="p-skel-form" aria-hidden="true"><div class="p-skel-line t"></div><div class="p-skel-line l"></div><div class="p-skel-line m"></div><div class="p-skel-line l"></div><div class="p-skel-line s"></div></div></div>
  <p class="p-note" id="modeNote" style="margin-top:12px"></p>
</div></section>
<div id="pFooter"></div>
<script src="supabase-portal.js" defer></script><script src="js/motion.js" defer></script><script src="js/bairen-motion.js?v=20260911i" defer></script><script src="js/ui.js?v=20260911i" defer></script><script src="js/store.js?v=20260911i" defer></script><script src="js/data.js?v=20260911i" defer></script>
<script>
/* 6.1 · los scripts externos bajan en paralelo y corren en orden; esto espera a que esten */
document.addEventListener('DOMContentLoaded', function(){
(async function(){
  BP.header(); BP.footer();
  const mode = await BPStore.init();
  if (!BPStore.requireSession('publicar')) return;
  document.getElementById('modeNote').textContent = mode === 'local' ? 'Modo local: el aviso y las fotos quedan en este navegador.' : '';
  const qs = BP.qs(); const editId = qs.get('id'); let perfil = qs.get('perfil') || '';
  const ZONAS = BP.ZONAS; const BARRIOS = { 'Palermo':['Palermo','Palermo Soho','Palermo Hollywood','Palermo Chico','Las Cañitas','Botánico'], 'Recoleta':['Recoleta','Barrio Norte','Barrio Parque'], 'Belgrano':['Belgrano','Belgrano R','Belgrano C','Bajo Belgrano'], 'Núñez':['Núñez'], 'Colegiales':['Colegiales'], 'Puerto Madero':['Puerto Madero'], 'Saavedra':['Saavedra'], 'GBA Norte':['Vicente López','Olivos','La Lucila','Martínez','San Isidro','Acassuso','Beccar','Tigre','Nordelta','Pilar'] };
  const AMEN = ['Pileta','Gimnasio','SUM','Parrilla','Seguridad 24hs','Conserje 24hs','Cochera','Terraza o jardín','Balcón','Ascensor','Laundry','Baulera','Bicicletero','Spa / Sauna','Aire acondicionado','Calefacción central','Pet friendly','Amoblado'];
  const CARACT = ['Apto crédito','Apto profesional','Ofrece financiación','Permite mascotas','Luminoso','Acepta seguro de caución','Contrato digital'];
  let pub = await BPStore.getMyPublicador();
  let aviso = editId ? (await BPStore.getAviso(editId)) : null;
  if (!aviso) aviso = { operacion: 'venta', tipo: 'Departamento', zona: '', barrio: '', amenities: [], caracteristicas: [], cualidades: [], fotos: [], mostrar_direccion: 'aproximada', estado_curacion: 'borrador' };
  if (!perfil && pub) perfil = pub.tipo;
  let step = pub ? 1 : 0;
  if (qs.get('paso') === 'perfil') step = 0;   /* "Editar mi perfil de publicador" desde el panel */
  const STEPS = ['Tu perfil', 'Lo principal', 'Fotos y video', 'Extras', 'Revisar y enviar'];
  const el = document.getElementById('panel');
  const v = (o, k) => o && o[k] != null ? o[k] : '';
  /* Teclado correcto en el celular y autocompletado según el tipo de dato; la pista queda ligada al campo */
  const modoTeclado = (name, type) => type === 'number' ? ' inputmode="numeric"' : type === 'tel' ? ' inputmode="tel" autocomplete="tel"' : type === 'email' ? ' inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"' : type === 'url' ? ' inputmode="url" autocapitalize="off" spellcheck="false"' : (name === 'dni' || name === 'cuit') ? ' inputmode="numeric" autocomplete="off"' : name === 'responsable' ? ' autocomplete="name"' : '';
  const fld = (name, label, type, val, extra, hint) => `<div class="p-fld ${extra && extra.full ? 'full' : ''}" data-fld="${name}"><label for="f-${name}">${label}</label>${type === 'textarea' ? `<textarea id="f-${name}" name="${name}" ${extra && extra.attrs || ''}${hint ? ` aria-describedby="h-${name}"` : ''}>${BP.esc(val)}</textarea>` : type === 'select' ? `<select id="f-${name}" name="${name}" ${extra && extra.attrs || ''}${hint ? ` aria-describedby="h-${name}"` : ''}>${(extra.opts||[]).map(o => `<option value="${o[0]}" ${String(o[0])===String(val)?'selected':''}>${o[1]}</option>`).join('')}</select>` : `<input id="f-${name}" name="${name}" type="${type}" value="${BP.esc(val)}" ${extra && extra.attrs || ''}${modoTeclado(name, type)}${hint ? ` aria-describedby="h-${name}"` : ''}>`}${hint ? `<div class="hint" id="h-${name}">${hint}</div>` : ''}</div>`;

  function renderStepper(){ document.getElementById('stepper').innerHTML = STEPS.map((s, i) => `<button type="button" class="${i===step?'on':i<step?'done':''}" data-s="${i}"${i===step?' aria-current="step"':''} aria-label="Paso ${i+1} de ${STEPS.length}: ${s}"><i aria-hidden="true">${i<step?'✓':i+1}</i>${s}</button>`).join(''); document.querySelectorAll('#stepper button').forEach(b => b.addEventListener('click', () => { const i = Number(b.dataset.s); if (i <= step || pub) { if (step > 0) collect(); step = i; render(); } })); }

  function render(){ renderStepper(); if (step === 0) renderPerfil(); else if (step === 1) renderPrincipales(); else if (step === 2) renderFotos(); else if (step === 3) renderExtras(); else renderRevision(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  const navBtns = (backLabel, nextLabel) => `<div class="p-nav-steps"><div>${step > 0 ? `<button type="button" class="p-btn p-btn-dark" data-back>${backLabel||'Volver'}</button>` : ''}</div><div style="display:flex;gap:8px"><button type="button" class="p-btn" data-save>Guardar borrador</button><button type="button" class="p-btn p-btn-fill" data-next>${nextLabel||'Continuar'} <span class="ic">${BP.ico.arrow}</span></button></div></div>`;

  /* ── Paso 0: perfil del publicador ── */
  function renderPerfil(){
    const p = pub || { tipo: perfil || 'dueno' }; const tipo = p.tipo || 'dueno';
    el.innerHTML = `<h2 class="p-sec-t">Quién publica</h2><p class="p-kicker" style="margin-bottom:16px">Aparece en cada ficha como "Publica: …". BAIREN verifica en menos de 48 horas.</p>
      <div class="p-seg" style="margin-bottom:18px"><label><input type="radio" name="tipo" value="dueno" ${tipo==='dueno'?'checked':''}> Dueño directo</label><label><input type="radio" name="tipo" value="inmobiliaria" ${tipo==='inmobiliaria'?'checked':''}> Inmobiliaria o corredor</label><label><input type="radio" name="tipo" value="desarrolladora" ${tipo==='desarrolladora'?'checked':''}> Desarrolladora</label></div>
      <div class="p-formgrid" id="perfilForm"></div>${p.verificado ? `<p class="p-note" style="margin-top:12px">${BP.ico.check} Publicador verificado.</p>` : ''}
      ${navBtns('', 'Guardar y continuar')}`;
    const form = document.getElementById('perfilForm');
    const draw = t => { form.innerHTML = (t === 'dueno' ? fld('nombre','Nombre y apellido','text',v(p,'nombre'),{attrs:'required'}) + fld('dni','DNI','text',v(p,'dni'),{attrs:'inputmode="numeric"'}) : t === 'inmobiliaria' ? fld('nombre','Inmobiliaria o corredor','text',v(p,'nombre'),{attrs:'required'}) + fld('responsable','Corredor responsable, nombre y apellido','text',v(p,'responsable'),{attrs:'required'}) + fld('matricula','Matrícula','text',v(p,'matricula'),{attrs:'required placeholder="CUCICBA 7527"'},'Se valida contra el registro público del colegio.') + fld('colegio','Colegio','select',v(p,'colegio')||'CUCICBA',{opts:[['CUCICBA','CUCICBA, Ciudad de Buenos Aires'],['CMCPSI','San Isidro, Provincia de Buenos Aires'],['CMCPLZ','Lomas de Zamora, Provincia de Buenos Aires'],['Otro','Otro colegio de Provincia']]}) + fld('cuit','CUIT','text',v(p,'cuit')) : fld('nombre','Razón social','text',v(p,'nombre'),{attrs:'required'}) + fld('cuit','CUIT','text',v(p,'cuit'),{attrs:'required'}) + fld('responsable','Responsable comercial','text',v(p,'responsable')))
      + fld('telefono','Teléfono','tel',v(p,'telefono'),{attrs:'required'}) + fld('whatsapp','WhatsApp, solo números, con 54 9 11','tel',v(p,'whatsapp'),{attrs:'required placeholder="5491123456789"'}) + fld('email','Mail de contacto','email',v(p,'email')||BPStore.session.email,{attrs:'required'}) + fld('descripcion','Presentación corta','textarea',v(p,'descripcion'),{full:true,attrs:'maxlength="400" style="min-height:90px"'},'Dos líneas. Aparece en tu perfil.')
      + `<div class="p-fld full"><label for="docs">Verificación</label><div class="p-note" style="margin-bottom:8px">${t === 'dueno' ? 'Subí tu DNI y un comprobante de titularidad: escritura, ABL o expensas a tu nombre. Lo revisamos y lo borramos.' : t === 'inmobiliaria' ? 'Con la matrícula alcanza: la validamos contra el registro público. Si querés, sumá el certificado.' : 'Subí constancia de CUIT y un documento de la sociedad.'}</div><input type="file" id="docs" multiple accept="image/*,.pdf"></div>`; };
    draw(tipo); form.querySelectorAll('[name=tipo]').length; document.querySelectorAll('[name=tipo]').forEach(r => r.addEventListener('change', () => draw(r.value)));
    bindNav(async () => {
      const t = document.querySelector('[name=tipo]:checked').value; const data = { tipo: t }; form.querySelectorAll('input:not([type=file]),select,textarea').forEach(i => data[i.name] = i.value.trim());
      if (!data.nombre || !data.telefono || !data.whatsapp || (t === 'inmobiliaria' && !data.matricula) || (t === 'desarrolladora' && !data.cuit)) {
        const falta = !data.nombre ? 'nombre' : !data.telefono ? 'telefono' : !data.whatsapp ? 'whatsapp' : (t === 'inmobiliaria' ? 'matricula' : 'cuit');
        const el = form.querySelector('[name=' + falta + ']');
        BP.errorCampo(el, 'Este dato es obligatorio.');
        return false; }
      data.zonas = data.zonas || []; data.badge = t === 'dueno' ? 'Dueño verificado' : t === 'desarrolladora' ? 'Venta directa' : 'Corredor inmobiliario matriculado';
      try { pub = await BPStore.savePublicador(data); const files = Array.from(document.getElementById('docs').files || []); for (const f of files) { const path = await BPStore.uploadDoc(f, pub.id, t === 'dueno' ? 'titularidad' : t === 'inmobiliaria' ? 'matricula' : 'cuit'); await BPStore.requestVerificacion(pub.id, t === 'dueno' ? 'titularidad' : t === 'inmobiliaria' ? 'matricula' : 'cuit', path); } if (!files.length && !pub.verificado) await BPStore.requestVerificacion(pub.id, t === 'inmobiliaria' ? 'matricula' : t === 'desarrolladora' ? 'cuit' : 'dni', null); BP.toast('Perfil guardado.'); return true; } catch (e) { BP.toast('No se pudo guardar: ' + (e.message || e)); return false; }
    });
  }

  /* ── Paso 1: principales ── */
  function renderPrincipales(){
    const a = aviso;
    el.innerHTML = `<h2 class="p-sec-t">Lo principal</h2><p class="p-kicker" style="margin-bottom:16px">Operación, ubicación y los datos que salen en la tarjeta.</p><div class="p-formgrid">
      ${fld('operacion','Operación','select',a.operacion,{opts:[['venta','Venta'],['alquiler','Alquiler, largo plazo'],['mediano','Alquiler, mediano plazo, amoblado']]})}
      ${fld('tipo','Tipo de propiedad','select',a.tipo,{opts:[['Departamento','Departamento'],['Piso','Piso'],['PH','PH'],['Casa','Casa']]})}
      ${fld('zona','Zona','select',a.zona,{opts:[['','Elegí la zona']].concat(ZONAS.map(z=>[z,BP.zonaLabel(z)]))},'Solo las zonas de BAIREN.')}
      ${fld('barrio','Barrio o subzona','select',a.barrio,{opts:[['','Elegí primero la zona']]})}
      ${fld('direccion','Calle y altura','text',a.direccion,{attrs:'required placeholder="Ortega y Gasset 1500"'})}
      ${fld('unidad','Piso y unidad','text',a.unidad,{attrs:'placeholder="4° B"'})}
      ${fld('mostrar_direccion','Dirección en la ficha','select',a.mostrar_direccion,{opts:[['aproximada','Aproximada, solo la cuadra'],['exacta','Exacta']]})}
      ${fld('precio','Precio en USD','number',a.precio,{attrs:'required min="0" step="1"'},'Sin puntos. Para alquiler, por mes.')}
      ${fld('expensas','Expensas por mes, en pesos','number',a.expensas,{attrs:'min="0" step="1"'})}
      ${fld('m2_total','Superficie total, m²','number',a.m2_total,{attrs:'required min="10"'})}
      ${fld('m2_cubierto','Superficie cubierta, m²','number',a.m2_cubierto,{attrs:'min="10"'})}
      ${fld('ambientes','Ambientes','number',a.ambientes,{attrs:'required min="1" max="12"'})}
      ${fld('dormitorios','Dormitorios','number',a.dormitorios,{attrs:'min="0" max="10"'})}
      ${fld('banos','Baños','number',a.banos,{attrs:'min="1" max="8"'})}
      ${fld('cocheras','Cocheras','number',a.cocheras,{attrs:'min="0" max="6"'})}
      ${fld('antiguedad','Antigüedad en años. A estrenar: 0','number',a.antiguedad,{attrs:'min="0" max="150"'})}
      ${fld('titulo','Título del aviso','text',a.titulo,{full:true,attrs:'maxlength="80" placeholder="Piso alto con vista al río y terraza propia"'},'Hasta 80 caracteres. Sin mayúsculas sostenidas ni signos de exclamación.')}
      ${fld('descripcion','Descripción','textarea',a.descripcion,{full:true,attrs:'required minlength="150" maxlength="4000"'},'Mínimo 150 caracteres. Luz, distribución, edificio, cuadra: contala como a alguien que la va a vivir.')}
    </div>
      <div class="p-fld full p-trad" style="margin-top:6px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="button" class="p-btn p-btn-sm" id="btnTraducir">Traducir a inglés y portugués</button><span class="p-note" style="margin:0">Gratis. Revisá el resultado antes de publicar.</span></div>
        <details id="tradBox" ${(a.descripcion_en || a.descripcion_pt) ? 'open' : ''} style="margin-top:10px"><summary class="p-note" style="cursor:pointer">Versiones en inglés y portugués</summary>
          <div class="p-formgrid" style="margin-top:8px">${fld('descripcion_en','Descripción en inglés','textarea',a.descripcion_en,{full:true,attrs:'rows="5"'})}${fld('descripcion_pt','Descripción en portugués','textarea',a.descripcion_pt,{full:true,attrs:'rows="5"'})}</div>
        </details>
      </div>
      ${navBtns()}`;
    const zs = document.getElementById('f-zona'), bs = document.getElementById('f-barrio');
    const fillBarrios = () => { const z = zs.value; bs.innerHTML = z ? BARRIOS[z].map(b => `<option value="${b}" ${b===a.barrio?'selected':''}>${b}</option>`).join('') : '<option value="">Elegí primero la zona</option>'; };
    fillBarrios(); zs.addEventListener('change', fillBarrios);
    const bt = document.getElementById('btnTraducir'); if (bt) bt.addEventListener('click', async () => {
      collect(); const desc = (a.descripcion || '').trim(); if (desc.length < 40) { BP.toast('Escribí primero la descripción en castellano.', 'error'); return; }
      bt.disabled = true; const txt = bt.textContent; bt.textContent = 'Traduciendo…';
      try { const r = await BPStore.traducir(a.titulo || a.direccion || '', desc); a.descripcion_en = r.en.descripcion; a.descripcion_pt = r.pt.descripcion; const en = el.querySelector('[name=descripcion_en]'), pt = el.querySelector('[name=descripcion_pt]'); if (en) en.value = a.descripcion_en; if (pt) pt.value = a.descripcion_pt; document.getElementById('tradBox').open = true; BP.toast('Traducido con ' + (r.motor === 'deepl' ? 'DeepL' : 'MyMemory') + '. Revisá y corregí lo que haga falta.'); }
      catch (e) { BP.toast(e.message || 'No se pudo traducir.', 'error'); }
      finally { bt.disabled = false; bt.textContent = txt; }
    });
    bindNav(async () => { collect(); const req = REQ; let ok = true; req.forEach(k => { const f = document.querySelector(`[data-fld=${k}]`); const bad = !aviso[k] || (k === 'descripcion' && String(aviso[k]).length < 150); f.classList.toggle('err', bad); if (bad) ok = false; }); if (!ok) {
        const k = req.find(x => !aviso[x] || (x === 'descripcion' && String(aviso[x]).length < 150));
        const el = document.querySelector(`[data-fld=${k}]`);
        BP.errorCampo(el && (el.querySelector('input,select,textarea') || el), k === 'descripcion' ? 'La descripción necesita al menos 150 caracteres.' : 'Falta este dato.');
        return false; } return true; });
  }

  /* ── Paso 2: fotos y video ── */
  function renderFotos(){
    const a = aviso;
    el.innerHTML = `<h2 class="p-sec-t">Fotos y video</h2><p class="p-kicker" style="margin-bottom:16px">Mínimo ocho fotos horizontales. La primera es la portada. Si no tenés fotos producidas, marcá la casilla y seguí: las hace BAIREN.</p>
      <button type="button" class="p-drop" id="drop"><b>Tocá para elegir las fotos, o arrastralas acá</b>JPG o PNG, hasta 10 MB cada una.</button><input type="file" id="fotosIn" multiple accept="image/*" hidden aria-label="Fotos de la propiedad">
      <div class="p-fotos" id="fotosGrid"></div>
      <div class="p-formgrid" style="margin-top:18px">${fld('video_url','Video, link de YouTube o Bunny','url',a.video_url,{full:true,attrs:'placeholder="https://"'})}<label class="full" style="display:flex;gap:10px;align-items:center;color:var(--navy-deeper)"><input type="checkbox" id="quieroProd" ${a.quiero_produccion?'checked':''}> Quiero que BAIREN produzca las fotos y el video de la unidad, sin costo.</label></div>
      ${navBtns()}`;
    const inp = document.getElementById('fotosIn'), drop = document.getElementById('drop'), grid = document.getElementById('fotosGrid');
    /* 6.2 · Arrastrar y soltar no existe con el dedo. Cada foto trae botones para moverse,
       ponerse de portada y salir, que funcionan igual con mouse, teclado y pantalla táctil. */
    const draw = async () => {
      const items = [];
      for (let i = 0; i < a.fotos.length; i++) {
        const u = await BPStore.resolveFoto(a.fotos[i].url);
        items.push(`<div class="p-foto" draggable="true" data-i="${i}">
          <img src="${u}" alt="Foto ${i+1} de ${a.fotos.length}">
          ${i===0?'<span class="es-portada">Portada</span>':''}
          <div class="mover">
            <button type="button" data-mov="-1" data-i="${i}" ${i===0?'disabled':''} aria-label="Mover la foto ${i+1} hacia atrás">‹</button>
            <button type="button" data-mov="1" data-i="${i}" ${i===a.fotos.length-1?'disabled':''} aria-label="Mover la foto ${i+1} hacia adelante">›</button>
          </div>
          ${i===0?'':`<button type="button" class="portada" data-portada="${i}" aria-label="Usar la foto ${i+1} como portada">Portada</button>`}
          <button type="button" class="quitar" data-del="${i}" aria-label="Quitar la foto ${i+1}">×</button>
          ${/^https?:/.test(a.fotos[i].url) ? `<button type="button" class="mejorar" data-ia="${i}" aria-label="Mejorar la foto ${i+1} con IA">Mejorar con IA</button>` : ''}
        </div>`);
      }
      grid.innerHTML = items.join('') + (a.fotos.length ? `<p class="p-note" style="grid-column:1/-1">${a.fotos.length} de 8 como mínimo. Ordenalas con las flechas. La primera es la portada.</p>` : '');
      const mover = (de, aI) => { if (aI < 0 || aI >= a.fotos.length) return; const m = a.fotos.splice(de, 1)[0]; a.fotos.splice(aI, 0, m); BP.anunciar('Foto movida al lugar ' + (aI + 1) + ' de ' + a.fotos.length); draw().then(() => { const b = grid.querySelector(`.p-foto[data-i="${aI}"] [data-mov="${aI > de ? 1 : -1}"]`); if (b && !b.disabled) b.focus(); }); };
      grid.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { a.fotos.splice(Number(b.dataset.del), 1); BP.anunciar('Foto quitada, quedan ' + a.fotos.length); draw(); }));
      grid.querySelectorAll('[data-mov]').forEach(b => b.addEventListener('click', () => { const i = Number(b.dataset.i); mover(i, i + Number(b.dataset.mov)); }));
      grid.querySelectorAll('[data-portada]').forEach(b => b.addEventListener('click', () => { mover(Number(b.dataset.portada), 0); }));
      /* Producción con IA: la foto vuelta a sacar (GPT, prompt maestro). Se compara con la original y el que publica decide. */
      grid.querySelectorAll('[data-ia]').forEach(b => b.addEventListener('click', async () => {
        const i = Number(b.dataset.ia); const card = b.closest('.p-foto'); b.disabled = true; b.textContent = 'Produciendo la foto'; if (window.BPM && BPM.produciendo) BPM.produciendo(b, true);
        try {
          const r = await BPStore.producirFoto(a.fotos[i].url, { formato: 'apaisado' });
          const cmp = document.createElement('div'); cmp.className = 'p-iacmp';
          cmp.innerHTML = `<div class="dos"><figure><img src="${a.fotos[i].url}" alt="Original"><figcaption>Original</figcaption></figure><figure><img src="${r.image}" alt="Nueva, con IA"><figcaption>Nueva, con IA</figcaption></figure></div><p class="p-note">Es la misma propiedad, vuelta a fotografiar. Compará ventanas, muebles y textos antes de aceptar.</p><div class="acts"><button type="button" class="p-btn p-btn-sm p-btn-fill" data-usar>Usar la nueva</button><button type="button" class="p-btn p-btn-sm" data-cerrar>Descartar</button></div>`;
          cmp.setAttribute('role', 'dialog'); cmp.setAttribute('aria-modal', 'true'); cmp.setAttribute('aria-label', 'Comparar foto original y nueva'); cmp.tabIndex = -1;
          document.body.appendChild(cmp);
          const focoPrevio = document.activeElement; const escCmp = e => { if (e.key === 'Escape') cerrarCmp(); }; const cerrarCmp = () => { cmp.remove(); document.removeEventListener('keydown', escCmp); if (focoPrevio && focoPrevio.focus) focoPrevio.focus(); };
          document.addEventListener('keydown', escCmp); (cmp.querySelector('[data-usar]') || cmp).focus();
          cmp.querySelector('[data-cerrar]').addEventListener('click', cerrarCmp);
          cmp.querySelector('[data-usar]').addEventListener('click', async () => { const u = cmp.querySelector('[data-usar]'); u.disabled = true; u.textContent = 'Guardando…'; try { const key = aviso.id || aviso.slug || ('nuevo-' + BPStore.session.id.slice(-4)); const url = await BPStore.subirDataUrl(r.image, key, Date.now() % 100000); a.fotos.splice(i + 1, 0, { url, ia: true }); cmp.remove(); BP.toast('Foto nueva agregada al lado de la original. Quitá la que no quieras.'); draw(); } catch (e) { u.disabled = false; u.textContent = 'Usar la nueva'; BP.toast('No se pudo guardar: ' + (e.message || e), 'error'); } });
        } catch (e) { BP.toast(e.message || 'No se pudo producir la foto.', 'error'); }
        finally { if (window.BPM && BPM.produciendo) BPM.produciendo(b, false); b.disabled = false; b.textContent = 'Mejorar con IA'; }
      }));
      let from = null;
      grid.querySelectorAll('.p-foto').forEach(f => {
        f.addEventListener('dragstart', () => from = Number(f.dataset.i));
        f.addEventListener('dragover', e => e.preventDefault());
        f.addEventListener('drop', () => { const to = Number(f.dataset.i); if (from == null || from === to) return; mover(from, to); });
      });
      document.body.dataset.fotos = a.fotos.length;
    };
    const add = async files => { const key = aviso.id || aviso.slug || ('nuevo-' + BPStore.session.id.slice(-4)); let i = a.fotos.length; for (const f of Array.from(files)) { if (!/^image\//.test(f.type)) continue; try { BP.toast('Subiendo foto ' + (i + 1) + '…'); const url = await BPStore.uploadFoto(f, key, i++); a.fotos.push({ url }); } catch (e) { BP.toast('No se pudo subir una foto: ' + (e.message || e)); } } draw(); };
    drop.addEventListener('click', () => inp.click()); inp.addEventListener('change', () => add(inp.files)); drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor = 'var(--navy)'; }); drop.addEventListener('dragleave', () => drop.style.borderColor = ''); drop.addEventListener('drop', e => { e.preventDefault(); drop.style.borderColor = ''; add(e.dataTransfer.files); });
    draw();
    bindNav(async () => { collect(); a.quiero_produccion = document.getElementById('quieroProd').checked; if (a.fotos.length < 8 && !a.quiero_produccion) { BP.toast('Hacen falta ocho fotos y hay ' + a.fotos.length + '. O pedí la producción de BAIREN.', 'error'); return false; } return true; });
  }

  /* ── Paso 3: extras ── */
  function renderExtras(){
    const a = aviso;
    el.innerHTML = `<h2 class="p-sec-t">Extras</h2><p class="p-kicker" style="margin-bottom:16px">Lo que completa la ficha.</p>
      <div class="p-fld"><label>Amenities</label><div class="p-seg">${AMEN.map(x => `<label><input type="checkbox" name="amen" value="${x}" ${a.amenities.indexOf(x)>-1?'checked':''}> ${x}</label>`).join('')}</div></div>
      <div class="p-fld" style="margin-top:18px"><label>Características</label><div class="p-seg">${CARACT.map(x => `<label><input type="checkbox" name="car" value="${x}" ${a.caracteristicas.indexOf(x)>-1?'checked':''}> ${x}</label>`).join('')}</div></div>
      <div class="p-fld" style="margin-top:18px"><label>Cualidades de la unidad</label><p class="p-note" style="margin:0 0 8px">Marcá solo las ciertas. La curación las verifica; solo las verificadas aparecen en la ficha y en la búsqueda.</p><div class="p-seg">${BP.CUALIDADES.map(x => `<label><input type="checkbox" name="cual" value="${x}" ${(a.cualidades||[]).indexOf(x)>-1?'checked':''}> ${x}</label>`).join('')}</div></div>
      ${pub && pub.tipo === 'desarrolladora' ? `<div class="p-fld" style="margin-top:18px"><label>Emprendimiento</label></div><div class="p-formgrid">${fld('emprendimiento','Nombre del emprendimiento','text',a.emprendimiento||'',{attrs:'placeholder="Torre Libertador 5600"'},'Las unidades con el mismo nombre se agrupan en su página.')}${fld('etapa','Etapa de obra','select',a.etapa||'construccion',{opts:[['pozo','En pozo'],['construccion','En construcción'],['terminado','Terminado']]})}${fld('entrega','Entrega','text',a.entrega||'',{attrs:'placeholder="Diciembre 2027"'})}</div>` : ''}
      ${pub && pub.tipo !== 'dueno' ? `<div class="p-formgrid" style="margin-top:18px">${fld('propietario_email','Mail del propietario (opcional)','email',a.propietario_email||'',{full:true,attrs:'placeholder="propietario@mail.com"'},'Con ese mail, el dueño entra a BAIREN y ve las visitas y reservas que registrás. No ve las consultas.')}</div>` : ''}
      <div class="p-formgrid" style="margin-top:18px">${fld('orientacion','Orientación','select',a.orientacion||'',{opts:[['','No informada'],['Norte','Norte'],['Sur','Sur'],['Este','Este'],['Oeste','Oeste'],['Noreste','Noreste'],['Noroeste','Noroeste']]})}${fld('disposicion','Disposición','select',a.disposicion||'',{opts:[['','No informada'],['Frente','Frente'],['Contrafrente','Contrafrente'],['Lateral','Lateral'],['Interior','Interior']]})}${fld('piso','Piso','text',a.piso||'',{attrs:'placeholder="4"'})}${a.operacion !== 'venta' ? fld('plazo','Plazo','text',a.plazo||'',{attrs:'placeholder="3 a 24 meses"'}) : ''}</div>
      ${navBtns()}`;
    bindNav(async () => { collect(); return true; });
  }

  /* ── Paso 4: revisión ── */
  function renderRevision(){
    const a = aviso; const pubName = pub ? pub.nombre : '';
    el.innerHTML = `<h2 class="p-sec-t">Revisar y enviar</h2><p class="p-kicker" style="margin-bottom:10px">Así se va a ver. BAIREN lo revisa en menos de 48 horas y te avisa por mail.</p>
      <div class="p-grid" style="max-width:320px;margin:14px 0 18px" id="prev"></div>
      <dl class="p-resumen" style="margin:0"><dt>Publica</dt><dd>${BP.esc(pubName)} ${pub && pub.matricula ? '· ' + BP.esc(pub.matricula) : ''} ${pub && !pub.verificado ? '<span class="p-badge dueno">Verificación pendiente</span>' : ''}</dd><dt>Operación</dt><dd>${a.operacion === 'venta' ? 'Venta' : a.operacion === 'mediano' ? 'Alquiler a mediano plazo' : 'Alquiler'} · ${BP.esc(a.tipo)}</dd><dt>Ubicación</dt><dd>${BP.esc(a.direccion)} ${BP.esc(a.unidad||'')}, ${BP.esc(a.barrio)} (${BP.zonaLabel(a.zona)}) · dirección ${a.mostrar_direccion}</dd><dt>Precio</dt><dd>${BP.fmtUSD(Number(a.precio))}${a.operacion !== 'venta' ? ' por mes' : ''}${a.expensas ? ' · expensas $ ' + BP.fmtN(a.expensas) : ''}</dd><dt>Datos</dt><dd>${[a.m2_total ? a.m2_total + ' m²' : null, a.ambientes ? a.ambientes + ' amb.' : null, a.dormitorios ? a.dormitorios + ' dorm.' : null, a.banos ? a.banos + ' baños' : null, a.cocheras ? a.cocheras + ' coch.' : null, a.antiguedad != null && a.antiguedad !== '' ? a.antiguedad + ' años' : null].filter(Boolean).join(' · ')}</dd><dt>Fotos</dt><dd>${a.fotos.length}${a.quiero_produccion ? ' · producción de BAIREN solicitada' : ''}</dd><dt>Amenities</dt><dd>${a.amenities.join(', ') || 'Sin informar'}</dd></dl>
      <div class="p-prose" style="margin-top:18px"><div class="box"><b>Condiciones.</b> Al enviar confirmás que la propiedad está en una zona de BAIREN, que tenés derecho a publicarla (titularidad, mandato o matrícula) y que los datos son ciertos. Si no cumple el estándar, te decimos por qué.</div></div>
      <label style="display:flex;gap:10px;align-items:flex-start;margin-top:14px;color:var(--navy-deeper)"><input type="checkbox" id="acepto"><span>Acepto los <a href="legales.html#terminos" style="text-decoration:underline">Términos y condiciones</a> y los <a href="legales.html#criterios" style="text-decoration:underline">criterios de selección</a>.</span></label>
      <div class="p-nav-steps"><button type="button" class="p-btn p-btn-dark" data-back>Volver</button><div style="display:flex;gap:8px"><button type="button" class="p-btn" data-save>Guardar borrador</button><button type="button" class="p-btn p-btn-fill" id="enviar">Enviar a revisión ${BP.ico.arrow}</button></div></div>`;
    (async () => { const m = await BPData.fromStore(Object.assign({}, a, { publicador: pub, id: a.id || 'prev', fotos: a.fotos.map((f, i) => ({ url: f.url, orden: i })) })); document.getElementById('prev').innerHTML = BPData.cardV(m).replace(/href="[^"]*"/, 'href="#"'); })();
    el.querySelector('[data-back]').addEventListener('click', () => { step = 3; render(); });
    el.querySelector('[data-save]').addEventListener('click', async () => { await save('borrador'); BP.toast('Borrador guardado en tu panel.'); });
    document.getElementById('enviar').addEventListener('click', async () => {
      const btn = document.getElementById('enviar');
      /* Antes de enviar se vuelve a mirar lo obligatorio de Principales: con el stepper se puede haber saltado el paso */
      const falta = REQ.find(k => !a[k] || (k === 'descripcion' && String(a[k]).length < 150));
      if (falta) { step = 1; render(); setTimeout(() => { const f = document.querySelector(`[data-fld=${falta}]`); if (f) { f.classList.add('err'); BP.errorCampo(f.querySelector('input,select,textarea') || f, falta === 'descripcion' ? 'La descripción tiene que tener al menos 150 caracteres.' : 'Falta este dato.'); } }, 350); return; }
      if (a.fotos.length < 8 && !a.quiero_produccion) { step = 2; render(); BP.toast('Hacen falta ocho fotos y hay ' + a.fotos.length + '. O pedí la producción de BAIREN.', 'error'); return; }
      if (!document.getElementById('acepto').checked) { BP.errorCampo('acepto', 'Aceptá los términos para enviar.'); return; }
      ocupar(btn, true, 'Enviando…');
      try { await save('en_revision'); BP.toast('Enviado. Te avisamos por mail cuando esté publicado.'); setTimeout(() => location.href = 'panel.html#avisos', 900); } catch (e) { ocupar(btn, false); BP.toast('No se pudo enviar: ' + (e.message || e), 'error'); }
    });
  }

  function collect(){ el.querySelectorAll('input[name]:not([type=checkbox]):not([type=radio]):not([type=file]),select[name],textarea[name]').forEach(i => { const k = i.name; let val = i.value; if (i.type === 'number') val = val === '' ? null : Number(val); if (typeof val === 'string') val = val.trim(); aviso[k] = val; }); const am = el.querySelectorAll('[name=amen]:checked'); if (el.querySelector('[name=amen]')) aviso.amenities = Array.from(am).map(x => x.value); const ca = el.querySelectorAll('[name=car]:checked'); if (el.querySelector('[name=car]')) aviso.caracteristicas = Array.from(ca).map(x => x.value); const cu = el.querySelectorAll('[name=cual]:checked'); if (el.querySelector('[name=cual]')) aviso.cualidades = Array.from(cu).map(x => x.value); if (aviso.operacion === 'mediano') aviso.amoblado = true; else aviso.amoblado = aviso.amenities.indexOf('Amoblado') > -1; if (aviso.video_url) aviso.video_tipo = /youtu/.test(aviso.video_url) ? 'youtube' : /bunny|mediadelivery/.test(aviso.video_url) ? 'bunny' : 'mp4'; }
  async function save(estado){ collect(); const rec = Object.assign({}, aviso); rec.estado_curacion = estado; delete rec.publicador; if (estado === 'en_revision') rec.motivo_rechazo = null; const saved = await BPStore.saveAviso(rec); aviso.id = saved.id; aviso.codigo = saved.codigo; aviso.slug = saved.slug; aviso.estado_curacion = estado; return saved; }
  /* Lo obligatorio del paso Principales; se revisa al avanzar y otra vez antes de enviar */
  const REQ = ['zona','barrio','direccion','precio','m2_total','ambientes','descripcion'];
  /* Un botón ocupado no se vuelve a apretar: queda deshabilitado y dice qué está haciendo */
  function ocupar(btn, on, label){ if (!btn) return; if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.textContent = label || 'Guardando…'; } else { btn.disabled = false; btn.removeAttribute('aria-busy'); if (btn.dataset.label) btn.innerHTML = btn.dataset.label; } }
  function bindNav(validate){
    const b = el.querySelector('[data-back]'); if (b) b.addEventListener('click', () => { if (step > 0) collect(); step = Math.max(0, step - 1); render(); });
    const bs = el.querySelector('[data-save]'), bn = el.querySelector('[data-next]');
    bs.addEventListener('click', async () => { if (bs.disabled) return; if (step === 0) { const ok = await validate(); if (!ok) return; } ocupar(bs, true, 'Guardando…'); try { await save('borrador'); BP.toast('Borrador guardado.'); } catch (e) { BP.toast(e.message || 'No se pudo guardar.', 'error'); } ocupar(bs, false); });
    bn.addEventListener('click', async () => { if (bn.disabled) return; ocupar(bn, true, step === 0 ? 'Guardando…' : 'Guardando…'); const ok = await validate(); if (!ok) { ocupar(bn, false); return; } if (step > 0) { try { await save(aviso.estado_curacion === 'publicado' ? 'publicado' : 'borrador'); } catch (e) { ocupar(bn, false); BP.toast(e.message || 'No se pudo guardar.', 'error'); return; } } step++; render(); });
  }

  if (editId && aviso) document.getElementById('ttl').textContent = 'Editar aviso';
  render();
})();
});
</script>
</body>
</html>
