# Evolution API (WhatsApp no oficial) + su Postgres + Redis.
# El bot (server.js) corre aparte como proceso Node (ver README), porque reusa
# el cerebro de ../chatbot-web y es más simple no meterlo en un contenedor.
#
# Levantar:  docker compose up -d
# Ver QR:    en el navegador, http://TU_VPS:8080/manager  (o por API, ver README)

services:
  evolution:
    image: atendev/evolution-api:v2.2.3   # revisá el último tag v2 en la doc de Evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@postgres:5432/evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_LOCAL_ENABLED=false
      # El webhook apunta al bot. Si el bot corre en el host del VPS:
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:3200/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - evolution_redis:/data

volumes:
  evolution_pg:
  evolution_redis:
