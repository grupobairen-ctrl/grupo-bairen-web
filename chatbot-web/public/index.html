<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bairen — Asistente</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #F4F1EA;
    --navy: #1C2536;
    --gold: #A6884F;
    --line: #E0DACE;
    --bot: #FFFFFF;
    --user: #1C2536;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--cream);
    color: var(--navy);
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 300;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  header .mark {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    letter-spacing: .02em;
  }
  header .sub {
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 4px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.bot {
    background: var(--bot);
    border: 1px solid var(--line);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--user);
    color: var(--cream);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg img {
    height: 150px;
    width: auto;
    max-width: 100%;
    object-fit: cover;
    border-radius: 8px;
    margin: 8px 6px 0 0;
    vertical-align: middle;
  }
  .msg a { color: var(--gold); }
  /* Indicador de "escribiendo…" con puntitos animados (como WhatsApp) */
  .typing { padding: 14px 16px; }
  .dots { display: inline-flex; gap: 4px; align-items: center; }
  .dots i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); opacity: .35;
    animation: blink 1.3s infinite both;
  }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .35; } 40% { opacity: 1; } }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px 22px;
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 15px;
    background: #fff;
    color: var(--navy);
    max-height: 120px;
  }
  textarea:focus { outline: none; border-color: var(--gold); }
  button {
    border: none;
    background: var(--navy);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    letter-spacing: .04em;
    padding: 0 20px;
    border-radius: 12px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">Bairen</div>
    <div class="sub">Asistente</div>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Escribí lo que estás buscando..." autocomplete="off"></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>
</div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  // Historial de la conversación (lo que se manda a Claude)
  const history = [];

  const SALUDO = 'Hola, soy Tomás, de Grupo Bairen. Contame qué estás buscando y te doy una mano para encontrarlo.';

  // Escapa HTML y convierte URLs de imagen en <img> y otras URLs en enlaces
  function render(text) {
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    return esc(text).replace(/https?:\/\/[^\s]+/g, (url) => {
      if (/\.(png|jpe?g|webp|gif)(\?|$)/i.test(url)) return `<img src="${url}" alt="foto" loading="lazy" />`;
      return `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
    });
  }

  function bubble(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    div.innerHTML = render(text);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // ---------------------------------------------------------------------------
  // Ritmo humano: pausas de lectura, "escribiendo…" y mensajes que no llegan juntos.
  // Subí `escala` para un ritmo más lento, tipo WhatsApp (3–5 ≈ esperas de minutos).
  // El default está calibrado para que se sienta humano sin parecer que se colgó.
  // ---------------------------------------------------------------------------
  const RITMO = {
    escala: 1,
    lecturaMin: 900,  lecturaPorChar: 16, lecturaMax: 3500, // pausa "leyendo" tu mensaje
    tipeoBase: 700,   tipeoPorChar: 36,   tipeoMax: 9000,   // "escribiendo…" por burbuja
    pausaEntre: 900,                                        // gap entre una burbuja y la siguiente
  };
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const tLectura = (len) => clamp(RITMO.lecturaMin + len * RITMO.lecturaPorChar, RITMO.lecturaMin, RITMO.lecturaMax) * RITMO.escala;
  const tTipeo   = (s)   => clamp(RITMO.tipeoBase + s.length * RITMO.tipeoPorChar, RITMO.tipeoBase, RITMO.tipeoMax) * RITMO.escala;

  const IMG_RE = /https?:\/\/\S+\.(png|jpe?g|webp|gif)(\?\S*)?/i;

  // Parte la respuesta en "mensajes" como los manda una persona: por párrafo,
  // con las fotos en su propia burbuja (después del texto que las anuncia).
  function splitForHuman(text) {
    const out = [];
    for (const block of text.split(/\n{2,}/).map((s) => s.trim()).filter(Boolean)) {
      const lines = block.split('\n');
      const txt = lines.filter((l) => !IMG_RE.test(l)).join('\n').trim();
      const imgs = lines.filter((l) => IMG_RE.test(l)).join('\n').trim();
      if (txt) out.push(txt);
      if (imgs) out.push(imgs);
    }
    // Un solo bloque largo: lo cortamos en dos por una oración, para que no sea un ladrillo.
    if (out.length === 1 && out[0].length > 240) {
      const frases = out[0].match(/[^.!?]+[.!?]+|\S[^.!?]*$/g) || [out[0]];
      if (frases.length > 1) {
        const mid = Math.ceil(frases.length / 2);
        return [frases.slice(0, mid).join(' ').trim(), frases.slice(mid).join(' ').trim()].filter(Boolean);
      }
    }
    return out.length ? out : [text];
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // Saludo inicial (no se manda a la API, es solo visual)
  bubble('assistant', SALUDO);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    bubble('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    // El fetch corre en paralelo con la pausa humana de "lectura": la respuesta
    // puede estar lista, pero igual no la mostramos hasta que sea natural mostrarla.
    let typing = showTyping();
    const replyPromise = fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    }).then(async (res) => {
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error');
      return data.reply;
    });

    try {
      const [reply] = await Promise.all([replyPromise, sleep(tLectura(text.length))]);
      const chunks = splitForHuman(reply);

      for (let i = 0; i < chunks.length; i++) {
        if (!typing) typing = showTyping();
        await sleep(tTipeo(chunks[i]));            // "escribiendo…" un rato proporcional al largo
        typing.classList.remove('typing');         // la misma burbuja se vuelve el mensaje
        typing.innerHTML = render(chunks[i]);
        typing = null;
        log.scrollTop = log.scrollHeight;
        if (i < chunks.length - 1) await sleep(RITMO.pausaEntre * RITMO.escala); // las burbujas no llegan juntas
      }
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      if (typing) { typing.classList.remove('typing'); typing.textContent = 'Hubo un problema. Probá de nuevo en un momento.'; }
      else bubble('assistant', 'Hubo un problema. Probá de nuevo en un momento.');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      log.scrollTop = log.scrollHeight;
      input.focus();
    }
  });

  // Enter envía, Shift+Enter hace salto de línea; textarea que crece
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
