<style>
/* ─── TOKENS ─────────────────────────────────────────────────────────── */
:root {
  --navy:#2A3A52; --navy-dark:#1E2A3F; --navy-deeper:#131D2D; --navy-darker:#131D2D;
  --gold:#C2A968; --gold-dark:#8A7547; --gold-light:#DECDA0;
  --white:#FBFAF6; --off-white:#EEE5D0; --gray-light:#D6D2C8;
  --text-dark:#1A2538; --text-mid:#6B7589;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'Jost',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --ease-snap:cubic-bezier(0.16,1,0.3,1);
  --nav-h:64px;
  --filter-h:52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
/* lienzo del documento en el azul del footer (rebote y bajo-footer azules) */
html{scroll-behavior:smooth;background:var(--navy-dark);}
body{font-family:var(--font-body);font-weight:300;color:var(--navy);background:var(--off-white);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:var(--font-body);}

/* ─── NAV ─────────────────────────────────────────────────────────────── */
nav {
  position:fixed;inset:0 0 auto 0;z-index:1000;
  height:var(--nav-h);
  background:var(--navy-deeper);
  border-bottom:1px solid var(--gold);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;
  gap:12px;
}
.nav-logo{display:flex;align-items:center;}
.nav-links{display:flex;gap:24px;}
.nav-links a{
  font-size:.68rem;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(255,255,255,.6);
  transition:color .22s;
}
.nav-links a:hover{color:var(--gold);}
.nav-back{
  font-size:.66rem;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--gold);
  border:1px solid rgba(194,169,104,.35);padding:8px 16px;
  transition:background .22s,color .22s;white-space:nowrap;
  flex-shrink:0;
}
.nav-back:hover{background:var(--white);color:var(--navy);border-color:var(--white);}
@media(max-width:700px){
  .nav-links{display:none;}
  nav{padding:0 20px;}
}

/* ─── BURGER ──────────────────────────────────────────────────────────── */
.burger{display:none;flex-direction:column;gap:5px;padding:5px;flex-shrink:0;background:none;border:none;cursor:pointer;}
.burger span{display:block;width:22px;height:1.5px;background:var(--gold);transition:transform .3s var(--ease),opacity .3s;}
.burger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.burger.open span:nth-child(2){opacity:0;}
.burger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
@media(max-width:700px){.burger{display:flex;}}

.mobile-menu{
  position:fixed;top:var(--nav-h);left:0;right:0;
  background:var(--navy-deeper);border-bottom:1px solid rgba(194,169,104,.18);
  z-index:999;padding:28px 24px;
  transform:translateY(-110%);
  visibility:hidden;
  transition:transform .38s var(--ease), visibility 0s .38s;
}
.mobile-menu.open{transform:none;visibility:visible;transition:transform .38s var(--ease), visibility 0s 0s;}
.m-link{
  display:block;padding:13px 0;
  font-family:var(--font-display);font-size:1.1rem;
  color:rgba(255,255,255,.8);
  border-bottom:1px solid rgba(255,255,255,.06);
  transition:color .2s;
}
.m-link:hover{color:var(--gold);}
.lang-switch{display:flex;gap:8px;align-items:center;}
.flag{width:26px;height:18px;padding:0;border:1px solid rgba(255,255,255,.35);background:none;cursor:pointer;overflow:hidden;opacity:.55;transition:opacity .25s cubic-bezier(0.22,1,0.36,1),border-color .25s,transform .2s;display:block;line-height:0;}
.flag svg{width:100%;height:100%;display:block;}
.flag:hover{opacity:.9;transform:translateY(-1px);}
.flag.active{opacity:1;border-color:#DECDA0;}

/* ─── HERO ────────────────────────────────────────────────────────────── */
.cat-hero {
  margin-top:var(--nav-h);
  background:var(--navy-deeper); /* mismo navy que el nav: un solo azul en pantalla */
  padding:52px 28px 44px;
  position:relative;overflow:hidden;
  text-align:center;
}
.cat-hero::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 55% 90% at 50% 120%, rgba(194,169,104,.07) 0%, transparent 70%),
    radial-gradient(ellipse 30% 50% at 10% 50%, rgba(138,117,71,.04) 0%, transparent 60%);
  pointer-events:none;
}
.cat-hero-inner{position:relative;z-index:1;}
.cat-eyebrow{
  font-size:.58rem;letter-spacing:.4em;text-transform:uppercase;
  color:var(--gold);margin-bottom:12px;
  opacity:.8;
}
.cat-title{
  font-family:var(--font-display);
  font-size:clamp(1.75rem,4vw,2.6rem);
  font-weight:500;color:var(--white);
  margin-bottom:8px;line-height:1.12;
}
.cat-sub{
  font-size:.85rem;color:var(--gold-light);
  letter-spacing:.04em;opacity:.75;
}

/* ─── TYPE BANNER ─────────────────────────────────────────────────────── */
.type-banner{
  background:var(--navy-dark);
  border-bottom:1px solid rgba(194,169,104,.12);
  padding:14px 28px;
  display:none;
}
.type-banner-inner{
  max-width:1100px;margin:0 auto;
  display:flex;align-items:center;gap:16px;
}
.type-banner-tag{
  font-size:.54rem;font-weight:700;letter-spacing:.25em;
  text-transform:uppercase;background:var(--gold);
  color:var(--navy);padding:4px 10px;flex-shrink:0;
}
.type-banner-text{
  font-size:.78rem;color:rgba(255,255,255,.52);
  line-height:1.55;letter-spacing:.02em;
}
@media(max-width:700px){
  .type-banner{padding:12px 20px;}
  .type-banner-inner{flex-direction:column;align-items:flex-start;gap:6px;}
}

/* ─── FILTER BAR (una sola familia visual: todo cuadrado, mismo alto,
       misma tipografía que las pills; NO sticky: los filtros no persiguen) ── */
.filters-bar {
  background:#FFFFFF;
  border-bottom:1px solid rgba(42,58,82,.1);
  min-height:var(--filter-h);
  display:flex;align-items:center;flex-wrap:wrap;
  padding:8px 28px;gap:8px;row-gap:8px;
}
.filter-select{
  -webkit-appearance:none;appearance:none;border-radius:0;
  font-size:.66rem;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;height:34px;padding:0 30px 0 14px;
  border:1px solid rgba(42,58,82,.18);
  color:var(--navy);background:transparent;
  font-family:var(--font-body);cursor:pointer;transition:all .22s;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0l4 5 4-5z' fill='%232A3A52'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
.filter-select:hover{border-color:var(--navy);}
.filter-select:focus{outline:none;border-color:var(--navy);}
@media(max-width:900px){.filter-select{font-size:.6rem;padding:0 26px 0 10px;}}

/* Barrio dropdown trigger */
.barrio-trigger {
  position:relative;
  display:flex;align-items:center;gap:7px;
  font-size:.68rem;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--navy);
  border:1px solid rgba(42,58,82,.2);
  background:transparent;
  padding:9px 14px;
  height:34px;
  transition:border-color .22s,background .22s,color .22s;
  white-space:nowrap;
  flex-shrink:0;
}
.barrio-trigger:hover{border-color:var(--navy);}
.barrio-trigger.has-filter{
  background:var(--navy);color:var(--white);
  border-color:var(--navy);
}
.barrio-trigger.has-filter .bt-badge{
  background:var(--gold);color:var(--navy);
}
.bt-label{pointer-events:none;}
.bt-badge{
  min-width:18px;height:18px;border-radius:50%;
  background:var(--gold);color:var(--navy);
  font-size:.55rem;font-weight:700;
  display:none;align-items:center;justify-content:center;
  padding:0 3px;
}
.bt-badge.visible{display:flex;}
.bt-arrow{
  width:8px;height:8px;pointer-events:none;
  border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translateY(-2px);
  transition:transform .22s var(--ease);
  flex-shrink:0;
}
.barrio-trigger.open .bt-arrow{transform:rotate(225deg) translateY(-2px);}

/* Barrio dropdown panel */
.barrio-dropdown {
  position:absolute;
  top:calc(var(--nav-h) + var(--filter-h));
  left:28px;
  background:var(--white);
  border:1px solid rgba(42,58,82,.12);
  box-shadow:0 20px 56px rgba(19,29,45,.22),0 6px 14px rgba(138,117,71,.06);
  padding:20px;
  min-width:320px;
  z-index:500;
  opacity:0;
  transform:translateY(-8px);
  pointer-events:none;
  transition:opacity .22s var(--ease),transform .22s var(--ease);
}
.barrio-dropdown.open{
  opacity:1;transform:none;pointer-events:all;
}
.bd-head{
  font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--text-mid);margin-bottom:14px;
}
.bd-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  margin-bottom:14px;
}
.bd-pill{
  font-size:.66rem;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;
  padding:9px 12px;
  border:1px solid rgba(42,58,82,.15);
  color:var(--navy);background:transparent;
  text-align:left;
  transition:all .2s;
  font-family:var(--font-body);
}
.bd-pill:hover{border-color:var(--navy);background:var(--off-white);}
.bd-pill.active{background:var(--navy);color:var(--white);border-color:var(--navy);}
.bd-clear{
  font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold-dark);background:none;border:none;
  padding:0;cursor:pointer;font-family:var(--font-body);
  transition:color .2s;
  display:none;
}
.bd-clear:hover{color:var(--navy);}
.bd-clear.visible{display:block;}
@media(max-width:500px){
  .barrio-dropdown{left:16px;right:16px;min-width:0;}
}

/* ─── SEPARADOR ───────────────────────────────────────────────────────── */
.filter-sep{width:1px;height:24px;background:rgba(42,58,82,.12);flex-shrink:0;}

/* ─── TIPO PILLS ──────────────────────────────────────────────────────── */
.tipo-pills{display:flex;gap:6px;flex-shrink:0;}
.pill-tipo{
  font-size:.66rem;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;padding:9px 14px;height:34px;
  border:1px solid rgba(42,58,82,.18);
  color:var(--navy);background:transparent;
  transition:all .22s;display:flex;align-items:center;
  font-family:var(--font-body);
  white-space:nowrap;
}
.pill-tipo:hover{border-color:var(--navy);}
.pill-tipo.active{background:var(--navy);color:var(--white);border-color:var(--navy);}

/* ─── SEARCH ──────────────────────────────────────────────────────────── */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.search-wrap{margin-left:auto;display:flex;align-items:center;}
.search-input{
  font-family:var(--font-body);font-size:.78rem;font-weight:300;
  padding:9px 14px;height:34px;
  border:1px solid rgba(42,58,82,.18);
  outline:none;width:190px;
  color:var(--navy);background:#FFFFFF;
  transition:border-color .22s,width .3s var(--ease);
}
.search-input:focus{border-color:var(--gold);width:220px;}
.search-input::placeholder{color:rgba(42,58,82,.38);}
@media(max-width:900px){.search-input{width:140px;}}
@media(max-width:700px){
  :root{--filter-h:64px;}
  .filters-bar{height:auto;min-height:var(--filter-h);padding:12px 16px;gap:8px;flex-wrap:wrap;}
  .filter-sep{display:none;}
  .barrio-trigger,.pill-tipo{height:44px;padding:0 16px;font-size:.7rem;}
  .search-wrap{order:99;flex:1 0 100%;margin:4px 0 2px;}
  .search-input{width:100%;height:44px;font-size:.92rem;padding:0 14px;}
  .search-input:focus{width:100%;}
  .sort-select{height:40px;padding:0 12px;font-size:.78rem;}
  .bd-pill{min-height:40px;padding:10px 12px;font-size:.7rem;}
  .results-bar{padding:14px 16px;}
  .results-count{font-size:.74rem;}
  .card-body{padding:24px 22px 22px;}
  .card-address{font-size:1.18rem;}
  .card-barrio{font-size:.7rem;}
  .card-cta{padding:11px 16px;font-size:.66rem;min-height:44px;display:inline-flex;align-items:center;}
  .card-meta{font-size:.74rem;}
}

/* ─── RESULTADOS BAR ──────────────────────────────────────────────────── */
.results-bar{
  padding:12px 28px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  border-bottom:1px solid rgba(42,58,82,.05);
}
.results-count{
  font-size:.7rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-mid);
}
.sort-select{
  font-family:var(--font-body);font-size:.72rem;
  padding:6px 10px;
  border:1px solid rgba(42,58,82,.15);
  color:var(--navy);background:var(--white);
  outline:none;
}
@media(max-width:700px){.results-bar{padding:10px 16px;}}

/* ─── GRID ────────────────────────────────────────────────────────────── */
.catalog-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:28px;
  padding:32px 32px 96px;
}
@media(max-width:700px){
  .catalog-grid{padding:24px 16px 72px;grid-template-columns:1fr;gap:20px;}
}

/* ─── CARD ────────────────────────────────────────────────────────────── */
.prop-card{
  background:#FFFFFF;
  border:1px solid rgba(42,58,82,.07);
  overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
  cursor:pointer;
  text-decoration:none;color:inherit;
}
@media(hover:hover) and (pointer:fine){
  .prop-card:hover{
    transform:translateY(-4px);
    box-shadow:0 22px 48px rgba(19,29,45,.22),0 6px 14px rgba(138,117,71,.08);
  }
  .prop-card:hover .card-img img{transform:scale(1.04);}
}
.prop-card.hidden{display:none;}

.card-img{
  aspect-ratio:16/9;background:var(--navy);
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.card-img img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;
  transition:transform .5s var(--ease);
}
.card-img-placeholder{
  font-family:var(--font-display);font-size:.6rem;
  letter-spacing:.22em;color:rgba(194,169,104,.25);
  text-transform:uppercase;
}
.card-tag{
  position:absolute;top:14px;left:14px;z-index:2;
  font-size:.56rem;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;padding:5px 11px;
}
.tag-temporal{background:var(--navy);color:var(--white);}
.tag-tradicional{background:rgba(251,250,246,.92);color:var(--navy);border:1px solid rgba(42,58,82,.25);}
.card-status{
  position:absolute;top:14px;right:14px;z-index:2;
  font-size:.54rem;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;padding:5px 11px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.status-reservado{background:rgba(42,58,82,.7);color:rgba(255,255,255,.85);}

.card-body{padding:22px 22px 18px;flex:1;display:flex;flex-direction:column;}
.card-address{
  font-family:var(--font-display);font-size:1.08rem;
  font-weight:500;color:var(--navy);
  margin-bottom:3px;line-height:1.2;
}
.card-barrio{
  font-size:.64rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold-dark);
  margin-bottom:16px;font-weight:500;
}
.card-meta{font-size:.76rem;color:var(--text-mid);letter-spacing:.03em;margin-bottom:16px;}
.card-divider{height:1px;background:rgba(42,58,82,.07);margin-bottom:16px;}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.card-price{font-family:var(--font-display);}
.price-amount{font-size:1.28rem;font-weight:700;color:var(--navy);}
.price-consult{font-size:.85rem;font-weight:500;color:var(--text-mid);font-style:italic;}
.price-period{font-size:.62rem;color:var(--text-mid);letter-spacing:.06em;}
.card-cta{
  font-size:.6rem;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--navy);
  border:1px solid rgba(42,58,82,.25);padding:9px 14px;
  transition:all .22s;font-family:var(--font-body);
  background:transparent;
}
.card-cta:hover{background:var(--navy);color:var(--white);border-color:var(--navy);}

/* ─── EMPTY STATE ─────────────────────────────────────────────────────── */
.empty-state{grid-column:1/-1;text-align:center;padding:80px 24px;}
.empty-title{font-family:var(--font-display);font-size:1.5rem;color:var(--navy);margin-bottom:10px;}
.empty-sub{font-size:.85rem;color:var(--text-mid);}

/* ─── WA FLOAT ────────────────────────────────────────────────────────── */
.wa-btn{
  position:fixed;bottom:26px;right:22px;z-index:800;
  width:52px;height:52px;background:#25D366;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(37,211,102,.3);
  transition:transform .25s;
}
.wa-btn:hover{transform:scale(1.06);box-shadow:0 10px 28px rgba(37,211,102,.4),0 2px 6px rgba(0,0,0,.18);}
.wa-btn svg{width:27px;height:27px;fill:#fff;}
@media(max-width:700px){.wa-btn{width:48px;height:48px;bottom:18px;right:16px;}.wa-btn svg{width:24px;height:24px;}}

/* ─── FOOTER ──────────────────────────────────────────────────────────── */
footer{
  background:var(--navy-dark);border-top:2px solid var(--gold);
  padding:36px 28px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:16px;
}
.ft-copy{font-size:.65rem;color:rgba(255,255,255,.22);letter-spacing:.06em;}

/* ─── REDUCED MOTION ──────────────────────────────────────────────────── */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  .mobile-menu,.barrio-dropdown,.prop-card,.card-img img{transition:none!important;}
  *{animation-duration:.01ms!important;}
}
*:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

/* ═══ V3 · EL MAPA ES EL FILTRO DE BARRIOS ═══════════════════════════════
   Desktop: mapa en el hero, junto a las tarjetas (split view). Sin dropdown.
   Mobile: lista primero; "Barrios" abre el mapa como modo aparte (hoja a
   pantalla completa con los pins y la lista de barrios). Pastilla flotante
   para volver al mapa sin scrollear hasta arriba. */
.cat-hero{text-align:left;padding:40px 28px 36px;}
.cat-hero-inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:960px){.cat-hero-inner{grid-template-columns:minmax(300px,5fr) 7fr;gap:48px;align-items:center;}}
.cat-title{margin-bottom:6px;}
.cat-sub{margin-bottom:14px;}
.cat-panel{min-height:120px;margin-top:4px;}
.cp-default{font-size:.78rem;letter-spacing:.06em;color:rgba(255,255,255,.45);}
.cp-default b{font-weight:500;color:var(--gold-light);}
.cp-name{font-family:var(--font-display);font-size:1.5rem;font-weight:500;color:var(--white);line-height:1.15;display:block;}

.mapa-sheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;max-height:calc(100dvh - 20px);background:var(--navy-deeper);color:var(--white);overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-top:1px solid rgba(194,169,104,.5);box-shadow:0 -18px 48px rgba(0,0,0,.35);padding-bottom:max(12px, env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);}

<script>
window.sbImg = window.sbImg || function(u){return u};
/* ═══════════════════════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════════════════════ */
/* Zonas de barrio: se derivan del inventario real. BairenZonas (mapa-barrios.js)
   agrupa Palermo Soho / Hollywood / Las Cañitas → Palermo, Belgrano C → Belgrano, etc.
   La tarjeta y la ficha siguen mostrando el barrio específico. */
let ZONAS = [];          // [{ key, n }] ordenadas por inventario
let zonaCounts = {};
let mapaHero = null, mapaSheet = null;

// Datos cargados dinámicamente desde Supabase en loadFromSupabase()
let props = [];

/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let activeBarrio = 'todos';
let activeTipo   = 'todos';
let activePrecio = 'todos';
let activeAmb    = 'todos';
let sortMode     = 'default';
let searchQ      = '';
let dropdownOpen = false;

/* ═══════════════════════════════════════════════════════════════
   BARRIO DROPDOWN — build pills
═══════════════════════════════════════════════════════════════ */
function updateBarrioTrigger() {
  const trigger = document.getElementById('barrioTrigger');
  const badge   = document.getElementById('btBadge');
  const clear   = document.getElementById('barrioClear');
  clear.hidden = activeBarrio === 'todos';
  document.getElementById('barrioClearLabel').textContent = ct('borrar_filtro');
  clear.setAttribute('aria-label', ct('clear_aria'));
  if (activeBarrio !== 'todos') {
    trigger.classList.add('has-filter');
    badge.classList.add('visible');
    badge.textContent = zonaCounts[activeBarrio] || '1';
    trigger.querySelector('.bt-label').textContent = activeBarrio;
  } else {
    trigger.classList.remove('has-filter');
    badge.classList.remove('visible');
    trigger.querySelector('.bt-label').textContent = ct('barrios');
  }
}

/* ── Hoja del mapa (mobile): abre como modo aparte, cierra con ×, Escape o "atrás" ── */
let sheetOpener = null;
function openSheet(opener) {
  const sheet = document.getElementById('mapaSheet');
  if (!sheet.hidden) return;
  sheetOpener = opener || document.activeElement;
  const bd = document.getElementById('sheetBackdrop'); bd.hidden = false;
  sheet.hidden = false;
  document.body.classList.add('sheet-open');
  document.getElementById('mapaFab').classList.remove('show');
  document.getElementById('barrioTrigger').setAttribute('aria-expanded', 'true');
  try { history.pushState({ bairenSheet: 1 }, ''); } catch (e) {}
  requestAnimationFrame(() => {
    sheet.classList.add('in'); bd.classList.add('in');
    mountSheetMap();
    document.getElementById('mapaSheetClose').focus({ preventScroll: true });
  });
}
function closeSheet(fromHistory) {
  const sheet = document.getElementById('mapaSheet');
  if (sheet.hidden) return;
  sheet.classList.remove('in');
  const bd = document.getElementById('sheetBackdrop'); bd.classList.remove('in');
  document.body.classList.remove('sheet-open');
  document.getElementById('barrioTrigger').setAttribute('aria-expanded', 'false');
  setTimeout(() => { sheet.hidden = true; bd.hidden = true; }, 340);
  if (!fromHistory && history.state && history.state.bairenSheet) { try { history.back(); } catch (e) {} }
  if (sheetOpener && sheetOpener.focus) sheetOpener.focus({ preventScroll: true });
  updateFab();
}
function closeDropdown() { closeSheet(); }   // compat (lo llama el burger)
window.addEventListener('popstate', () => {
  if (!document.getElementById('mapaSheet').hidden) closeSheet(true);
  if (Array.isArray(props) && props.length) syncBarrioUI();   // la URL vuelve a reflejar el barrio activo
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.getElementById('barrioTrigger').addEventListener('click', e => { e.stopPropagation(); openSheet(e.currentTarget); });
document.getElementById('mapaSheetClose').addEventListener('click', () => closeSheet());
document.getElementById('sheetBackdrop').addEventListener('click', () => closeSheet());
document.getElementById('mapaFab').addEventListener('click', e => openSheet(e.currentTarget));
document.getElementById('barrioClear').addEventListener('click', () => selectBarrio('todos'));

/* Pastilla flotante: aparece cuando la barra de filtros ya salió de pantalla */
let filtersOut = false;
function updateFab() {
  const fab = document.getElementById('mapaFab');
  const sheetOpen = !document.getElementById('mapaSheet').hidden;
  fab.classList.toggle('show', filtersOut && !sheetOpen && window.innerWidth < 960);
}
if (window.IntersectionObserver) {
  new IntersectionObserver(entries => {
    const en = entries[0];
    filtersOut = !en.isIntersecting && en.boundingClientRect.top < 0;
    updateFab();
  }, { rootMargin: '-64px 0px 0px 0px' }).observe(document.getElementById('filtersBar'));
}

/* ═══════════════════════════════════════════════════════════════
   TIPO PILLS
═══════════════════════════════════════════════════════════════ */
document.querySelectorAll('[data-tipo]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-tipo]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTipo = btn.dataset.tipo;
    render();
  });
});

/* ═══════════════════════════════════════════════════════════════
   SORT + SEARCH
═══════════════════════════════════════════════════════════════ */
document.getElementById('sortSelect').addEventListener('change', e => { sortMode = e.target.value; render(); });
document.getElementById('searchInput').addEventListener('input', e => { searchQ = e.target.value; render(); });
document.getElementById('precioSelect').addEventListener('change', e => { activePrecio = e.target.value; render(); });
document.getElementById('ambSelect').addEventListener('change', e => { activeAmb = e.target.value; render(); });

/* ═══════════════════════════════════════════════════════════════
   FILTER + SORT LOGIC
═══════════════════════════════════════════════════════════════ */
function getBarrioGroup(b) {
  return window.BairenZonas.zonaDe(b) || 'Otros';
}

function filtered() {
  return props.filter(p => {
    const bMatch = activeBarrio === 'todos' || getBarrioGroup(p.barrio) === activeBarrio || p.barrio === activeBarrio;
    const tMatch = activeTipo  === 'todos' || p.tipo === activeTipo;
    const q = searchQ.toLowerCase();
    const sMatch = !q || p.dir.toLowerCase().includes(q) || p.barrio.toLowerCase().includes(q);
    let pMatch = true;
    if (activePrecio !== 'todos') {
      if (!p.precio) pMatch = false;                       // precio a consultar: no entra en rangos
      else if (activePrecio === '2500+') pMatch = p.precio >= 2500;
      else {
        const [min, max] = activePrecio.split('-').map(Number);
        pMatch = p.precio >= min && p.precio <= max;
      }
    }
    const aMatch = activeAmb === 'todos' || (activeAmb === '4' ? (p.amb || 0) >= 4 : p.amb === Number(activeAmb));
    return bMatch && tMatch && sMatch && pMatch && aMatch;
  });
}

function sorted(arr) {
  const a = [...arr];
  if (sortMode === 'precio-asc')  return a.sort((x,y) => (x.precio||999999)-(y.precio||999999));
  if (sortMode === 'precio-desc') return a.sort((x,y) => (y.precio||0)-(x.precio||0));
  if (sortMode === 'm2-desc')     return a.sort((x,y) => (y.m2||0)-(x.m2||0));
  return a;
}

function priceHTML(p) {

    const fmt = p.precio.toLocaleString('es-AR').replace(/\./g,'.'); // punto como miles

  }
  return `<div class="card-price"><span class="price-consult">${ct('consult')}</span></div>`;
}

function updateCatalogHero() {
  const title  = document.getElementById('catTitle');
  const sub    = document.getElementById('catSub');
  const banner = document.getElementById('typeBanner');
  const bTag   = document.getElementById('typeBannerTag');
  const bText  = document.getElementById('typeBannerText');

  // La franja "precio final" se eliminó (19/08): agrandaba la banda al cambiar
  // de pestaña y empujaba las tarjetas. El subtítulo ya dice "Todo incluido" y
  // cada tarjeta muestra "por mes · all in": la info vive integrada, sin saltos.
  banner.style.display = 'none';
  if (activeTipo === 'Temporal') {
    title.textContent = ct('title_temp');
    sub.textContent   = ct('sub_temp');
  } else if (activeTipo === 'Tradicional') {
    title.textContent = ct('title_trad');
    sub.textContent   = ct('sub_trad');
  } else {
    title.textContent = ct('title_todos');
    sub.textContent   = ct('sub_todos');
  }
}

   RENDER
═══════════════════════════════════════════════════════════════ */
function render() {
  const grid = document.getElementById('catalogGrid');
  const list = sorted(filtered());
  updateCatalogHero();
  const rc = document.getElementById('resultsCount');
  rc.textContent = `${list.length} ${list.length !== 1 ? ct('count_many') : ct('count_one')}`;
  if (activeBarrio !== 'todos') rc.append(' · ' + activeBarrio);

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-title">${ct('empty_t')}</div><div class="empty-sub">${ct('empty_s')}</div></div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const unidad   = p.unidad && p.unidad !== '-' ? ` · ${p.unidad}` : '';
    const m2txt    = p.m2 ? `${p.m2} m²` : '—';
    const reservado= p.estado === 'Ocupado' || p.estado === 'Reservado';
    const destino  = p.slug ? `/propiedades/${encodeURIComponent(p.slug)}` : '#';
    const ctaTxt   = ct('ver_mas');
    // Una sola línea muda: lo excepcional se etiqueta, lo normal no.
    const metaLine = [
      p.amb ? `${p.amb} ${ct('amb').toLowerCase()}` : null,
      p.m2 ? m2txt : null,
      p.tipo === 'Temporal' ? ct('serv_allin') : null,
    ].filter(Boolean).join(' · ');
    const imgHTML = p.foto
      ? `<img src="${p.fotoEsPortada ? p.foto : window.sbImg(p.foto,700)}" alt="${p.dir} — foto principal" loading="lazy">`
      : `<span class="card-img-placeholder">${ct('foto_ph')}</span>`;

    const aria = `Ver ${p.dir}${unidad} en ${p.barrio}`;
    return `
    <a class="prop-card" href="${destino}" aria-label="${aria.replace(/"/g,'&quot;')}">
      <div class="card-img">
        ${imgHTML}
        <span class="card-tag tag-${p.tipo.toLowerCase()}">${tipoLabel(p.tipo)}</span>
        ${reservado ? `<span class="card-status status-reservado">${(p.reservada_at && (Date.now() - new Date(p.reservada_at).getTime()) < 7*24*3600*1000) ? ct('reservado_sem') : ct('reservado')}</span>` : ''}
        ${p.estado === 'Reservado' && p.fecha_liberacion ? `<div class="badge-liberacion"><span>${formatFechaLiberacion(p.fecha_liberacion)}</span></div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-address">${(p.portadaTitulo && (p.portadaTitulo[L()] || p.portadaTitulo.es)) || `${p.dir}${unidad}`}</div>
        <div class="card-barrio">${p.barrio}</div>
        <div class="card-meta">${metaLine}</div>
        <div class="card-divider"></div>
        <div class="card-footer">
          ${priceHTML(p)}
          <span class="card-cta">${ctaTxt}</span>
        </div>
      </div>
    </a>`;
  }).join('');
}

function readURLParams() {
  const p = new URLSearchParams(window.location.search);
  const pt = p.get('tipo');
  const pb = p.get('barrio');

  if (pt === 'temporal') {
    activeTipo = 'Temporal';
    document.querySelectorAll('[data-tipo]').forEach(b => b.classList.toggle('active', b.dataset.tipo==='Temporal'));
  } else if (pt === 'tradicional') {
    activeTipo = 'Tradicional';
    document.querySelectorAll('[data-tipo]').forEach(b => b.classList.toggle('active', b.dataset.tipo==='Tradicional'));
  }

  if (pb) {
    activeBarrio = window.BairenZonas.zonaDe(pb) || 'Otros';
    updateBarrioTrigger();
  }
}

/* ═══════════════════════════════════════════════════════════════
   SUPABASE — fetch de propiedades publicadas
═══════════════════════════════════════════════════════════════ */
async function loadFromSupabase() {
  try {
    const sb = await window.bairenReady;
    const { data, error } = await sb
      .from('propiedades')
      .select('*, imagenes(url, orden), amenities(nombre)')
      .eq('publicada', true)
      .order('created_at', { ascending: false });
    if (error) throw error;

    props = (data || []).flatMap(p => {
      // Las unidades en venta viven en comprar.html, no en el catálogo de alquileres
      if (p.tipo === 'Venta') return [];
      const primera = (p.imagenes || []).sort((a, b) => a.orden - b.orden)[0];
      // portada_url = imagen especial de catálogo (cargada en el admin);
      // solo se usa acá — la ficha sigue mostrando su galería normal.
      const foto    = p.portada_url || (primera ? primera.url : null);
      // la portada ya viene optimizada 16:9 desde el admin: se sirve tal
      // cual, sin pasar por el transformador de Supabase (recomprime y
      // puede deformar); las fotos de galería sí se achican con sbImg.
      const fotoEsPortada = !!p.portada_url;
      const amList  = (p.amenities || []).map(a => a.nombre);
      const base = {
        id: p.id,
        slug: p.slug,
        barrio: p.barrio,
        dir: p.dir,
        unidad: p.unidad,
        amb: p.ambientes,
        m2: p.m2,
        estado: p.estado,
        reservada_at: p.reservada_at || null,
        amenities: amList,
        foto,
        fotoEsPortada,
        // título especial del catálogo (opcional): reemplaza a la dirección
        // como titular de la tarjeta; la ficha no lo usa. Guarda las 3
        // variantes y se elige por idioma al renderizar (pt/en caen a es).
        portadaTitulo: p.portada_titulo
          ? { es: p.portada_titulo, pt: p.portada_titulo_pt || null, en: p.portada_titulo_en || null }
          : null,
      };
      // tipo='Ambos' se expande en dos items (uno por modalidad) para preservar filtros
      if (p.tipo === 'Ambos') {
        const out = [];
        if (p.precio_temporal)    out.push({ ...base, id: p.id + '-t', tipo: 'Temporal',    precio: Number(p.precio_temporal) });
        if (p.precio_tradicional) out.push({ ...base, id: p.id + '-d', tipo: 'Tradicional', precio: Number(p.precio_tradicional) });
        return out;
      }
      return [{
        ...base,
        tipo: p.tipo,
        precio: Number(p.tipo === 'Temporal' ? p.precio_temporal : p.precio_tradicional) || 0,
      }];
    });
  } catch (err) {
    console.error('[catalogo] Error cargando propiedades:', err);
    props = [];
    const grid = document.getElementById('catalogGrid');
    grid.innerHTML = `<div class="empty-state"><div class="empty-title">${ct('err_t')}</div><div class="empty-sub">${ct('err_s')}</div></div>`;
  }
}

/* ═══════════════════════════════════════════════════════════════
   FECHA LIBERACIÓN
═══════════════════════════════════════════════════════════════ */
function formatFechaLiberacion(fechaStr) {
  if (!fechaStr) return null;

  const fecha = new Date(fechaStr);
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  fecha.setHours(0, 0, 0, 0);

  const diffMs = fecha - hoy;
  const diffDias = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

  if (diffDias === 0) return ct('lib_hoy');
  if (diffDias === 1) return ct('lib_manana');
  if (diffDias > 1 && diffDias <= 7) return ct('lib_dias').replace('{d}', diffDias);

  const opciones = { month: 'long', day: 'numeric', year: 'numeric' };
  const formatted = fecha.toLocaleDateString(ct('lib_locale'), opciones);
  return ct('lib_fecha').replace('{f}', formatted);
}

/* ═══════════════════════════════════════════════════════════════
   ZONAS: el mapa es el filtro (una sola fuente de verdad: activeBarrio)
═══════════════════════════════════════════════════════════════ */
function buildZonaUI() {
  zonaCounts = window.BairenZonas.contar(props);
  ZONAS = Object.keys(zonaCounts).map(k => ({ key: k, n: zonaCounts[k] })).sort((a, b) => b.n - a.n || a.key.localeCompare(b.key));
  if (activeBarrio !== 'todos' && !zonaCounts[activeBarrio]) activeBarrio = 'todos';
  mountHeroMap();
  buildSheetList();
  syncBarrioUI();
}

function onZonaPick(z) { selectBarrio(z === activeBarrio ? 'todos' : z); }

function mountHeroMap() {
  if (window.innerWidth < 960) return;
  const el = document.getElementById('mapaHero');
  if (mapaHero) { mapaHero.setCounts(zonaCounts); return; }
  mapaHero = window.BairenMapa.mount(el, { counts: zonaCounts, active: activeBarrio !== 'todos' ? activeBarrio : null, modo: 'completo', onSelect: onZonaPick, onHover: z => renderPanel(z) });
}
function mountSheetMap() {
  const el = document.getElementById('mapaSheetMap');
  if (mapaSheet) { mapaSheet.setCounts(zonaCounts); mapaSheet.setActive(activeBarrio !== 'todos' ? activeBarrio : null); mapaSheet.refresh(); return; }
  mapaSheet = window.BairenMapa.mount(el, { counts: zonaCounts, active: activeBarrio !== 'todos' ? activeBarrio : null, modo: 'lite',
    onSelect: z => { onZonaPick(z); closeSheet(); } });
}

function buildSheetList() {
  // La hoja es solo el mapa: los nombres ya están en él y "Borrar filtro" vive en la barra de filtros
  document.getElementById('mapaSheetTitle').textContent = ct('sheet_title');
  document.getElementById('mapaSheetClose').setAttribute('aria-label', ct('cerrar'));
  document.getElementById('mapaFabLabel').textContent = ct('barrios');
}

/* Panel de barrio (desktop): muestra el barrio bajo el mouse; si no hay, el elegido; si no, el total */
let panelShown = null;
function renderPanel(hoverZ) {
  const el = document.getElementById('catPanel');
  const z = hoverZ || (activeBarrio !== 'todos' ? activeBarrio : null);
  const key = z || 'todos';
  if (key === panelShown) return;
  panelShown = key;
  if (!z) {
    el.innerHTML = `<p class="cp-default">${ct('panel_todos').replace('{n}', props.length).replace('{z}', ZONAS.length)}</p>`;
  } else {
    const n = zonaCounts[z] || 0;
    el.innerHTML = `<span class="cp-name">${z}</span><span class="cp-n">${n} ${n === 1 ? ct('u_one') : ct('u_many')}</span><p class="cp-desc">${window.BairenZonas.desc(z, L())}</p>`
      + (z === activeBarrio ? `<button type="button" class="cp-clear">${ct('todos_barrios')} ×</button>` : '');
    const c = el.querySelector('.cp-clear'); if (c) c.addEventListener('click', () => selectBarrio('todos'));
  }
  if (el.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches)
    el.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.23,1,.32,1)' });
}

/* Refleja activeBarrio en trigger, panel, mapas, lista de la hoja y URL */
function syncBarrioUI() {
  updateBarrioTrigger();
  panelShown = null; renderPanel(null);
  if (mapaHero)  mapaHero.setActive(activeBarrio !== 'todos' ? activeBarrio : null);
  if (mapaSheet) mapaSheet.setActive(activeBarrio !== 'todos' ? activeBarrio : null);
  try {
    const u = new URL(location.href);
    if (activeBarrio === 'todos') u.searchParams.delete('barrio'); else u.searchParams.set('barrio', activeBarrio);
    history.replaceState(history.state, '', u.pathname + (u.search || '') + u.hash);
  } catch (e) {}
}

function selectBarrio(z) {
  activeBarrio = z || 'todos';
  syncBarrioUI();
  render();
  // Elegir un barrio lleva a sus unidades: si la grilla quedó fuera de pantalla, se desplaza hasta ella
  if (activeBarrio !== 'todos') {
    const bar = document.querySelector('.results-bar');
    const r = bar.getBoundingClientRect();
    if (r.top > window.innerHeight * 0.55 || r.top < 0) bar.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

let lastDesk = window.innerWidth >= 960;
window.addEventListener('resize', () => {
  const desk = window.innerWidth >= 960;
  if (desk !== lastDesk) { lastDesk = desk; if (desk && props.length) mountHeroMap(); if (!desk) closeSheet(); updateFab(); }
});

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
readURLParams();

// Loading state inicial
document.getElementById('catalogGrid').innerHTML = `<div class="empty-state"><div class="empty-title">${ct('loading')}</div></div>`;
document.getElementById('resultsCount').textContent = '';

loadFromSupabase().then(() => { buildZonaUI(); render(); });
document.addEventListener('bairen:lang', () => {
  if (!Array.isArray(props) || !props.length) return;
  buildSheetList(); syncBarrioUI(); render();
});
</script>
